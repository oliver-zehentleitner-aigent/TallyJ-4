# Keep the Why site: context/ as readable pages, plus the dashboard on
# /dashboard/live/ (exported by .github/workflows/ktw-dashboard.yml).
# Build locally: pip install mkdocs-material && mkdocs serve -f .github/keep-the-why-site/mkdocs.yml
site_name: TallyJ 4 — why it is built this way
site_url: https://glittle.github.io/TallyJ-4/
repo_url: https://github.com/glittle/TallyJ-4
repo_name: glittle/TallyJ-4
docs_dir: pages
site_dir: ../../site
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - search.suggest

markdown_extensions:
  - tables
  - attr_list

hooks:
  - context_pages.py

nav:
  - Home: index.md
  - "Why this project is built this way": context/index.md
  - "Dashboard ↗": https://glittle.github.io/TallyJ-4/dashboard/live/
