sage, rowNumber)` | `SendPeopleImportErrorAsync` ← `PeopleImportService` | `PeopleImportPage` |\n| `importComplete` | `ImportPeopleResult` (success, peopleAdded, …) | `SendPeopleImportCompleteAsync` ← `PeopleImportService` | `PeopleImportPage` |\n\n### ElectionPackageImportHub — group `ElectionPackageImport{userId}` (#231)\n\n| Event | Payload | Producer | Primary listeners |\n| ----- | ------- | -------- | ----------------- |\n| `loaderStatus` | `(message, isTemporary)` two args | `SendElectionPackageLoaderStatusAsync` ← JSON / v3 package loaders | `DashboardPage` → `ElectionPackageLoadDialog` |\n\n- **Who:** known tellers only (`JoinSession` rejects guests). Group is **user-scoped** (not election-scoped).\n- **Why user-scoped:** package load creates a new election — no `electionGuid` yet; concurrent known tellers must not steal each other’s stream (v3 `Import{loginId}` parity).\n- **Temp lines:** `isTemporary: true` may replace the last temporary log line on the client (v3 scrolling log behavior).\n- **Hub path:** `/hubs/election-package-import`. FE: `signalrService.connectToElectionPackageImportHub` / `joinElectionPackageImportSession`.\n\n**Rejected alternative:** reuse PeopleImportHub / BallotImportHub with election groups. Rejected — no election exists at start of package load; would require inventing a session GUID or broadcasting to the wrong audience.\n\n**Rejected alternative:** dual path — loaders calling `IHubContext` directly while people/ballot import use the notification service. Rejected — same case-sensitive / producer-drift lesson as #226.\n\n**Rejected alternative:** dual path — `ImportService` / `PeopleImportService` calling `IHubContext` directly while `SendImportProgressAsync` used different PascalCase names (`ImportProgress` / `ImportComplete`). Rejected — case-sensitive mismatch would miss SPA listeners; two producers drift. **Chosen:** one producer (`ISignalRNotificationService`) with camelCase event names matching the SPA.", "reason": null, ": null, "revisit_when": null, "see": [{"locator": "election-analysis.md#tie-break-counts-save-0-and-unset", "uuid": "41bc2d5c-90a3-4e98-8b4d-27615fc7fec2", "date": "2026-10-05", "file": "election-analysis.md", "anchor": "tie-break-counts-save-0-and-unset", "remote": null}], "superseded_by": null, "body": {"text": "Main and Votes-by-* reports used to append `\" / \" + TieBreakCount` whenever `TieBreakRequired` was true. After required ties stopped filling 0, unset became a dangling slash (C#) or the literal `\"null\"` (Vue). Download-all CSV already used empty for null and `\"0\"` for 0.\n\n**Chosen:** format the suffix only when a count is present, including explicit 0. `HasTies` on the main report is `TieBreakRequired` on the elected/extra rows, not whether the display string contains `/`.\n\n**Rejected alternative:** keep string-concatenating the nullable count. Rejected — it hid the unset vs 0 distinction that #198 asked for.", "reason": null, "rejected": ["keep string-concatenating the nullable count. Rejected — it hid the unset vs 0 distinction that #198 asked for."], "consequence": null, "considered": null, "why_open": null}, "refs": ["election-analysis.md"], "git": {"created": {"author": "Glen Little", "date": "2026-09-20", "commit": "edf11c00"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-20", "commit": "edf11c00"}]}, "findings": []}, {"id": "reports.md#front-desk-ballots-analysis-share-one-voted-rule", "uuid": "73ec28be-455a-41b2-b14b-954b4922c518", "file": "reports.md", "line": 53, "end_line": 65, "title": "Front Desk / ballots / analysis share one voted rule", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #185; [ballot-validation.md](ballot-validation.md); [online-ballots.md](online-ballots.md) (evidence: issue #185 “verify counts match”; Accept-all does not set `VotingMethod` or `RegistrationTime`)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Analysis `NumVoters`, VotersByArea `Voted`, and count reconciliation already use `VotingMethodCodes.HasVotedForCounts` (method **or** Processed online). Front Desk stats and `IsCheckedIn` used `RegistrationTime` only, so accepted online voters disappeared from the Front Desk total.\n\n**Chosen:** Front Desk checked-in / registered uses the same `HasVotedForCounts` rule. Pending Submitted is not checked in.\n\n**Rejected alternative:** set `RegistrationTime` / `VotingMethod=O` on Accept-all so the old Front Desk query would match. Rejected — online stays voter-initiated; Processed is the accepted record.", "reason": null, "rejected": ["set `RegistrationTime` / `VotingMethod=O` on Accept-all so the old Front Desk query would match. Rejected — online stays voter-initiated; Processed is the accepted record."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "2eb17a99"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "2eb17a99"}]}, "findings": []}, {"id": "sms-eligibility.md#in-code-gate-before-any-paid-provider", "uuid": "1371035d-9f3b-4db1-9709-6d98503272b8", "file": "sms-eligibility.md", "line": 3, "end_line": 28, "title": "In-code gate before any paid provider", "type": ["decision", "incident"], "status": "active", "evidence": "confirmed", "source": "issue #254 (maintainer); July 555-range send incident described there", "verification": null, "revisit_when": "NANP reserved-range rules change", "see": [], "superseded_by": null, "body": {"text": "Paid verification (SMS / voice / WhatsApp) must not call Twilio or GreenAPI for reserved, fictional, or malformed destinations. The July incident was ~80 attempts to 555-style numbers that still incurred tiny Twilio charges — the existing “registered in an open election” check does not stop an election owner from loading those numbers and opening the window.\n\n**First slice (issue #254):** a pure in-code helper (`PaidDestinationPhone`) rejects:\n\n- malformed numbers that are neither true E.164 (`+` then 8–15 digits) nor the same digit string without a leading `+`\n- NANP area code `555`\n- NANP exchange `555` (including the `555-01xx` fictional block)\n\nThe check runs at the start of `RequestVerificationCodeAsync` for phone + paid delivery, and again inside `PaidVerificationSender` so a future caller cannot bypass it. Email, OAuth, and kiosk paths are unchanged. `WhenRegistered` is not written for a rejected number.\n\n**Rejected alternative:** rely only on the open-election registration check. That stops outsiders requesting codes for arbitrary numbers; it does not stop fictional numbers that are already on a Person row.\n\n**Rejected alternative:** wait for `OnlineVoter.SmsStatus` (this file’s next section). Status needs a row and a reason vocabulary. 555 / malformed must be blocked with no database work.\n\n**Rejected alternative:** reject only `555-01xx` and allow other 555 NPA/NXX. The incident and the issue call out area code 555 and exchange 555, with `555-01xx` as the most important subset.", "reason": null, "rejected": ["rely only on the open-election registration check. That stops outsiders requesting codes for arbitrary numbers; it does not stop fictional numbers that are already on a Person row.", "wait for `OnlineVoter.SmsStatus` (this file’s next section). Status needs a row and a reason vocabulary. 555 / malformed must be blocked with no database work.", "reject only `555-01xx` and allow other 555 NPA/NXX. The incident and the issue call out area code 555 and exchange 555, with `555-01xx` as the most important subset."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-30", "commit": "e5ed21a6"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-05", "commit": "ba0cbdb8"}]}, "findings": []}, {"id": "sms-eligibility.md#durable-onlinevoter-smsstatus-second-slice", "uuid": "e49ea17f-8271-4164-8bc2-fffcccb76b73", "file": "sms-eligibility.md", "line": 29, "end_line": 70, "title": "Durable `OnlineVoter.SmsStatus` (second slice)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #254 (maintainer); July 555-range send incident described there", "verification": null, "revisit_when": "NANP reserved-range rules change", "see": [], "superseded_by": null, "body": {"text": "`OnlineVoter` is the global phone-status store (key remains `VoterId`, E.164 when `VoterIdType` is `\"P\"`). Person is per-election; the same phone can appear in many elections, so eligibility cannot live only on Person.\n\nField: `string? SmsStatus`, max 50, non-unicode (`varchar(50)`).\n\n**Send rule (phone `VoterIdType` `\"P\"` + paid channel only):**\n\n```text\nif SmsStatus is not null AND SmsStatus != \"OK\" → do not send\n```\n\n| `SmsStatus` | Meaning | Send SMS/voice/WhatsApp? |\n|-------------|---------|---------------------------|\n| `null` | Not yet checked | Yes (current behaviour) |\n| `\"OK\"` | Checked, valid | Yes |\n| anything else | Blocked; value is the reason | **No** |\n\nInitial reason vocabulary (not a closed enum — short phrases/codes): `555-range`, `undeliverable`, `landline`, `premium`, `admin`, `twilio-{code}` (auto-learned from selected Twilio errors; see fifth slice), plus in-code `malformed-e164`.\n\nPre-Twilio gate order in `RequestVerificationCodeAsync` (issue #254):\n\n1. `PaidDestinationPhone` (in-code; no DB)\n2. `OnlineVoter.SmsStatus` when `VoterIdType` is `\"P\"` and the channel is paid, a phone row already exists (`VoterId` + `VoterIdType == \"P\"`), and status is not null / not `\"OK\"` (do not create a row just to store status). Email / kiosk identifiers skip this gate.\n3. Existing open-election registration check (unchanged)\n4. Then the provider\n\nSkip logs method + status only (no raw phone or email). Voter-facing message reuses `voting.auth.requestCode.invalidPhone`. Email / OAuth / kiosk unchanged. `WhenRegistered` semantics unchanged.\n\n**Rejected alternative (this slice):** rename the column to `Status` so email/kiosk rows could share it later. The issue field spec and this slice’s contract are `SmsStatus`; a generic rename can be a later migration if other identifier types need a status.\n\n**Rejected alternative:** persist the in-code `PaidDestinationPhone` reason onto an existing `OnlineVoter` row when the format gate rejects. Useful only when a row already exists; creating a row here would pull in `EnsureOnlineVoterForPhoneAsync` (later slice). Not done.\n\n**Not in this slice (at the time):** Person UI / Front Desk display, `EnsureOnlineVoterForPhoneAsync` on Person create/import/update, Twilio status-callback auto-learn (now landed; see below), WhatsAppStatus / GreenAPI `checkWhatsapp` (#255).", "reason": null, "rejected": ["persist the in-code `PaidDestinationPhone` reason onto an existing `OnlineVoter` row when the format gate rejects. Useful only when a row already exists; creating a row here would pull in `EnsureOnlineVoterForPhoneAsync` (later slice). Not done."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-30", "commit": "238f9164"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-05", "commit": "ba0cbdb8"}]}, "findings": []}, {"id": "sms-eligibility.md#ensure-phone-onlinevoter-on-person-write-third-slice", "uuid": "8f477db8-3d22-49c8-9dd2-0226b4f29fc0", "file": "sms-eligibility.md", "line": 71, "end_line": 95, "title": "Ensure phone `OnlineVoter` on Person write (third slice)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #254 (maintainer)", "verification": null, "revisit_when": "email/kiosk rows need the same ensure", "see": [], "superseded_by": null, "body": {"text": "`OnlineVoterPhoneHelper.EnsureOnlineVoterForPhoneAsync` (and the batch `EnsureOnlineVotersForPhonesAsync` for import) inserts a `VoterIdType = \"P\"` row keyed by `VoterId` = the phone as stored on `Person`. Callers: `PeopleService` create/update, `PeopleImportService` load batches, and `DbSeeder` so SeedOnStartup phones are usable locally.\n\n`WhenRegistered`, `WhenLastLogin`, and `SmsStatus` stay null on insert. An existing row is left untouched (no duplicate, no field wipe). Whitespace-only / missing phone does nothing. Email / kiosk / Telegram rows are not created here.\n\n`WhenRegistered` is stamped in `RequestVerificationCodeAsync` only after the voter passes the open-election registration check, and only when it is still null. That is the first successful code request — the same moment a brand-new row used to get `WhenRegistered`. Person write must not set it.\n\n`VoterId` is the Person phone string as stored. `PaidDestinationPhone` does not return a normalized E.164 form, and auth still matches `Person.Phone == dto.VoterId`. This helper does not rewrite Person phones.\n\n**Rejected alternative:** also hook JSON / v2 election-package person import. Those copy an existing election; the issue names Person create / people import / update. Package load can call the same helper later if Person UI needs rows for packaged phones.\n\n**Rejected alternative:** put the helper on `OnlineVotingService`. People write paths should not take a voting-auth dependency just to insert a global phone row.\n\n**Rejected alternative:** set `WhenRegistered` when the Person phone is saved. That would mark import/edit as registration and break “never seen vs imported-only” for the Person UI slice.\n\n**Not in this slice (at the time):** Person UI / Front Desk SMS-status display, Twilio status-callback auto-learn (now landed; see below), WhatsAppStatus / GreenAPI `checkWhatsapp` (#255).", "reason": null, "rejected": ["also hook JSON / v2 election-package person import. Those copy an existing election; the issue names Person create / people import / update. Package load can call the same helper later if Person UI needs rows for packaged phones.", "put the helper on `OnlineVotingService`. People write paths should not take a voting-auth dependency just to insert a global phone row.", "set `WhenRegistered` when the Person phone is saved. That would mark import/edit as registration and break “never seen vs imported-only” for the Person UI slice."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-30", "commit": "e68fbb58"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-30", "commit": "e68fbb58"}]}, "findings": []}, {"id": "sms-eligibility.md#person-detail-phone-onlinevoter-status-fourth-slice", "uuid": "e8fb74dd-b103-414f-8595-db88bf7fd8fa", "file": "sms-eligibility.md", "line": 96, "end_line": 116, "title": "Person detail phone OnlineVoter status (fourth slice)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #254 (maintainer); this slice’s lookup rule", "verification": null, "revisit_when": "person-detail WhatsApp display needs a different lookup than the P-row rule", "see": [], "superseded_by": null, "body": {"text": "People Management person detail (`GetPersonDetails` / `PersonDetailDto.PhoneOnlineVoter`) shows the global phone OnlineVoter SMS/WhatsApp/auth fields. Lookup is both `VoterId == Person.Phone` and `VoterIdType == \"P\"` (`OnlineVoterPhoneHelper.FindPhoneOnlineVoterAsync`). `IX_OnlineVoter_Id` is unique on `VoterId` alone, but paid-send and this UI are type-scoped to `\"P\"`. A non-P row occupying that `VoterId` is treated as no phone row (never seen); that row’s `SmsStatus` / `WhatsAppStatus` are not shown as the phone’s.\n\nNo phone (null/whitespace) → `PhoneOnlineVoter` is null and the UI hides the block. Phone with no matching P row → `HasPhoneRow` false (never seen). P row with `WhenRegistered` null → imported-only / not yet used for auth. `WhenRegistered` and `WhenLastLogin` are the stored values from that P row. `SmsStatus` is unchecked (null) / `OK` / blocked + the reason string. `WhatsAppStatus` is unchecked (null) / `OK` / the stored reason (`no-wa`, `check-failed`, …) — first slice of #255.\n\n`VoterId` is the Person phone string as stored, not a normalized E.164. Logs still must not include raw phone/PII. Email / kiosk / Telegram UI is unchanged.\n\n**Rejected alternative:** look up by `VoterId` only. That would surface a non-P occupant’s `SmsStatus` and dates as if they belonged to the phone.\n\n**Rejected alternative:** Front Desk / people list columns in this slice. Optional later; person detail is the required surface.\n\n**Not in this slice (at the time):** Recent `SmsLog` on person detail is the sixth slice. Manual SmsStatus is the eighth slice. Delivered-callback OK is the ninth slice. Front Desk / list columns are the tenth slice. WhatsAppStatus display landed in the #255 first slice below.", "reason": null, "rejected": ["look up by `VoterId` only. That would surface a non-P occupant’s `SmsStatus` and dates as if they belonged to the phone.", "Front Desk / people list columns in this slice. Optional later; person detail is the required surface."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-30", "commit": "aea89948"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-30", "commit": "aea89948"}]}, "findings": []}, {"id": "sms-eligibility.md#twilio-status-callback-auto-learn-fifth-slice", "uuid": "a3fd6326-00db-4cab-964d-a3a386e4e277", "file": "sms-eligibility.md", "line": 117, "end_line": 159, "title": "Twilio status-callback auto-learn (fifth slice)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #254 (maintainer); this slice’s callback rules", "verification": null, "revisit_when": "WhatsApp / GreenAPI #255", "see": [], "superseded_by": null, "body": {"text": "v3 already had one Twilio status callback: `PublicController.SmsStatus` → `TwilioHelper.LogSmsStatus` (update the existing `SmsLog` row by SID). v4 had the `SmsLog` table but no callback. This slice ports that **single** path to `POST /api/Public/smsStatus` and hooks auto-learn there. There is no second callback endpoint.\n\n**SmsLog:** if a row exists for the SID (`MessageSid`, `SmsSid`, or voice `CallSid`), update `LastStatus`, `ErrorCode`, `LastDate`, and `Phone` (v3 `LogSmsStatus`). Do not insert a log row from a callback. Send-side insert is the seventh slice; auto-learn still does **not** require a log row — it uses Twilio `To`.\n\n**Auto-learn write rule:**\n\n```text\nif MessageStatus is undelivered or failed\n   AND ErrorCode is in the lasting-unusable allow-list\n   AND an OnlineVoter row exists with VoterId matching To (see below) AND VoterIdType == \"P\"\n   AND current SmsStatus is null or \"OK\"\n→ SmsStatus = \"twilio-{code}\"\n```\n\nAllow-list (destination lastingly unusable): `30003` unreachable, `30005` unknown destination, `30006` landline/unreachable, `30004` filtered, `21211` invalid To, `21614` not a mobile. Mapped reason is always `twilio-{code}` (fits `varchar(50)`). Unlisted or missing `ErrorCode` on a terminal failure does **not** write (transient failures must not permanently block). `queued` / `sending` / `sent` never write a block. This slice did **not** set `SmsStatus` to `\"OK\"` from a delivered callback.\n\n> Superseded 2026-09: delivered/completed on an existing SmsLog SID now sets `\"OK\"` — see ninth slice. Failure auto-learn is unchanged.\n\n**Lookup:** Twilio `To` may be E.164 with `+` while `OnlineVoter.VoterId` is the Person phone as stored (with or without `+`). Auth still compares `Person.Phone == dto.VoterId` exactly. The callback tries the trimmed `To`, then the +/- variant. The EF query is `VoterId == key AND VoterIdType == \"P\"` — same as paid-send and `FindTrackedPhoneOnlineVoterAsync` (tracked, not the AsNoTracking helper). A non-P occupant of a candidate `VoterId` is not returned (no convert, no wipe). If no matching P row exists, skip; do not create an `OnlineVoter` from a callback. Do not rewrite Person phones.\n\n**Signature:** `AllowAnonymous` is required so Twilio can POST, but the handler can stamp a lasting block. Validate `X-Twilio-Signature` (HMAC-SHA1 of the request URL + sorted POST params) against `Twilio:AuthToken` before any SmsLog / SmsStatus write. Missing token (including `<placeholder>`), missing signature, or mismatch → 403, no leak of whether a voter row exists. v3 did not validate; auto-learn makes an unsigned callback too dangerous to leave open.\n\nAn existing block reason is left alone. A later selected hard failure may overwrite `\"OK\"`.\n\nLogs: method + status/code only. No raw phone or other PII.\n\n**Rejected alternative:** require an `SmsLog` row before learning. That would make auto-learn a no-op until send-side log inserts land.\n\n**Rejected alternative:** a new dedicated auto-learn endpoint. The issue says to hook the existing status-callback / SmsLog path.\n\n**Rejected alternative:** write `undeliverable` (or set `\"OK\"` on delivered) in this slice. The selected-code vocabulary is `twilio-{code}`; OK-from-delivered is a later choice.\n\n**Not in this slice:** PaidDestinationPhone, the pre-send SmsStatus gate, `EnsureOnlineVoterForPhoneAsync`, Person UI, SuperAdmin set, SignalR #229, WhatsApp/GreenAPI #255. Send-side SmsLog insert is the seventh slice.", "reason": null, "rejected": ["require an `SmsLog` row before learning. That would make auto-learn a no-op until send-side log inserts land.", "a new dedicated auto-learn endpoint. The issue says to hook the existing status-callback / SmsLog path.", "write `undeliverable` (or set `\"OK\"` on delivered) in this slice. The selected-code vocabulary is `twilio-{code}`; OK-from-delivered is a later choice."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-30", "commit": "8cb82dc0"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-30", "commit": "8cb82dc0"}]}, "findings": []}, {"id": "sms-eligibility.md#person-detail-recent-smslog-sixth-slice", "uuid": "d7d89021-883c-462f-9424-5ab7812c7072", "file": "sms-eligibility.md", "line": 160, "end_line": 182, "title": "Person detail recent SmsLog (sixth slice)", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #254 Person UI “optional recent SmsLog”; existing +/- phone keys from the fifth slice (evidence: confirmed (surface); inferred (lookup / limit details))", "verification": null, "revisit_when": "Front Desk should show recent SmsLog (it does not; person detail does)", "see": [], "superseded_by": null, "body": {"text": "Person detail (`PersonPhoneOnlineVoterDto.RecentSmsLogs`) shows up to five newest `SmsLog` rows for that Person phone. Lookup is the stored phone plus the +/- E.164 variant (`TwilioSmsStatusHelper.VoterIdLookupKeys` / `SmsLogPhoneHelper.FindRecentForPhoneAsync`). Not election-scoped and not by `PersonGuid` — verification SMS often has neither. Logs are about the phone, so they are attached even when there is no P row (never seen). No phone → `PhoneOnlineVoter` stays null (no log block).\n\nDTO fields: `SentDate`, `LastDate`, `LastStatus`, `ErrorCode`. No phone and no SID (person detail already has the phone; logs must not add extra identifiers). Newest first (`SentDate`, then `RowId`). Empty list when none match; the UI hides the section. Status text is the stored `LastStatus`, or “Sent” when that is null. Rows come from the seventh-slice send insert (and later callback updates of that SID).\n\n**Rejected alternative:** election- or PersonGuid-scoped logs. Request-code SMS is pre-election; those columns are often null.\n\n**Rejected alternative:** require a P row before showing logs. A never-seen phone can still have delivery history; the OnlineVoter auth block and SmsLog are separate.\n\n**Rejected alternative:** include SID in the teller DTO. Not needed to see delivery history; keep the payload to status / times / error code.\n\n**Rejected alternative:** send-side `SmsLog` insert in this slice. That is the seventh slice.\n\n**Not in this slice:** send-side SmsLog insert (seventh), StatusCallback URL on send, WhatsApp/GreenAPI #255, SignalR #229. Manual SmsStatus is the eighth slice. Delivered-callback OK is the ninth slice. Front Desk / list columns are the tenth slice.", "reason": null, "rejected": ["election- or PersonGuid-scoped logs. Request-code SMS is pre-election; those columns are often null.", "require a P row before showing logs. A never-seen phone can still have delivery history; the OnlineVoter auth block and SmsLog are separate.", "include SID in the teller DTO. Not needed to see delivery history; keep the payload to status / times / error code.", "send-side `SmsLog` insert in this slice. That is the seventh slice."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "717daf28"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "717daf28"}]}, "findings": []}, {"id": "sms-eligibility.md#send-side-smslog-insert-statuscallback-seventh-slice", "uuid": "eae6a7e5-8904-4eeb-afb8-49d01a486c54", "file": "sms-eligibility.md", "line": 183, "end_line": 207, "title": "Send-side SmsLog insert + StatusCallback (seventh slice)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #254 leftover after #325; v3 `TwilioHelper.SendSmsAsync` / `SendVoice` insert + `twilio-CallbackUrl`", "verification": null, "revisit_when": "WhatsApp / GreenAPI #255", "see": [], "superseded_by": null, "body": {"text": "On a successful paid SMS / voice / WhatsApp send, persist an `SmsLog` so person-detail recent logs (#325 / sixth slice) have real rows. Fields: SID, phone as sent (the request-code `VoterId`, not a rewritten E.164), `SentDate` / `LastDate` UTC now, `LastStatus` from the provider JSON (`status` / GreenAPI `idMessage` send uses `\"submitted\"`). `ElectionGuid` and `PersonGuid` stay null — `requestCode` is pre-election; person detail already looks up by phone (+/- variant).\n\nDo **not** insert when the destination is rejected, the provider is not configured (dev skip still returns success), the HTTP send fails, or the provider body has no SID. A failed log insert must not fail the voter send (code already went out). Logs still must not include raw phone or other PII.\n\nTwilio SMS and voice set `StatusCallback` to the existing `POST /api/Public/smsStatus`. URL order (v3 `twilio-CallbackUrl`): `Twilio:StatusCallbackUrl` if it is a usable absolute http(s) URL (origin-only values get the path appended), else `ClientEnv:apiUrl` + `/api/Public/smsStatus`, else `ClientEnv:frontendUrl` + that path (same-host production). Omit the form field when none resolve — the log row is still written. GreenAPI WhatsApp has no Twilio callback.\n\nThe callback still never inserts (fifth slice). Failure auto-learn still uses Twilio `To` and does not require a log row. Delivered OK (ninth slice) does require that SID. Voice callbacks may send `CallSid` / `CallStatus`; those are the same update-by-SID path, not a second endpoint.\n\n**Rejected alternative:** insert a log row from the callback if send forgot one. That inverts v3 `LogSmsStatus` and would create rows for SIDs we did not send.\n\n**Rejected alternative:** require `ElectionGuid` / `PersonGuid` on verification SMS. `requestCode` is not election-scoped; #325 already looks up by phone for that reason.\n\n**Rejected alternative:** a new callback URL or endpoint. Wire the existing public SmsStatus path.\n\n**Not in this slice:** setting `SmsStatus` to `\"OK\"` from delivered (ninth slice), WhatsApp / GreenAPI product work (#255), SignalR #229, rate limits #192. Manual SmsStatus is the eighth slice. Front Desk / list columns are the tenth slice.", "reason": null, "rejected": ["insert a log row from the callback if send forgot one. That inverts v3 `LogSmsStatus` and would create rows for SIDs we did not send.", "require `ElectionGuid` / `PersonGuid` on verification SMS. `requestCode` is not election-scoped; #325 already looks up by phone for that reason.", "a new callback URL or endpoint. Wire the existing public SmsStatus path."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "942a72e1"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "942a72e1"}]}, "findings": []}, {"id": "sms-eligibility.md#teller-manual-smsstatus-eighth-slice", "uuid": "5830cb54-1ca0-4239-9b7d-017a12ccd97d", "file": "sms-eligibility.md", "line": 208, "end_line": 236, "title": "Teller manual SmsStatus (eighth slice)", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #254 leftover after #327; PeopleController `[Authorize]` (same as UpdatePerson) (evidence: confirmed (privilege model from existing People routes); inferred (Ensure-if-missing on set))", "verification": null, "revisit_when": "WhatsApp / GreenAPI #255", "see": [], "superseded_by": null, "body": {"text": "Person detail can set `OnlineVoter.SmsStatus` on the phone P row (`VoterId == Person.Phone` and `VoterIdType == \"P\"`). Values are `\"OK\"` (unblock) or a short block reason (max 50 after trim). Null/unchecked is not set here. Lowercase `ok` is stored as `\"OK\"` so it cannot accidentally become a block reason (`AllowsPaidSend` is exact `\"OK\"`).\n\nPrivilege matches other People writes: `[Authorize]` only. SuperAdmin is the dashboard email-list policy, not a people-edit role — no new role and no SuperAdmin-only gate. Guest-teller JWT can hit the same People APIs as UpdatePerson if they have a token; People Management is the teller UI.\n\nUses the **stored** `Person.Phone`, not unsaved form edits. If there is no P row, `EnsureOnlineVoterForPhoneAsync` creates one (same helper as Person write) then sets status. A non-P occupant of that `VoterId` is not converted; the set fails. `WhenRegistered` / `WhenLastLogin` stay as they are. Paid-send still uses `if SmsStatus is not null AND SmsStatus != \"OK\" → do not send`.\n\nA later delivered/completed Twilio callback on an existing SmsLog SID overwrites a teller block to `\"OK\"` (ninth slice) — the phone just worked. Failure auto-learn still leaves a teller block alone.\n\nNot election-scoped and not under `ElectionFinalizedWriteGuard`: this is global paid-channel eligibility for the phone, not an election-person write.\n\nLogs: method + status only. No raw phone or other PII.\n\n**Rejected alternative:** SuperAdmin-only (`[Authorize(Policy = \"SuperAdmin\")]`). SuperAdmin is not who edits people today; tellers already update Person rows.\n\n**Rejected alternative:** put `SmsStatus` on `UpdatePersonDto`. It lives on the global OnlineVoter row; a dedicated action keeps person save (per-election fields) separate from a global eligibility stamp and always uses the stored phone.\n\n**Rejected alternative:** require an existing P row and refuse never-seen phones. Person write already ensures a row; ensuring here covers older data so a teller can still block or unblock from person detail.\n\n**Not in this slice:** WhatsApp / GreenAPI #255, SignalR #229. Setting `\"OK\"` from a delivered Twilio callback is the ninth slice. Front Desk / list columns are the tenth slice.", "reason": null, "rejected": ["SuperAdmin-only (`[Authorize(Policy = \"SuperAdmin\")]`). SuperAdmin is not who edits people today; tellers already update Person rows.", "put `SmsStatus` on `UpdatePersonDto`. It lives on the global OnlineVoter row; a dedicated action keeps person save (per-election fields) separate from a global eligibility stamp and always uses the stored phone.", "require an existing P row and refuse never-seen phones. Person write already ensures a row; ensuring here covers older data so a teller can still block or unblock from person detail."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "a7e2afbf"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "a7e2afbf"}]}, "findings": []}, {"id": "sms-eligibility.md#set-smsstatus-ok-from-delivered-callback-ninth-slice", "uuid": "e8f31b8f-6f20-4f91-912e-b4489a5f26f6", "file": "sms-eligibility.md", "line": 237, "end_line": 272, "title": "Set `SmsStatus` OK from delivered callback (ninth slice)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #254 leftover after send-side SmsLog + StatusCallback; this slice’s SID + overwrite rules (evidence: leftover after #327; Twilio success statuses)", "verification": null, "revisit_when": "WhatsApp / GreenAPI #255", "see": [], "superseded_by": null, "body": {"text": "A successful Twilio StatusCallback now sets the matching phone P row to `\"OK\"` so a never-seen or previously blocked phone is not stuck until a teller clicks Set OK.\n\n**Write rule:**\n\n```text\nif MessageStatus / CallStatus is delivered (SMS) or completed (voice)\n   AND an SmsLog row already exists for the SID\n   AND an OnlineVoter row exists with VoterId matching To (+/- variant) AND VoterIdType == \"P\"\n→ SmsStatus = \"OK\"\n```\n\nSMS success is `delivered` (handset received the message). Voice success is `completed` (call finished). `sent` / `queued` / `sending` / `accepted` are not success — the carrier accepted the request, not the destination. Voice `busy` / `no-answer` / `canceled` are not lasting-unusable and do not write a block (fifth-slice failure allow-list unchanged).\n\nThe SID must already exist in `SmsLog` (send-side insert from the seventh slice). Granting eligibility is not the same as learning a block: failure auto-learn still uses Twilio `To` without a log row; delivered OK does not. Unknown SID still does not insert a log or an OnlineVoter. A non-P occupant of that `VoterId` is not converted.\n\n**Manual / existing block:** there was no written product rule that a teller block must stay sticky after a later successful delivery. Delivered success overwrites any current reason (`admin`, `landline`, `twilio-{code}`, …) to `\"OK\"` — the phone just worked. Teller manual set (eighth slice) is unchanged. Failure auto-learn still leaves an existing block alone (`CanLearnFromCallback`). A later selected hard failure may overwrite `\"OK\"` again.\n\nLogs: method + status only. No raw phone or other PII. Same signature gate as the fifth slice.\n\n**Rejected alternative:** set OK from `To` without an SmsLog SID (same as failure auto-learn). Blocking a destination from a signed failure is defensive; marking a phone OK should only follow a message we sent.\n\n**Rejected alternative:** keep a manual block sticky when delivered later succeeds. No such rule was written. The phone working is stronger evidence than the earlier reason.\n\n**Rejected alternative:** treat SMS `sent` as success. Twilio `sent` is carrier handoff, not handset delivery.\n\n**Not in this slice:** Front Desk / list columns (tenth slice), #255 WhatsApp, #229 SignalR, #192 UAT SMS. Teller manual set is the eighth slice.", "reason": null, "rejected": ["set OK from `To` without an SmsLog SID (same as failure auto-learn). Blocking a destination from a signed failure is defensive; marking a phone OK should only follow a message we sent.", "keep a manual block sticky when delivered later succeeds. No such rule was written. The phone working is stronger evidence than the earlier reason.", "treat SMS `sent` as success. Twilio `sent` is carrier handoff, not handset delivery."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "11e15030"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "11e15030"}]}, "findings": []}, {"id": "sms-eligibility.md#front-desk-people-list-sms-hint-tenth-slice", "uuid": "747af2a6-4ff3-4aa9-954f-b30eb4fb1771", "file": "sms-eligibility.md", "line": 273, "end_line": 299, "title": "Front Desk / people list SMS hint (tenth slice)", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #254 leftover after #331; person-detail lookup rule (evidence: confirmed (P-row contract from person detail); inferred (compact list vocabulary))", "verification": null, "revisit_when": "Front Desk should open person detail for Set OK / Block", "see": [], "superseded_by": null, "body": {"text": "People list (`PersonListDto.PhoneOnlineVoter`) and Front Desk (`FrontDeskVoterDto.PhoneOnlineVoter`) show a compact phone SMS hint for people who have a phone. Same P-row contract as person detail: `VoterId == Person.Phone` and `VoterIdType == \"P\"`. A non-P occupant of that `VoterId` is never seen (`HasPhoneRow` false; that row’s `SmsStatus` is not shown). No phone → the property is null and the cell is empty / a dash.\n\nThe list DTO is slim (`PersonPhoneSmsHintDto`: `HasPhoneRow`, `WhenRegistered`, `SmsStatus`, plus `WhatsAppStatus` from the #255 list-column slice). It does not include last-login or recent SmsLog — those stay on person detail. Create/update `PersonDto` carries the same slim hint so the people-list cache is not wiped on save. Front Desk does not add the raw phone to the voter row.\n\nCompact cell (SMS first): blocked reason / OK / never-seen / imported (`HasPhoneRow` and `WhenRegistered` null) / unchecked (registered, `SmsStatus` still null). Set OK / Block stays on person detail; the list has no new edit surface.\n\nBatch lookup is `FindPhoneOnlineVotersAsync` (P rows only) so Front Desk / people list do not N+1.\n\n**Rejected alternative:** look up by `VoterId` only. Same reason as person detail — a non-P occupant’s status is not the phone’s.\n\n**Rejected alternative:** embed full `PersonPhoneOnlineVoterDto` (last-login + SmsLog) on every list row. The list only needs the compact hint; logs stay on person detail.\n\n**Rejected alternative:** inline Set OK / Block on Front Desk or the people list. Person detail already has that teller action; Front Desk row-click is check-in, not people edit.\n\n**Rejected alternative:** stack this leftover on the delivered-callback OK work (#332). The list reads status already on main after #331; #332 (ninth slice) can write OK from a delivered callback independently.\n\n**Not in this slice (at the time):** delivered-callback OK is the ninth slice (#332). WhatsApp / GreenAPI #255 first slice is below. The list WhatsApp column landed in the #255 fourth slice. SignalR #229, rate limits #192. #254 stays open.", "reason": null, "rejected": ["look up by `VoterId` only. Same reason as person detail — a non-P occupant’s status is not the phone’s.", "embed full `PersonPhoneOnlineVoterDto` (last-login + SmsLog) on every list row. The list only needs the compact hint; logs stay on person detail.", "inline Set OK / Block on Front Desk or the people list. Person detail already has that teller action; Front Desk row-click is check-in, not people edit.", "stack this leftover on the delivered-callback OK work (#332). The list reads status already on main after #331; #332 (ninth slice) can write OK from a delivered callback independently."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "1d552ee5"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "1d552ee5"}]}, "findings": []}, {"id": "sms-eligibility.md#durable-onlinevoter-whatsappstatus-first-slice-of-255", "uuid": "05042a1b-df05-431b-a4cb-54c010a34613", "file": "sms-eligibility.md", "line": 300, "end_line": 332, "title": "Durable `OnlineVoter.WhatsAppStatus` (first slice of #255)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #255 (maintainer); provider comment that v4 stays on GreenAPI", "verification": null, "revisit_when": "optional rename of `PersonPhoneSmsHintDto`, or SignalR #229", "see": [], "superseded_by": null, "body": {"text": "WhatsApp stays one voter-facing channel. Backend stays on **GreenAPI** (`checkWhatsapp` + existing `sendMessage`). Meta Cloud API and Twilio WhatsApp are out. Presence is stored on **OnlineVoter**, not Person: `WhatsAppStatus` `string?` max 50, non-unicode (`varchar(50)`).\n\n| `WhatsAppStatus` | Meaning | Send WhatsApp? |\n|------------------|---------|----------------|\n| `null` | Not yet checked | Yes |\n| `\"OK\"` | Has WhatsApp | Yes |\n| anything else | No / blocked / error (`no-wa`, `check-failed`, …) | **No** |\n\nGlobal by phone. Identifier gate is `VoterId == Person.Phone` and `VoterIdType == \"P\"`. A non-P occupant of that `VoterId` is not converted and that row’s `WhatsAppStatus` is not shown or written.\n\n`SmsStatus` (#254) stays a separate field: a number can be fine for SMS and not on WhatsApp, or the reverse. The existing `SmsStatus` paid-channel gate still applies to WhatsApp send too.\n\n`CheckWhatsAppAsync` (GreenAPI HTTP) is mocked in tests — CI must not depend on a live GreenAPI account. Config keys already exist: `GreenApi:IdInstance`, `ApiToken`, `BaseUrl`. When those are missing or placeholders, do not persist a lasting status (local/dev skip).\n\nPerson write still uses `EnsureOnlineVoterForPhoneAsync`. On Person phone **change**, clear `WhatsAppStatus` on the **new** number’s P row (or leave null) so it is re-checked. Do not copy the old number’s status onto a different number. The old number’s row is left as-is.\n\nPerson detail shows unchecked / OK / reason from the P-row lookup, same pattern as SMS status. List / Front Desk columns landed in the fourth slice. This first slice had no Front Desk column, no bulk notify, and no abort queue.\n\n**Rejected alternative:** `Person.HasWhatsApp` (v3 packed `HasWA`). Rejected — presence is global by phone, same as `SmsStatus`.\n\n**Rejected alternative:** Meta Cloud API or Twilio WhatsApp as the v4 provider. Rejected — business verification never landed; this issue stays GreenAPI-shaped.\n\n**Not in this slice (first slice):** bulk `CheckMultipleWhatsAppAsync`, head-teller notify queue, abort token (later slices), Front Desk / people-list WhatsApp column (fourth slice), SignalR #229, #254 SMS leftovers.", "reason": null, "rejected": ["`Person.HasWhatsApp` (v3 packed `HasWA`). Rejected — presence is global by phone, same as `SmsStatus`.", "Meta Cloud API or Twilio WhatsApp as the v4 provider. Rejected — business verification never landed; this issue stays GreenAPI-shaped."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "e3897769"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "e3897769"}]}, "findings": []}, {"id": "sms-eligibility.md#bulk-check-selected-whatsapp-second-slice-of-255", "uuid": "52223ff6-c04e-428e-ab68-2ea9700d12aa", "file": "sms-eligibility.md", "line": 333, "end_line": 357, "title": "Bulk check selected WhatsApp (second slice of #255)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #255 leftover after #339; this slice’s check-selected contract", "verification": null, "revisit_when": "optional rename of `PersonPhoneSmsHintDto`, or SignalR #229", "see": [], "superseded_by": null, "body": {"text": "`CheckMultipleWhatsAppAsync` checks a **selected** list of person GUIDs in **one election**. Same teller `[Authorize]` as other People writes. Same P-row gate as one-phone check: persist only when `VoterId == Person.Phone` and `VoterIdType == \"P\"`. A non-P occupant is skipped, not converted. No phone is skipped. A GUID that is not in that election is ignored (`skipped-other-election`). GreenAPI is still `IGreenApiWhatsAppClient.CheckWhatsAppAsync` (production POSTs; tests mock). When GreenAPI is not configured, nothing is persisted.\n\nThe request is bounded (`MaxSelectedPeople` = 100) on the **raw** person-GUID list as sent (before Distinct) so one call cannot check an entire imported roll. Provider calls are sequential with a 200–400 ms pause between them so a selected list of ~20 does not burst GreenAPI. If the request abort token fires, the service stops remaining checks and can return what finished plus `cancelled` for the rest — when the HTTP response is still read. This is **not** the head-teller notify send queue.\n\nThe People list (same `PeopleTable`, not a second grid) has row selection and **Check WhatsApp** for the current selection. Per-row / summary outcomes: OK / no-wa / failed / skipped. **Cancel** aborts the fetch; the client gets AbortError and never reads `result.cancelled`. That AbortError path is toast + refresh + clear selection (same clear as success). Notify send/abort is a separate People list action (third slice). List / Front Desk WhatsApp columns landed in the fourth slice. The notify “Has WhatsApp” filter is the fifth slice.\n\nSelected people are checked even if they already have a status — the teller chose this set. v3 skipped already-checked numbers; that is left for a later filter if notify needs “unchecked only.”\n\n**Rejected alternative:** skip already-checked numbers (v3 `CheckMultipleWhatsAppAsync`). Rejected for this slice — “check selected” means the current selection, including a re-check.\n\n**Rejected alternative:** a second people grid or notify page for the action. Rejected — the existing People list already had leftover bulk-action strings; selection belongs there.\n\n**Rejected alternative:** a dedicated abort-queue endpoint (v3 notify abort). Rejected for this slice — cancel is the HTTP request token only. The People list Cancel button therefore completes as fetch AbortError, not by reading the cancelled DTO.\n\n**Not in this slice (at the time):** head-teller notify send + jitter + abort queue (now landed; see below), Front Desk / people-list WhatsApp column (now landed; see fourth slice), notify “Has WhatsApp” filter (now landed; see fifth slice), SignalR #229, #254 SMS leftovers.", "reason": null, "rejected": ["skip already-checked numbers (v3 `CheckMultipleWhatsAppAsync`). Rejected for this slice — “check selected” means the current selection, including a re-check.", "a second people grid or notify page for the action. Rejected — the existing People list already had leftover bulk-action strings; selection belongs there.", "a dedicated abort-queue endpoint (v3 notify abort). Rejected for this slice — cancel is the HTTP request token only. The People list Cancel button therefore completes as fetch AbortError, not by reading the cancelled DTO."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "d1243445"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "d1243445"}]}, "findings": []}, {"id": "sms-eligibility.md#head-teller-whatsapp-notify-queue-third-slice-of-255", "uuid": "9683c025-00a2-42c1-b872-46cbea674126", "file": "sms-eligibility.md", "line": 358, "end_line": 382, "title": "Head-teller WhatsApp notify queue (third slice of #255)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #255 leftover after #340; v3 `SendHeadTellerMessage` / `AbortQueue`; this slice’s send rule", "verification": null, "revisit_when": "optional rename of `PersonPhoneSmsHintDto`, or SignalR #229", "see": [], "superseded_by": null, "body": {"text": "v4 has no Setup/Notify page and no email/SMS head-teller blast. The existing People list (same `PeopleTable` as check-selected) is the notify surface — do not invent a second notify page. Message body is the election’s existing `SmsText` (edited on Configure this Election), with v3 placeholders `{PersonName}`, `{FirstName}`, `{VoterContact}`, `{hostSite}`.\n\nStart queues selected person GUIDs in **one election**. Send only when the phone P row is `VoterId == Person.Phone` and `VoterIdType == \"P\"` **and** `WhatsAppStatus == \"OK\"`. Skip unchecked (null), `no-wa`, `check-failed`, other non-OK reasons, no-phone, and non-P (do not convert). A GUID not in that election is ignored. **`SmsStatus` is not the WhatsApp allow rule** — a landline/blocked SMS status still sends if WhatsApp is OK.\n\nBackground sequential GreenAPI `sendMessage` (same client/path as verify-code). 3–15s jitter between provider calls (injectable delay in tests). Abort token stops remaining sends; already-sent stay sent. Successful sends persist `SmsLog` via `SmsLogSendHelper` with `ElectionGuid` + `PersonGuid` (verify-code logs still leave those null). Bound to 100 selected GUIDs. Same teller `[Authorize]` as other People writes — `HeadTellerAccess` is registered but unused on Setup/People writes; SuperAdmin is not a people-edit role.\n\nNo live SignalR progress (#229). The UI polls a per-run summary (sent / skipped / failed / cancelled). Production POSTs when GreenAPI is configured; tests mock HTTP / sender.\n\n**Rejected alternative:** a new Setup/Notify page (v3 `Notify.cshtml`). Rejected — #340 already put selection on the People list; this slice adds send/abort there.\n\n**Rejected alternative:** reuse `AllowsSend` (null or OK) for notify. Rejected — notify is only known-OK numbers; unchecked must be skipped until check-selected has run.\n\n**Rejected alternative:** treat `SmsStatus` as the WhatsApp allow rule. Rejected — the fields stay independent.\n\n**Not in this slice (at the time):** Front Desk / people-list WhatsApp column (now landed; see below), notify “Has WhatsApp” filter (now landed; see fifth slice), email/SMS blast, SignalR #229, #254 SMS leftovers.", "reason": null, "rejected": ["a new Setup/Notify page (v3 `Notify.cshtml`). Rejected — #340 already put selection on the People list; this slice adds send/abort there.", "reuse `AllowsSend` (null or OK) for notify. Rejected — notify is only known-OK numbers; unchecked must be skipped until check-selected has run.", "treat `SmsStatus` as the WhatsApp allow rule. Rejected — the fields stay independent."], "consequence": null, App / Send WhatsApp stay on People (already shipped). The notify “Has WhatsApp” filter is the fifth slice.\n\n**Rejected alternative:** a second people or Front Desk grid for WhatsApp. Rejected — the leftover is a column on the existing tables.\n\n**Rejected alternative:** look up by `VoterId` only. Same reason as SMS / person detail.\n\n**Rejected alternative:** a Has WhatsApp notify filter in this slice. Rejected — that is the next leftover after the column (fifth slice).\n\n**Not in this slice:** notify “Has WhatsApp” filter (now landed; see fifth slice), SignalR #229, #254 SMS leftovers. #342 Cancel/AbortError is on main.", "reason": null, "rejected": ["a second people or Front Desk grid for WhatsApp. Rejected — the leftover is a column on the existing tables.", "look up by `VoterId` only. Same reason as SMS / person detail.", "a Has WhatsApp notify filter in this slice. Rejected — that is the next leftover after the column (fifth slice)."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-14", "commit": "3950addb"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-14", "commit": "3950addb"}]}, "findings": []}, {"id": "sms-eligibility.md#notify-people-list-has-whatsapp-filter-fifth-slice-of-255", "uuid": "efe047c4-2d62-4db1-9233-41cd16912c3c", "file": "sms-eligibility.md", "line": 406, "end_line": 432, "title": "Notify People list “Has WhatsApp” filter (fifth slice of #255)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #255 leftover after #343; v3 Notify “Has WhatsApp” filter; this slice’s list-hint rule", "verification": null, "revisit_when": "optional rename of `PersonPhoneSmsHintDto`, or SignalR #229", "see": [], "superseded_by": null, "body": {"text": "v4 still has no Setup/Notify page. The leftover filter lives on the existing People list (`PeopleManagementPage` + `PeopleTable`) next to the name search — an `el-select` like Dashboard status/type, not a second notify grid and not a Front Desk filter.\n\nHas WhatsApp is the required option: P-row `WhatsAppStatus == \"OK\"`, same compact list hint as the WhatsApp column (`phoneWhatsAppListHint === \"ok\"`). Unchecked (P-row, null status — imported or registered-unchecked hints) and No WhatsApp (`no-wa`) fit that same select. Other reasons (`check-failed`, …) stay visible on All. Default selected value is All so opening People Management still shows the roll.\n\nIdentifier gate is unchanged: `VoterId == Person.Phone` and `VoterIdType == \"P\"`. Non-P (`hasPhoneRow` false) and no-phone are not Has WhatsApp. `SmsStatus` and the SMS column are unused by this filter.\n\nSelection, Check WhatsApp, and Send WhatsApp still use the current `selectedGuids`. The filter only changes which rows are visible. Send still only queues `WhatsAppStatus == \"OK\"` P-row phones.\n\n**Rejected alternative:** a second notify grid or v3 `Notify.cshtml` page. Rejected — #340–#343 already put check/send/column on this list.\n\n**Rejected alternative:** default the list to Has WhatsApp. Rejected — People Management is also the roll editor; hiding everyone without a known-OK number on first open would surprise tellers. The leftover needed the Has WhatsApp option, not that default.\n\n**Rejected alternative:** a Front Desk Has WhatsApp filter. Rejected — this leftover is the notify / People list filter.\n\n**Rejected alternative:** change send rules so the filter selects who can be sent. Rejected — send already skips non-OK; the filter is only for finding known-yes numbers.\n\n**Not in this slice:** SignalR #229, optional rename of `PersonPhoneSmsHintDto`, live GreenAPI, Front Desk filter, email/SMS blast.", "reason": null, "rejected": ["a second notify grid or v3 `Notify.cshtml` page. Rejected — #340–#343 already put check/send/column on this list.", "default the list to Has WhatsApp. Rejected — People Management is also the roll editor; hiding everyone without a known-OK number on first open would surprise tellers. The leftover needed the Has WhatsApp option, not that default.", "a Front Desk Has WhatsApp filter. Rejected — this leftover is the notify / People list filter.", "change send rules so the filter selects who can be sent. Rejected — send already skips non-OK; the filter is only for finding known-yes numbers."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-14", "commit": "313996b7"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-14", "commit": "313996b7"}]}, "findings": []}, {"id": "sms-eligibility.md#related", "uuid": null, "file": "sms-eligibility.md", "line": 433, "end_line": 437, "title": "Related", "type": [], "status": "", "evidence": "", "source": null, "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "- [auth.md](auth.md) — voter JWT claims (separate from paid-destination rules)\n- `docs/VOTER_AUTHENTICATION_IMPLEMENTATION.md` — requestCode flow and SMS pumping\n- Issue #254 remaining work; #255 for WhatsApp / GreenAPI status parity", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": ["auth.md"], "git": {"created": {"author": "Glen Little", "date": "2026-08-30", "commit": "e5ed21a6"}, "last_touched": {"author": "Glen Little", "date": "2026-08-30", "commit": "e5ed21a"}, "status_history": []}, "findings": [{"severity": "warning", "code": "W102", "line": 433, "message": "'Related': level-2 heading without any schema fields — fine for a prose section, an error if this was meant to be an entry"}]}, {"id": "test-elections.md#duplicate-copies-settings-people-and-locations-not-ballots-or-runtime-state", "uuid": "49d031ca-8491-4c54-bdd8-10c37ed9976d", "file": "test-elections.md", "line": 3, "end_line": 21, "title": "Duplicate copies settings, people, and locations — not ballots or runtime state", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #193; v4 `CreateElectionAsync` / `JoinElectionUser` ownership; v3 `ElectionHelper.Copy` (commented; guest tellers denied; SQL `CloneElection`) (evidence: issue #193 first slice)", "verification": null, "revisit_when": "copy scope needs ballots", "see": [], "superseded_by": null, "body": {"text": "`POST /api/Elections/{guid}/duplicateElection` creates a new election from one the caller already owns. The copy gets a new `ElectionGuid`, `ShowAsTest = true`, stage `SettingUp`, and the same ownership row create uses (`JoinElectionUser` Role `Admin`). People and locations are copied with new GUIDs. Person phones go through `EnsureOnlineVotersForPhonesAsync` (same helper as person create/import). Ballots, results, computers, tellers, online votes (`OnlineVotingInfo`), SMS logs, and analysis rows are not copied. Check-in / envelope / teller-name / `HasOnlineBallot` fields on people are cleared. Teller access (`ListedForPublicAsOf`) starts closed. The online window starts closed: `OnlineWhenOpen` / `OnlineWhenClose` are cleared and `UseOnlineVoting` is false. `GetAvailableElectionsAsync` does not filter `ShowAsTest` and treats `UseOnlineVoting` plus a null window as open, so leaving those copied would list the test copy to the same phone/email/kiosk voters. A teller can turn online voting back on and set a window.\n\n**Rejected alternative:** map the source into `CreateElectionDto` and call `CreateElectionAsync`. That DTO does not carry every persisted setting, so it would be a second, lossy create path. Duplicate assigns settings explicitly and only reuses the create ownership join.\n\n**Rejected alternative:** `[Authorize]` only (same as create) or `ElectionAccess`. Create has no source election; duplicate does. `ElectionAccess` would let guest tellers copy. `FullTellerAccess` plus a service-side Owner/Admin join check matches “owner can duplicate their election” and v3’s guest-teller deny. SuperAdmin / global Admin is not given a bypass they do not already have on this route.\n\n**Rejected alternative:** add a new `IsTest` column. `Election.ShowAsTest` already exists (dashboard TEST badge, create/update DTOs, teller banner, test-only reset, v3 `IsTest`).\n\n**Rejected alternative:** copy `UseOnlineVoting` and only null the window dates. Availability treats a null window as already open when `UseOnlineVoting` is true, so the copy would still appear to voters.", "reason": null, "rejected": ["map the source into `CreateElectionDto` and call `CreateElectionAsync`. That DTO does not carry every persisted setting, so it would be a second, lossy create path. Duplicate assigns settings explicitly and only reuses the create ownership join.", "`[Authorize]` only (same as create) or `ElectionAccess`. Create has no source election; duplicate does. `ElectionAccess` would let guest tellers copy. `FullTellerAccess` plus a service-side Owner/Admin join check matches “owner can duplicate their election” and v3’s guest-teller deny. SuperAdmin / global Admin is not given a bypass they do not already have on this route.", "add a new `IsTest` column. `Election.ShowAsTest` already exists (dashboard TEST badge, create/update DTOs, teller banner, test-only reset, v3 `IsTest`).", "copy `UseOnlineVoting` and only null the window dates. Availability treats a null window as already open when `UseOnlineVoting` is true, so the copy would still appear to voters."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-31", "commit": "7955ae82"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-31", "commit": "7955ae82"}]}, "findings": []}, {"id": "test-elections.md#teller-pages-show-a-persistent-test-election-banner", "uuid": "7c5462d9-a134-4f8c-bebb-b490e7801870", "file": "test-elections.md", "line": 22, "end_line": 44, "title": "Teller pages show a persistent Test Election banner", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #193; PR #284 UAT (evidence: issue #193 second slice; UAT: gather orange, not error red)", "verification": null, "revisit_when": "voter-facing chrome is added", "see": [], "superseded_by": null, "body": {"text": "While a teller is on an election-scoped route (`/elections/:id/…`) whose `currentElection.showAsTest` is true, MainLayout shows a full-width “Test Election” strip between the fixed header and main content. It reads the existing `Election.ShowAsTest` / `showAsTest` field — no new column. Hidden when there is no current election, `showAsTest` is false or null, or the route has no election id (Dashboard, Profile, create). Leftover `currentElection` after leaving a test election does not keep the banner up. Voter pages use PublicLayout and do not get this chrome.\n\nColors are an explicit pair (white on `--color-stage-gather`, the same burnt orange as the selected Gathering Ballots mode chip), not inherited header text/background. The strip always uses that token — it is a test-election marker, not a stage indicator. Error/danger red was too attention-getting; being in a test election is not a bad thing. The translucent public header and dark Front Desk toolbar already produced a dark-on-dark miss on the dashboard icon-only Copy control.\n\n**Rejected alternative:** `--color-error-700` (white on dark red). UAT: too attention-getting; test is not an error.\n\n**Rejected alternative:** follow `STAGE_META` for the current election stage. That would make the banner look like another stage chip and change color as the election advances.\n\n**Rejected alternative:** a chip inside `AppHeader` only. The header is a fixed 60px bar (48px on Front Desk). A strip there is clipped, and the bar is already crowded with status controls.\n\n**Rejected alternative:** page-local banners on `ElectionDetailPage`. Tellers also work Front Desk, ballots, people, setup, and results; a detail-only mark is easy to leave.\n\n**Rejected alternative:** show whenever `currentElection.showAsTest` is true, ignoring the route. `currentElection` stays set after returning to the dashboard, so the banner would appear on pages that are not “inside” that election.", "reason": null, "rejected": ["`--color-error-700` (white on dark red). UAT: too attention-getting; test is not an error.", "follow `STAGE_META` for the current election stage. That would make the banner look like another stage chip and change color as the election advances.", "a chip inside `AppHeader` only. The header is a fixed 60px bar (48px on Front Desk). A strip there is clipped, and the bar is already crowded with status controls.", "page-local banners on `ElectionDetailPage`. Tellers also work Front Desk, ballots, people, setup, and results; a detail-only mark is easy to leave.", "show whenever `currentElection.showAsTest` is true, ignoring the route. `currentElection` stays set after returning to the dashboard, so the banner would appear on pages that are not “inside” that election."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-31", "commit": "cced14a6"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-31", "commit": "cced14a6"}]}, "findings": []}, {"id": "test-elections.md#default-copy-name", "uuid": "8c1d875b-0f9c-4e56-97c1-b47cbdb382be", "file": "test-elections.md", "line": 45, "end_line": 55, "title": "Default copy name", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "v3 copy was “copy of …” in the issue hunches; no live v3 `CloneElection` script in the TallyJ-3.0 repo", "verification": "uncorroborated against a runnable v3 clone", "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "When the client omits a name, the service uses `Copy of {source name}` (trimmed user name otherwise; truncated to 150 characters).", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-31", "commit": "7955ae82"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-31", "commit": "7955ae82"}]}, "findings": []}, {"id": "test-elections.md#reset-wipes-runtime-data-only-on-showastest-elections", "uuid": "9b11b606-9bae-4fbf-b31e-53500c33c325", "file": "test-elections.md", "line": 56, "end_line": 88, "title": "Reset wipes runtime data only on ShowAsTest elections", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #193; v4 `DuplicateElectionAsync` wipe/start list; `GetAvailableElectionsAsync` null-window rule (evidence: confirmed for the test-only gate (issue #193; `ShowAsTest` must be true). Inferred for wipe list, `SettingUp`, and window-close matching duplicate (no live v3 reset found).)", "verification": "uncorroborated against a runnable v3 reset (TallyJ-3.0 search did not find `ResetElection` / `CloneElection` / equivalent)", "revisit_when": "reset scope needs import files or messages, or a v3 reset script is found", "see": [], "superseded_by": null, "body": {"text": "`POST /api/Elections/{guid}/resetElection` wipes runtime data on an owned `ShowAsTest` election so a teller can practice again without deleting the copy. `ShowAsTest` must be `true`. `false` and `null` refuse with a non-success result (HTTP 40 const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
