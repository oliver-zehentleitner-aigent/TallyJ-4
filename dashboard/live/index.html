 “building a ballot.”", "rejected": ["a named list of voters on the ballot page. Pairing that list with pending/accepted OL / Accept-all identifies how that person voted.", "put the site-wide `AllVoters` connection count on a per-election monitor. A voter on another election’s list would inflate this election. Misleading.", "use Draft (or a composing heartbeat) as a named “building a ballot” list. Draft exists for reload restore; putting those names next to pending/accepted OL counts would reopen the secret-ballot pairing #188 closed. Not needed for “is anyone currently on this election’s ballot page?”", "count unique voter ids (hashed) instead of sessions. Rejected for this slice — the product ask is sessions, and storing voter ids next to an election (even hashed) is extra identity surface for no teller gain."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-07", "commit": "bd2ea938"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-07", "commit": "bd2ea938"}]}, "findings": []}, {"id": "online-ballots.md#monitor-online-voting-layout-status-then-action-then-counts", "uuid": "1d98c5c1-96a3-42cb-a566-70bfbd70d5d9", "file": "online-ballots.md", "line": 195, "end_line": 222, "title": "Monitor Online Voting layout (status, then action, then counts)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #345 (evidence: issue #345; monitor UAT screenshot of stacked boxes)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "The Online Voting block used a header Accept-all, a bordered descriptions row (total / pending / accepted / “enabled”), a separate colored **Closing** box that repeated “Online voting is Open/Closed”, then two more bordered tables (sessions; pending vs accepted) and two anonymity notes. Head tellers could not see window state and the next action at a glance.\n\nThe panel is now one card:\n\n1. **Status row** — Open / Closing soon / Closed, the close line, last-five-minute clock, and the existing window buttons.\n2. **Count strip** — Pending, Still changeable, Processing, Accepted, Ballot-page sessions, Pending-voted-another-way, and total Online ballots. No second descriptions table.\n3. **One counts-only note** and the Accept-all history.\n\nSetup **enabled** is not the operational status. It is shown only when online voting is disabled. Accept-all stays in the header as **Accept pending**; the confirm dialog still uses the longer irreversible wording.\n\n**Rejected alternative:** keep the bordered `el-descriptions` blocks and only tighten copy. The competing boxes were the scan problem.\n\n**Rejected alternative:** drop Accept-all history, sessions, voted-another-way, or total from the monitor. Those are live capabilities, not dead UI.\n\n**Rejected alternative:** change the monitor API so the UI can invent a single “next action” field. Layout was enough; the payload already has window times and the counts.\n\n**Rejected alternative:** restyle the whole Election Monitor page in the same pass. Out of scope for #345.\n\n**Reason:** during an election the teller needs window state and the pending/accept action first; counts and history are secondary and should not each get their own boxed section.", "reason": "during an election the teller needs window state and the pending/accept action first; counts and history are secondary and should not each get their own boxed section.", "rejected": ["keep the bordered `el-descriptions` blocks and only tighten copy. The competing boxes were the scan problem.", "drop Accept-all history, sessions, voted-another-way, or total from the monitor. Those are live capabilities, not dead UI.", "change the monitor API so the UI can invent a single “next action” field. Layout was enough; the payload already has window times and the counts.", "restyle the whole Election Monitor page in the same pass. Out of scope for #345."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-20", "commit": "9e563b37"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-20", "commit": "9e563b37"}]}, "findings": []}, {"id": "online-ballots.md#accept-all-audit-record", "uuid": "ceee6717-4409-4c5b-87d3-455db781ffd7", "file": "online-ballots.md", "line": 223, "end_line": 246, "title": "Accept-all audit record", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #188 remaining slice; `SecurityAuditLogs` replaced `Logs` / C_Log in `20260713054353_MergeLogsIntoSecurityAuditLogs`", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Each successful Accept-all persists one operational `SecurityAuditLog` row: who accepted (logged-in teller `UserId`, plus `DisplayName` when the account has one), when, and pending / accepted counts before and after that run. A teller may Accept-all more than once; each run is its own row. Failed runs and overlapping 409 refusals do not write a success audit.\n\nTellers see those rows on the monitor page (same place as Accept-all). They also appear on the existing Audit Logs page because that page reads `SecurityAuditLogs`.\n\n`OnlineVotingInfo.HistoryStatus` is not this record. Accept-all still appends a per-voter `Processed|{timestamp}` there. That string has no teller identity and no before/after counts.\n\nThe generic `AuditMiddleware` POST path log is skipped for Accept-all so a second, count-less “success” row is not stored next to the real one.\n\nThe audit stores teller user id and optional display name only. It does not store voter email, phone, kiosk code, or voter id (CodeQL `cs/exposure-of-sensitive-information` on #294). Teller email is also left off the row.\n\n**Rejected alternative:** treat `HistoryStatus` as the teller-run audit. It is per voter and cannot answer who accepted or the run counts.\n\n**Rejected alternative:** add a new Accept-all audit table. `SecurityAuditLogs` with `OperationalActivity` is already the election activity log that replaced C_Log.\n\n**Reason:** issue #188 asked for a durable who/when/counts record in the existing TallyJ log, visible to tellers, without a parallel system and without voter contact details.", "reason": "issue #188 asked for a durable who/when/counts record in the existing TallyJ log, visible to tellers, without a parallel system and without voter contact details.", "rejected": ["treat `HistoryStatus` as the teller-run audit. It is per voter and cannot answer who accepted or the run counts.", "add a new Accept-all audit table. `SecurityAuditLogs` with `OperationalActivity` is already the election activity log that replaced C_Log."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-02", "commit": "982cfc9a"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-02", "commit": "982cfc9a"}]}, "findings": []}, {"id": "online-ballots.md#teller-resolution-of-free-text-names", "uuid": "cc708475-3db0-47a8-a03e-efc448ec9268", "file": "online-ballots.md", "line": 247, "end_line": 273, "title": "Teller resolution of free-text names", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #256, v3 `BallotNormal.cshtml.js` `findWithRawVotePart`; maintainer on issue #187", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "In TallyJ, **random name** means a vote on an **online ballot** (selection process random / both) where the voter typed a name. It is not paper teller entry and not a general people-search feature. After Accept-all, those lines become regular votes; tellers resolve the typed name on that ballot — they do not get a new empty line. Import mismatches reuse the same `OnlineVoteRaw` payload; that is not a paper random-name flow.\n\n- Persist free-text as v3-compatible `OnlineRawVote` JSON (`First` / `Last` / `OtherInfo`) on `Vote.OnlineVoteRaw`. Legacy plain strings are still parsed.\n- Unresolved votes stay `VoteStatus.Raw`; the ballot is `BallotStatus.Raw` until every line has a person or a spoil reason.\n- Matching a name **updates that vote** and keeps `OnlineVoteRaw` so the voter-entered text is never discarded (issue #187).\n- **Find** copies first + last into search. Each extra click drops the last letter of both names (same as v3). The teller then picks a search hit for the current line and the next unresolved line is selected.\n- The open-ballot list marks unresolved `OnlineVoteRaw` (`isUnresolvedRawVote`: truthy raw, no person, no spoil). That includes online typed names and CDN/import mismatches. v3 used a saturated peach (`#f1b787` / `rawDonefalse`) so unfinished lines jumped out next to matched green. v4 uses a warning-tinted row, left stripe, and **Find** — no text chip. A matched line keeps the original text above the person name. The **raw** line uses `--el-color-warning-dark`; the matched person name stays the normal vote-name color. Paper votes without `onlineVoteRaw` are not marked.\n- Row fills mix the warning/success token onto `--el-bg-color` so they stay pale on white and dark on navy. Text on those rows is `--color-text-primary`. EP `*-light-9` stays mint/peach in dark while inherited text goes near-white (Glen UAT).\n\n**Rejected alternative:** keep treating free-text as a display-only string and let tellers add new votes underneath. That dropped the v3 process, hid the original names (and treated `Raw` as spoiled in the UI), and could duplicate lines instead of resolving the submitted vote.\n\n**Rejected alternative:** treat any vote without a person — including paper empty slots — as needing resolution. That would invent a paper random-name flow.\n\n**Rejected alternative:** key the mark off `OnlineVoteRaw` alone. Matching keeps the original text, so resolved lines would stay highlighted.\n\n**Rejected alternative:** keep the pale `warning-light-8` / `*-light-9` fills (with or without a **Needs matching** chip). The chip was redundant with Find + the warning row. Those EP light tints stay pale in dark theme, so `--el-text-color-*` (near-white) failed contrast.\n\n**Reason:** tellers already know this workflow from v3; shortening is how they widen a misspelled search without retyping. They must also see which raw lines are still unmatched.", "reason": "tellers already know this workflow from v3; shortening is how they widen a misspelled search without retyping. They must also see which raw lines are still unmatched.", "rejected": ["keep treating free-text as a display-only string and let tellers add new votes underneath. That dropped the v3 process, hid the original names (and treated `Raw` as spoiled in the UI), and could duplicate lines instead of resolving the submitted vote.", "treat any vote without a person — including paper empty slots — as needing resolution. That would invent a paper random-name flow.", "key the mark off `OnlineVoteRaw` alone. Matching keeps the original text, so resolved lines would stay highlighted.", "keep the pale `warning-light-8` / `*-light-9` fills (with or without a **Needs matching** chip). The chip was redundant with Find + the warning row. Those EP light tints stay pale in dark theme, so `--el-text-color-*` (near-white) failed contrast."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-15", "commit": "43330b22"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-15", "commit": "43330b22"}]}, "findings": []}, {"id": "online-ballots.md#teller-created-ballots-stay-off-the-online-location", "uuid": "0efd493f-0abb-47f4-95bf-d2f967e1540f", "file": "online-ballots.md", "line": 274, "end_line": 299, "title": "Teller-created ballots stay off the Online location", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #287; maintainer", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "The reserved location is only for voter-initiated ballots (computer code `OL`). Identify it by `LocationTypeCode` / `LocationType.Online`, never by the display name. Names are user-facing and translated; the English word “Online” is not a stable key.\n\nA teller starting a paper ballot must store it at the location currently selected in that browser. If that selection has type Online, starting is blocked.\n\nCreate used to ignore the requested location and take `Locations.FirstOrDefault` for the election, so new teller ballots could land on the reserved location.\n\nOlder submit code (and the locations form) could store a row *named* “Online” with a null type. `LocationTypeEnum` treats a missing code as Manual, so that row is a normal paper location as far as create-ballot is concerned.\n\n**Rejected alternative:** allow tellers to create ballots at the Online-typed location (the original #287 wording). Mixing teller-entered paper ballots into the voter-submitted set hides which ballots came from voters.\n\n**Rejected alternative:** treat a location named “Online” as reserved. The product is multilingual; English names cannot be used as identifiers.\n\n**Reason:** the browser location is the teller's workstation context; the Online *type* is not a paper station.\n\nThe typed Online location is added when setup enables online voting, and removed if online voting is turned off and that location has no ballots (or computers). Voter submit still ensures the row exists if setup enabled voting but the location is missing.\n\n**Rejected alternative:** create the location only on the first voter ballot. Tellers would not see it in the location list until a vote arrived, and disabling unused online voting would leave an empty reserved location behind.", "reason": "the browser location is the teller's workstation context; the Online *type* is not a paper station.", "rejected": ["allow tellers to create ballots at the Online-typed location (the original #287 wording). Mixing teller-entered paper ballots into the voter-submitted set hides which ballots came from voters.", "treat a location named “Online” as reserved. The product is multilingual; English names cannot be used as identifiers.", "create the location only on the first voter ballot. Tellers would not see it in the location list until a vote arrived, and disabling unused online voting would leave an empty reserved location behind."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-31", "commit": "900402d8"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-31", "commit": "900402d8"}]}, "findings": []}, {"id": "online-ballots.md#reserved-location-display-online-and-imported", "uuid": "c400f5ef-292a-446c-8e35-cee95be9ee24", "file": "online-ballots.md", "line": 300, "end_line": 327, "title": "Reserved location display (Online and Imported)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #287; maintainer, 4 Sep 2026; Imported parity, maintainer, #303 UAT", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Online and Imported are both reserved `LocationType` rows. Identity is the type code, never the stored name. Display uses the current-language label (`locations.typeOnline` / `locations.typeImported` via `formatLocationLabel` / `LocationDisplayHelper`). The stored `Name` is a fallback for reports and logs, not what tellers edit.\n\nOn the Locations page each reserved row is a single i18n tag (no text+badge duplicate), contact shows `-`, and the row is highlighted by type. A paper location whose name happens to be “Online” or “Imported” is not that row.\n\nEditing a reserved row may change sort order only. Name is read-only (the i18n label). Contact, latitude, and longitude are not offered. The API ignores those fields on a reserved-type update and refuses delete. Teller create never assigns Online or Imported; `OnlineLocationHelper` creates Online, and CDN ballot import creates Imported.\n\nTeller-started paper ballots are blocked at both reserved locations (FE start checks + `BallotService.CreateBallotAsync`). Online remains voter-initiated (`OL`); Imported remains import-initiated (`IM`).\n\n**Rejected alternative:** treat a location named “Online” / “Imported” as reserved, or POST the translated label as the stored name. Names are user-facing and translated; writing the current language back would change the stored fallback and still would not identify the row.\n\n**Rejected alternative:** give Imported a weaker Locations UX than Online (editable name/contact while Online is locked). Both are system-managed stations; tellers should not dress them up as paper locations.\n\nBallot entry panels and the votes dialog load locations when the ballot’s `locationGuid` is not already in the location store, so `formatLocationLabel` can use type. If that fetch fails, the stored `locationName` remains the display fallback.\n\nThe ballots report projects location name + type with `AsNoTracking` instead of materializing the full ballot/location/vote/person graph, then formats reserved types the same way. That keeps the report label correct without tracking entities for a read-only export.\n\n**Rejected alternative:** rely only on `ballot.locationName` in the UI, or keep `Include` graphs for the report. The stored name is the English (or setup-time) fallback and can disagree with the teller’s language; the Include path also tracked entities the report never updates.\n\n**Reason:** tellers need to see which rows are system stations, in their language, without being able to rename them or start paper ballots there.", "reason": "tellers need to see which rows are system stations, in their language, without being able to rename them or start paper ballots there.", "rejected": ["treat a location named “Online” / “Imported” as reserved, or POST the translated label as the stored name. Names are user-facing and translated; writing the current language back would change the stored fallback and still would not identify the row.", "give Imported a weaker Locations UX than Online (editable name/contact while Online is locked). Both are system-managed stations; tellers should not dress them up as paper locations.", "rely only on `ballot.locationName` in the UI, or keep `Include` graphs for the report. The stored name is the English (or setup-time) fallback and can disagree with the teller’s language; the Include path also tracked entities the report never updates."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-11", "commit": "5fc19025"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-06", "commit": "66f55e03"}]}, "findings": []}, {"id": "online-ballots.md#online-and-imported-ballot-codes", "uuid": "5d6a1f72-a02d-4b2f-bd48-ad982f02225f", "file": "online-ballots.md", "line": 328, "end_line": 347, "title": "Online and imported ballot codes", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #256 follow-up; v3 used `OL` / `IM`", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Online ballots use reserved computer code `OL` and a per-location sequence (`OL1`, `OL2`, …). Imported ballots use `IM`. Tellers see **Online 3** / **Imported 3**, not `OL3` or `WW0`.\n\n`WW` was a leftover stand-in for “online” and every new ballot was stored as number `0`, so they all displayed as `WW0`. Existing `WW` / `0` online ballots are renumbered when the election’s ballots are loaded or another online ballot is submitted.\n\n**Rejected alternative:** treat `WW` as a normal workstation code and keep `WW03`. That collides with teller computers (`A`–`ZZ`) and hides that these ballots did not come from a paper station.\n\nTellers do not delete votes, delete the ballot, or drag-reorder names on online/imported ballots. Those lines arrived as a submitted set; the work is to match names, not edit the set.\n\nA missing name or spoiled vote (U01 / U02) is applied **to the selected line**. **Set as spoiled vote or new name** stays hidden until the teller is finding a name for that line (Find / Change), then appears above **Start another ballot**. The drawer shows the voter-entered name and, for a new person, prefills first and last from that text. A small **Swap** on the person form (ballot drawer and People Management) reverses first and last when the split guessed the order wrong. Eligibility starts empty and must be chosen — a write-in is not assumed eligible. Search matches work the same way: they replace the selected vote instead of appending a new one.\n\n**Rejected alternative:** keep the paper flow (always show the button and add a new line). That would grow a submitted set instead of resolving the line the voter already sent.", "reason": null, "rejected": ["treat `WW` as a normal workstation code and keep `WW03`. That collides with teller computers (`A`–`ZZ`) and hides that these ballots did not come from a paper station.", "keep the paper flow (always show the button and add a new line). That would grow a submitted set instead of resolving the line the voter already sent."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-15", "commit": "43330b22"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-15", "commit": "43330b22"}]}, "findings": []}, {"id": "online-ballots.md#name-selection-process-codes", "uuid": "f42026a2-8b80-405d-b08b-31d5434da878", "file": "online-ballots.md", "line": 348, "end_line": 359, "title": "Name selection process codes", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "voter ballot page, seed data, `OnlineElectionInfoDto`", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "v4 stores `OnlineSelectionProcess` as `A` (list), `B` (random / free text), or `C` (both). v3 stored `L` / `R` / `B` for the same three modes.\n\n**Rejected alternative:** keep v3's `L`/`R`/`B` letters. Existing v4 elections, seeders, and the voter UI already use `A`/`B`/`C`.", "reason": null, "rejected": ["keep v3's `L`/`R`/`B` letters. Existing v4 elections, seeders, and the voter UI already use `A`/`B`/`C`."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-15", "commit": "43330b22"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-15", "commit": "43330b22"}]}, "findings": []}, {"id": "online-ballots.md#related", "uuid": null, "file": "online-ballots.md", "line": 360, "end_line": 363, "title": "Related", "type": [], "status": "", "evidence": "", "source": null, "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "- Ballot validation\n- Election state management", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}, "last_touched": {"author": "Glen Little", "date": "2026-08-15", "commit": "43330b2"}, "status_history": []}, "findings": [{"severity": "warning", "code": "W102", "line": 360, "message": "'Related': level-2 heading without any schema fields — fine for a prose section, an error if this was meant to be an entry"}]}, {"id": "people-import.md#three-explicit-actions-not-a-wizard", "uuid": "61abd86e-a37a-465f-94a1-d6d8b12f06b0", "file": "people-import.md", "line": 3, "end_line": 21, "title": "Three explicit actions, not a wizard", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #241; maintainer review of the Import People page", "verification": null, "revisit_when": "import gains a fourth action (e.g. dry-run / merge policy) or file reuse is dropped", "see": [], "superseded_by": null, "body": {"text": "People import is three server operations on a persisted file: upload/parse, save column mapping (`ColumnsToRead`), then execute the load. The page shows those as a **single-page pipeline** (choose file → map columns → load people), each with one primary verb.\n\n**Rejected alternative:** a Next/Previous wizard that hides earlier stages. It implied a one-shot interview, while files stay on the server and can be remapped or reloaded. Extra chrome (**Select**, **Save Mapping**, **Next**) also let users reach “Import Now” without persisting the mapping, which fails with `import.errors.noMappings`.\n\n**Rejected alternative:** one-click upload-and-import. Encoding, header row, and column matching still need a human check.\n\nUpload auto-selects the new file and scrolls to mapping. Mapping is **file columns as rows** (each source column → one TallyJ field); already-used TallyJ fields are disabled in the other dropdowns. Required First Name and Last Name are a checklist above the table, not asterisks on a full destination list. Load people is enabled only after mapping is saved. **Delete all people** lives on People Management, not beside the load button.\n\n**Rejected alternative:** TallyJ fields as rows (destination-first). Rejected after using it — users think in terms of the file they just uploaded, and most TallyJ fields stay unused.", "reason": null, "rejected": ["a Next/Previous wizard that hides earlier stages. It implied a one-shot interview, while files stay on the server and can be remapped or reloaded. Extra chrome (**Select**, **Save Mapping**, **Next**) also let users reach “Import Now” without persisting the mapping, which fails with `import.errors.noMappings`.", "one-click upload-and-import. Encoding, header row, and column matching still need a human check.", "TallyJ fields as rows (destination-first). Rejected after using it — users think in terms of the file they just uploaded, and most TallyJ fields stay unused."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-13", "commit": "1aaafff7"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-13", "commit": "1aaafff7"}]}, "findings": []}, {"id": "people-import.md#parse-preview-is-per-column-samples-not-the-first-n-rows", "uuid": "cc385bfb-b4b8-4240-97f1-071b84bc5476", "file": "people-import.md", "line": 22, "end_line": 34, "title": "Parse preview is per-column samples, not the first N rows", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "mapping UI review; `2021-04-22-with units.csv` has empty MiddleName / FormerName / Nickname on the first rows", "verification": null, "revisit_when": "preview needs more than three samples, or parse should stream without loading `ImportFile.Contents`", "see": [], "superseded_by": null, "body": {"text": "The file bytes are already stored on the import row. The parse endpoint still counts every data row, but it only returns up to three **non-empty** samples **per column**, taken from whichever later rows have values. Once every column already has three samples, remaining rows are counted without reading their XLSX cells or splitting their CSV/TSV lines. Those samples are packed into `PreviewRows` as virtual rows (same column index, not the same source row). Import still parses the full file separately.\n\n**Rejected alternative:** send every data row in the parse response. Unnecessary payload, and the first three rows hide sparse columns.", "reason": null, "rejected": ["send every data row in the parse response. Unnecessary payload, and the first three rows hide sparse columns."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-13", "commit": "1aaafff7"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-13", "commit": "1aaafff7"}]}, "findings": []}, {"id": "people-import.md#header-auto-match-ignores-punctuation-and-accents", "uuid": "eb948c15-f058-4bfe-9901-b3d43f282907", "file": "people-import.md", "line": 35, "end_line": 46, "title": "Header auto-match ignores punctuation and accents", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "`\"Baha'i ID\"` failed to map to TallyJ Baha'i ID because aliases were compared as raw strings (`baha'iid` ≠ `bahaiid` / `baha'i id`)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Matching strips letters/digits only after Unicode decomposition, then compares aliases the same way. Apostrophes, curly quotes, and accents (`Bahá'í ID`) all collapse to `bahaiid`.\n\nEach TallyJ field is assigned to at most one file column. If two headers are valid matches, the more specific one wins (`Baha'i ID` over `ID`); the other stays unmapped. Equal scores keep the earlier column.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-13", "commit": "1aaafff7"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-13", "commit": "1aaafff7"}]}, "findings": []}, {"id": "people-import.md#mapping-must-be-saved-before-load", "uuid": "f32ffe59-b3c8-4735-80d2-ae2f2f7f080a", "file": "people-import.md", "line": 47, "end_line": 60, "title": "Mapping must be saved before load", "type": ["constraint"], "status": "active", "evidence": "confirmed", "source": "`PeopleImportService.ImportPeopleAsync` requires `ColumnsToRead`", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "The execute endpoint reads mappings from the file row, not from the browser. Confirm mapping is the step that writes that JSON. Changing mapping, encoding, or header row clears the confirmed state so load cannot run on stale server data.\n\n**Email**, **phone**, and **Baha'i ID** must be unique. Duplicate names are allowed so two people with the same name can be told apart with Other Info. A skipped unique-field row reports the file line it matches, or that it matches an existing person.\n\nSkip messages use the spreadsheet's own row number (Excel row 12 after headers on row 6), not a count of data rows. `FirstDataRow` is the header row only; parse already excludes it, so import must not skip that many rows again.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-13", "commit": "1aaafff7"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-13", "commit": "1aaafff7"}]}, "findings": []}, {"id": "people-import.md#hard-spaces-from-excel-word-are-regular-spaces", "uuid": "49cd9178-f84d-4435-b881-6a27375d8885", "file": "people-import.md", "line": 61, "end_line": 75, "title": "Hard spaces from Excel/Word are regular spaces", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #170 (evidence: v3 import bug class named on #170; Excel/Word emit U+00A0)", "verification": null, "revisit_when": "another Unicode space (e.g. ideographic) shows up in real files", "see": [], "superseded_by": null, "body": {"text": "Import cells replace NBSP (`U+00A0`) and narrow NBSP (`U+202F`) with a normal space, then trim. A cell that is only hard spaces is empty — missing First/Last Name skips the row; empty eligibility stays fully eligible. Mid-name hard spaces become a real space (`Mary Jane`) so search and uniqueness match what the teller sees.\n\n**Rejected alternative:** leave hard spaces in the stored name. They look identical in the UI and then fail Front Desk search and unique-field matching.\n\n**Rejected alternative:** strip every Unicode space category. That would also delete intended separators in some names; only the Excel/Word hard-space pair is rewritten.", "reason": null, "rejected": ["leave hard spaces in the stored name. They look identical in the UI and then fail Front Desk search and unique-field matching.", "strip every Unicode space category. That would also delete intended separators in some names; only the Excel/Word hard-space pair is rewritten."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-11", "commit": "78ffb577"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-11", "commit": "78ffb577"}]}, "findings": []}, {"id": "people-import.md#empty-files-and-invalid-lines-do-not-abort-the-load", "uuid": "596058c3-8938-4a8c-9a3e-65be1f442184", "file": "people-import.md", "line": 76, "end_line": 90, "title": "Empty files and invalid lines do not abort the load", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #170; `PeopleImportController.UploadFile`; `PeopleImportService.ImportPeopleAsync` (evidence: controller already refused 0-byte upload; import skips validation failures without `errorsFound`)", "verification": null, "revisit_when": "import gains a fail-fast / all-or-nothing option", "see": [], "superseded_by": null, "body": {"text": "A 0-byte upload is refused (`No file provided`) in both the controller and `UploadFileAsync`. A file that parses to no rows (empty bytes, whitespace, or headers only) can still be mapped; execute succeeds with zero people added.\n\nInvalid data rows (blank names, hard-space-only names, jagged/unquoted junk) increment `PeopleSkipped`, log a line error, and leave valid rows in the same file imported. Unexpected exceptions still roll back the batch (`errorsFound`).\n\n**Rejected alternative:** treat any skipped row as a failed import and roll back. Duplicate unique fields and unrecognized eligibility already commit the good rows; missing-name and empty-line cases follow that.", "reason": null, "rejected": ["treat any skipped row as a failed import and roll back. Duplicate unique fields and unrecognized eligibility already commit the good rows; missing-name and empty-line cases follow that."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-11", "commit": "78ffb577"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-11", "commit": "78ffb577"}]}, "findings": []}, {"id": "people-import.md#people-list-export-is-the-package-voter-reports", "uuid": "bdb97d14-f591-4772-b3c5-407f86b309f4", "file": "people-import.md", "line": 91, "end_line": 109, "title": "People list export is the package + voter reports", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #170 (evidence: no People-page CSV download in v4; #170 asked to test export, not add one)", "verification": null, "revisit_when": "tellers need a CSV that round-trips through Import People", "see": [], "superseded_by": null, "body": {"text": "v4 does not download a people CSV from People Management. The people list leaves the system as:\n\n- Election JSON package (`ExportElectionToJsonAsync` `people` array) — full records for backup / move\n- Voter reports (`Voters`, `AllCanReceive`, `VoterEmails`, `ChangedPeople`, …) — on-screen + browser print\n- Tally report export API (`/api/report-exports`) — PDF / Excel / CSV of results (elected names, overview), not the roll\n\nThe Reporting page only offers Print; the unused `reporting.exportCSV` strings are leftovers.\n\n**Rejected alternative:** add a People-page CSV export in this #170 slice. Import already accepts many column layouts; a new download would be a product feature, not the remaining test gap.", "reason": null, "rejected": ["add a People-page CSV export in this #170 slice. Import already accepts many column layouts; a new download would be a product feature, not the remaining test gap."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-11", "commit": "78ffb577"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-11", "commit": "78ffb577"}]}, "findings": []}, {"id": "people-import.md#eligibility-import-uses-person-form-codes-not-four-invented-statuses", "uuid": "a7a174a2-1ea0-4064-a98e-c582b7f36a78", "file": "people-import.md", "line": 110, "end_line": 127, "title": "Eligibility import uses person-form codes, not four invented statuses", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #262", "verification": null, "revisit_when": "eligibility reasons gain a new group, or import starts accepting aliases / case-insensitive codes", "see": [], "superseded_by": null, "body": {"text": "The Import People guide used to list Eligible / Ineligible / Under Age / Duplicate. Those values are not the person-form reasons and are not stored.\n\nThe file may include an eligibility column mapped to Eligibility Status. Accepted values are the same person-form statuses: a code (`V04`, `X02`) or the exact description in the current UI language (English descriptions also match). Empty cells mean fully eligible. Only the reason short code is stored.\n\nThe page shows those statuses in a copyable reference popup (code and description each have a copy icon; text stays selectable). Internal vote-only reasons (`U01`, `U02`) are not listed and are not accepted on a person row.\n\n**Rejected alternative:** treat an unrecognized value as eligible and only warn. That silently imported the wrong rights. Unrecognized text now skips the row and logs it, same as a duplicate unique field.\n\n**Rejected alternative:** match descriptions case-insensitively or accept `v04`. The popup copies the exact code and localized text; fuzzy matching would hide typos.", "reason": null, "rejected": ["treat an unrecognized value as eligible and only warn. That silently imported the wrong rights. Unrecognized text now skips the row and logs it, same as a duplicate unique field.", "match descriptions case-insensitively or accept `v04`. The popup copies the exact code and localized text; fuzzy matching would hide typos."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-15", "commit": "bb05c1fb"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-15", "commit": "bb05c1fb"}]}, "findings": []}, {"id": "people.md#agegroup-is-not-stored", "uuid": "d585fe81-960b-4d0f-8aa9-4613a5d8458a", "file": "people.md", "line": 3, "end_line": 19, "title": "AgeGroup is not stored", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "maintainer decision after review of eligibility vs leftover v2/v3 metadata", "verification": null, "revisit_when": "someone proposes restoring a demographic age field separate from eligibility", "see": [], "superseded_by": null, "body": {"text": "`Person.AgeGroup` (`A`/`Y`) was a v2/v3 column carried into v4. It did not drive voting or candidacy. Youth who can vote but cannot be elected use eligibility reason **V01** (“Youth aged 18/19/20”). Under-18 uses **X05**. The person form had both controls and they were never synced.\n\nThe column, person DTOs, form dropdown, and unused turnout-by-age breakdown were removed. Incoming v2 XML / JSON packages may still contain `AgeGroup`; it is ignored so old files keep importing.\n\n**Rejected alternative:** keep the column for turnout reports. The only consumer grouped `HasOnlineBallot` and the UI never showed it.\n\n**Rejected alternative:** derive V01 from Age Group = Youth. Adult youth (18–20) and under-18 are different eligibility rows; a two-value age flag cannot express that.", "reason": null, "rejected": ["keep the column for turnout reports. The only consumer grouped `HasOnlineBallot` and the UI never showed it.", "derive V01 from Age Group = Youth. Adult youth (18–20) and under-18 are different eligibility rows; a two-value age flag cannot express that."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-15", "commit": "43330b22"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-15", "commit": "43330b22"}]}, "findings": []}, {"id": "people.md#person-eligibility-is-stored-as-a-short-code", "uuid": "3e3a9ae9-4412-4ef9-bb10-3e2929d94a57", "file": "people.md", "line": 20, "end_line": 36, "title": "Person eligibility is stored as a short code", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #263", "verification": null, "revisit_when": "a new reason is added, or an incoming package format no longer carries GUIDs", "see": [], "superseded_by": null, "body": {"text": "`Person` stores `IneligibleReasonCode` (`X01`, `V04`, …). Empty/null means fully eligible. Votes already stored the same short code.\n\nGUIDs stay on `IneligibleReasonEnum` only so old JSON packages and v2/v3 XML can still be imported. Incoming files may send a code or a GUID (including legacy v3 sub-reason GUIDs); only the code is persisted. New package export writes the code.\n\n**Rejected alternative:** keep `IneligibleReasonGuid` on Person and derive the code at the API. Create/update, name import, and the person form all used the code already; the GUID column was leftover v3 storage.\n\n**Rejected alternative:** store both columns. Two sources of truth would drift, and the index would still need the GUID.", "reason": null, "rejected": ["keep `IneligibleReasonGuid` on Person and derive the code at the API. Create/update, name import, and the person form all used the code already; the GUID column was leftover v3 storage.", "store both columns. Two sources of truth would drift, and the index would still need the GUID."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-16", "commit": "b47253f6"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-16", "commit": "b47253f6"}]}, "findings": []}, {"id": "people.md#cannot-mark-cannot-vote-after-a-ballot-is-accepted", "uuid": "5d447e9c-d56d-4f09-86f3-0ba09933baee", "file": "people.md", "line": 37, "end_line": 55, "title": "Cannot mark cannot-vote after a ballot is accepted", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "TallyJ-3.0 `Site/Views/Setup/EditPerson.cshtml.js` (`updateReasons(!!VotingMethod)`); v4 write gate in `PeopleService.UpdatePersonAsync` (evidence: v3 `EditPerson.updateReasons`; issue #171)", "verification": null, "revisit_when": "pending online ballots (not yet accepted) should also lock eligibility, or paper “accepted” should mean a `Ballot` row instead of Front Desk `VotingMethod`", "see": [], "superseded_by": null, "body": {"text": "v3 disabled eligibility options with `CanVote === false` once the person had a voting method. The person-form tip said they cannot change to a non-voting option after voting. v4 only had the Finalized write lock (#308) — tellers could still set X/R reasons after check-in or Accept-all.\n\n`HasAcceptedBallot` is Front Desk `VotingMethod` (the paper/mail/call-in record that a ballot was received) or an `OnlineVotingInfo` row with status `Processed` (Accept-all). `Person.HasOnlineBallot` is set on the first online write (Draft autosave or Submitted) and is not the accepted signal. Pending `Submitted` / `Processing` rows do not lock. Draft is also not accepted. V-group reasons (can vote, cannot receive) stay allowed so votes they already received can still be spoiled.\n\nThe API throws `people.cannotMarkCannotVoteAfterVoted` before copying fields. Person detail exposes the combined `HasAcceptedBallot` flag and the latest `OnlineBallotStatus` (Draft / Submitted / Processing / Processed) so tellers can see pending vs accepted online on the person form. The person form disables X/R from `HasAcceptedBallot`, not from `hasOnlineBallot`. Finalized still wins first. Front Desk shows the same per-person online status; the monitor stays counts-only.\n\n**Rejected alternative:** UI-only disable, matching v3. Rejected — #171 asked to verify the status cannot be changed; a write gate matches other Front Desk locks.\n\n**Rejected alternative:** treat `Person.HasOnlineBallot` as the online half of “accepted”. Rejected — that flag is set on the first online write (including Draft), not Accept-all. Accepted vs pending is `OnlineVotingInfo.Status` (`Processed` vs `Submitted` / `Processing`). Paper check-in still uses `VotingMethod`.", "reason": null, "rejected": ["UI-only disable, matching v3. Rejected — #171 asked to verify the status cannot be changed; a write gate matches other Front Desk locks.", "treat `Person.HasOnlineBallot` as the online half of “accepted”. Rejected — that flag is set on the first online write (including Draft), not Accept-all. Accepted vs pending is `OnlineVotingInfo.Status` (`Processed` vs `Submitted` / `Processing`). Paper check-in still uses `VotingMethod`."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-10", "commit": "ba33a193"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-10", "commit": "ba33a193"}]}, "findings": []}, {"id": "people.md#guest-tellers-add-people-only-when-can-add-people-is-on", "uuid": "72c0df24-e281-4b4b-803e-1b5242c703a8", "file": "people.md", "line": 56, "end_line": 72, "title": "Guest tellers add people only when Can Add People is on", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "TallyJ-3.0 `PeopleModel.SavePerson`, `BallotNormal.cshtml.js` `prepareReasons`, Setup “Can Add People?” (evidence: v3 ExtraSetting GA / `Election.GuestTellersCanAddPeople`; issue #186)", "verification": null, "revisit_when": "a logged-in assistant role is added that is neither guest nor full teller", "see": [], "superseded_by": null, "body": {"text": "v3 had no special “Name not in the List” spoil GUID. The ballot spoiled-reason dropdown started with an optgroup **Name not in the List**: either “Add new name (including spoiled)” when `GuestTellersCanAddPeople` was on, or “(Ask head teller to add required name)” when it was off. Adding an eligible person is a valid vote. Known/full tellers could always add. Guests could add only when that election flag was on (default off).\n\nv4 already had `BallotAddPersonPanel` (U01 / U02 / create person). The missing product pieces were the election switch (next to the access code, same as v3), the guest write gate on `PeopleService.CreatePersonAsync` (`people.guestCannotAddPeople`), and the v3 labels on ballot entry.\n\n**Rejected alternative:** a dedicated spoil reason or vote type for “name not in the list”. Rejected — v3 treated it as adding a person, not as a reason GUID.\n\n**Rejected alternative:** let guests add people whenever they can enter ballots. Rejected — v3 defaulted GA to false so a logged-in teller had to add new names.", "reason": null, "rejected": ["a dedicated spoil reason or vote type for “name not in the list”. Rejected — v3 treated it as adding a person, not as a reason GUID.", "let guests add people whenever they can enter ballots. Rejected — v3 defaulted GA to false so a logged-in teller had to add new names."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "b3133108"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "b3133108"}]}, "findings": []}, {"id": "people.md#confidential-voters-are-ordinary-people-named-confidential-x", "uuid": "e2225935-2bda-4308-b35d-895ac46c7444", "file": "people.md", "line": 73, "end_line": 86, "title": "Confidential voters are ordinary people named Confidential X", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "v3 convention (Add New Person + Front Desk check-in) (evidence: maintainer product correction on #186 / PR #334; no Confidential feature in v3 code)", "verification": null, "revisit_when": "a jurisdiction asks for a first-class anonymous-voter type", "see": [], "superseded_by": null, "body": {"text": "There is no Confidential person type and no Analyze step for them. Tellers add `Confidential 1`, `Confidential 2`, and so on as normal eligible people and check them in. Calculated Eligible Voters and In Person go up the same as for any other person. Analyze does not mention confidential.\n\n**Rejected alternative:** an Add Confidential button or auto-numbered Confidential N. Rejected — v3 never had that product.\n\n**Rejected alternative:** override Eligible Voters on Analyze so the listed count stays as it was. Rejected — adding the person is supposed to increase the calculated eligible count.", "reason": null, "rejected": ["an Add Confidential button or auto-numbered Confidential N. Rejected — v3 never had that product.", "override Eligible Voters on Analyze so the listed count stays as it was. Rejected — adding the person is supposed to increase the calculated eligible count."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "b3133108"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "b3133108"}]}, "findings": []}, {"id": "realtime.md#hub-specific-group-name-patterns", "uuid": "4398139f-ba65-4e6a-a7b3-03b3630f6d25", "file": "realtime.md", "line": 3, "end_line": 27, "title": "Hub-specific group name patterns", "type": ["constraint"], "status": "active", "evidence": "confirmed", "source": "project agent notes (`AGENTS.md`); hub `GetGroupName` helpers; `SignalRNotificationService`", "verification": null, "revisit_when": "a hub is added/removed, or group naming is unified deliberately", "see": [], "superseded_by": null, "body": {"text": "Do **not** assume a single `election-{guid}` convention for all realtime traffic. Each hub builds its own group name (via `GetGroupName` statics) and broadcasts go through matching methods in `SignalRNotificationService`.\n\n| Pattern                                                     | Hub / use                                               |\n| ----------------------------------------------------------- | ------------------------------------------------------- |\n| `Main{electionGuid}` (+ `…Known` / `…Guest`)                | MainHub — shared status + teller name list on **base**; role events on suffix |\n| `Analyze{electionGuid}`                                     | AnalyzeHub — tally progress/complete                    |\n| `FrontDesk{electionGuid}`                                   | FrontDeskHub — people, ballots, online election, reload |\n| `BallotImport{electionGuid}` / `PeopleImport{electionGuid}` | import hubs (election-scoped)                           |\n| `ElectionPackageImport{userId}`                             | ElectionPackageImportHub — dashboard package load log   |\n| `Public`                                                    | PublicHub — guest-teller joinable elections list        |\n| `AllVoters` (global)                                        | AllVotersHub — online voter list/window refresh         |\n| `Voter{voterId}`                                            | VoterPersonalHub — registration + multi-device login     |\n| `VoterCode{channelId}`                                      | VoterCodeHub — pre-auth login-code delivery status       |\n\nFrontend: `frontend/src/services/signalrService.ts` (`connectTo*Hub`, `joinElection`, `joinDashboardElections`, `connectVoterHubs`, etc.) and store subscriptions.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}]}, "findings": []}, {"id": "realtime.md#mainhub-status-vs-role-groups", "uuid": "15a379ed-f1bc-4a32-8cc4-a7fe712c5cba", "file": "realtime.md", "line": 28, "end_line": 41, "title": "MainHub status vs role groups", "type": ["constraint"], "status": "active", "evidence": "confirmed", "source": "issue #227 fix; `SignalRNotificationService.SendElectionUpdateAsync`; `MainHub.JoinElection`", "verification": null, "revisit_when": "Known vs Guest need different status payloads (v3 `infoForKnown` / `infoForGuest`)", "see": [], "superseded_by": null, "body": {"text": "- Every client that joins an election is added to **base** `Main{electionGuid}` **and** either `…Known` or `…Guest`.\n- Shared election status (name, stage) is broadcast as **`statusChanged`** to the **base** group only — one payload, no double delivery.\n- Role-specific events use suffix groups (guest **`electionClosed`** → `Main{guid}Guest` only).\n- Server producers use `IHubContext<MainHub>` via `SignalRNotificationService` (and computer-assignment close-out), not client-callable hub methods.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-08", "commit": "8163f4c7"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-08", "commit": "8163f4c7"}]}, "findings": []}, {"id": "realtime.md#election-teller-name-list-mainhub-tellerschanged", "uuid": "f8e458fa-1726-49f0-b7c0-0d62fea526ac", "file": "realtime.md", "line": 42, "end_line": 62, "title": "Election teller name list (MainHub `tellersChanged`)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #287 (teller-name list slice); Teller 1/2 already persist via `Teller` + Tellers page (evidence: issue #287)", "verification": null, "revisit_when": "teller names need FrontDesk-only fan-out, or the list grows large enough that a thin refetch is required", "see": [], "superseded_by": null, "body": {"text": "Entering a name in Teller 1 or Teller 2 creates (or no-ops) a row on the existing election `Teller` table. Clearing the dropdown only clears this browser session’s selection (`useActiveTellers` / localStorage). It does **not** delete the election name. Admin delete stays on the existing Tellers page (`TellersListPage` + `TellerForm`).\n\nLive distribution uses MainHub **base** group `Main{electionGuid}` and camelCase **`tellersChanged`** (`TellerUpdateDto`: `electionGuid`, `rowId`, `name`, `action` = added / updated / deleted). `tellerStore` patches the in-memory list (idempotent, alphabetical). Both Teller 1/2 dropdowns read that same list.\n\n**Rejected alternative:** FrontDeskHub (PersonAdded-style events). Rejected — Tellers page and other teller computers already have session-wide MainHub membership; FrontDesk is page-owned and is left on ballots/people unmount. A FrontDesk-only event would miss the admin Tellers page unless that page also joined FrontDesk.\n\n**Rejected alternative:** a second “active teller names” table or admin screen. Rejected — the election already has `Teller` + the Tellers page for add/rename/delete.\n\n**Reason:** every teller computer that has joined the election is already in `Main{guid}`; one event keeps listing, open-ballot, front desk, and the Tellers page in sync without a new hub or page.\n\n**Rejected alternative:** leave server event as `ElectionUpdated` while FE listens for `statusChanged` (broken live updates). **Rejected alternative:** keep unused hub methods `StatusChanged` / `ElectionClosed` / `CloseOutGuestTellers` as the documented push path — they were never called by services and were client-invokable.", "reason": "every teller computer that has joined the election is already in `Main{guid}`; one event keeps listing, open-ballot, front desk, and the Tellers page in sync without a new hub or page.", "rejected": ["FrontDeskHub (PersonAdded-style events). Rejected — Tellers page and other teller computers already have session-wide MainHub membership; FrontDesk is page-owned and is left on ballots/people unmount. A FrontDesk-only event would miss the admin Tellers page unless that page also joined FrontDesk.", "a second “active teller names” table or admin screen. Rejected — the election already has `Teller` + the Tellers page for add/rename/delete.", "leave server event as `ElectionUpdated` while FE listens for `statusChanged` (broken live updates). **Rejected alternative:** keep unused hub methods `StatusChanged` / `ElectionClosed` / `CloseOutGuestTellers` as the documented push path — they were never called by services and were client-invokable."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-31", "commit": "f70ed91f"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-31", "commit": "f70ed91f"}]}, "findings": []}, {"id": "realtime.md#mainhub-multi-election-dashboard-listen-joinelections", "uuid": "95c5741d-e14e-466a-aa86-feae16783989", "file": "realtime.md", "line": 63, "end_line": 82, "title": "MainHub multi-election dashboard listen (JoinElections)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #230; v3 `JoinAll` / `Public/JoinMainHubAll`; `MainHub.JoinElections` / `LeaveElections`", "verification": null, "revisit_when": "dashboard needs different events per role, or multi-join is needed outside the elections list", "see": [], "superseded_by": null, "body": {"text": "- **Who:** known (full) tellers only — guests must not multi-join (v3 parity).\n- **When:** elections dashboard load joins all managed election GUIDs; unmount and logout leave the multi-join set.\n- **Groups:** each allowed GUID → base `Main{guid}` + `Main{guid}Known` (status is on **base** after #227). No computer-code assignment.\n- **Auth:** per-GUID membership via `JoinElectionUsers`; unauthorized GUIDs are skipped (not a hard fail of the whole batch).\n- **FE:** `signalrService.joinDashboardElections` / `leaveDashboardElections`; reconnect re-invokes `JoinElections` for the tracked set. Leaving multi-join **excludes** the active workstation election (`mainElectionGuid`) so SignalR group membership is not dropped for the session open election (groups are not refcounted).\n- **UI effect:** existing `statusChanged` → `electionStore.handleElectionUpdate` already patches list cards; multi-join only expands who receives the event.\n\n**Rejected alternative:** loop `JoinElection` for every dashboard card. Rejected — that assigns computer codes and runs guest-join gates unsuitable for listen-only multi-election status.\n\n**Rejected alternative:** leave multi-join membership for the whole SPA session without leave-on-navigate. Rejected — would keep clients in many groups after leaving the list; v3 scoped multi-listen to the elections list.", "reason": null, "rejected": ["loop `JoinElection` for every dashboard card. Rejected — that assigns computer codes and runs guest-join gates unsuitable for listen-only multi-election status.", "leave multi-join membership for the whole SPA session without leave-on-navigate. Rejected — would keep clients in many groups after leaving the list; v3 scoped multi-listen to the elections list."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-08", "commit": "316e98d9"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-08", "commit": "316e98d9"}]}, "findings": []}, {"id": "realtime.md#who-owns-main-vs-frontdesk-membership", "uuid": "ce71f670-abc2-494e-8684-9b934ea3bb55", "file": "realtime.md", "line": 83, "end_line": 101, "title": "Who owns Main vs FrontDesk membership", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #242 — guest stage redirects stopped after leaving ballots", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "- **Main hub** (`joinElection` / `leaveElection`): owned by `electionStore` / `MainLayout` for the active election session (`statusChanged`, computer code, guest close-out).\n- **Main hub multi-listen** (`joinDashboardElections` / `leaveDashboardElections`): owned by `DashboardPage` for known tellers only (issue #230).\n- **FrontDesk hub** (`joinFrontDeskElection` / `leaveFrontDeskElection`): owned by page stores that listen for FD events (`ballotStore`, `peopleStore`, Front Desk page).\n- **Do not** call full `leaveElection` from ballots/people unmount — that drops Main group membership and stops stage updates for the rest of the session.\n\n**Rejected alternative:** page-level stores share `joinElection`/`leaveElection` for convenience. Rejected — unmount of one page tears down session-level Main membership.\n\n**Reason:** different surfaces need different fan-out and sometimes different membership (known vs guest). One flat `election-{guid}` group would over-notify or under-notify and couple unrelated UI areas.\n\n**Rejected alternative:** one shared election group for every event type. Rejected because Main, Front Desk, Analyze, and Public have different listeners and update cadences.", "reason": "different surfaces need different fan-out and sometimes different membership (known vs guest). One flat `election-{guid}` group would over-notify or under-notify and couple unrelated UI areas.", "rejected": ["page-level stores share `joinElection`/`leaveElection` for convenience. Rejected — unmount of one page tears down session-level Main membership.", "one shared election group for every event type. Rejected because Main, Front Desk, Analyze, and Public have different listeners and update cadences."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-08", "commit": "ea91188d"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-08", "commit": "ea91188d"}]}, "findings": []}, {"id": "realtime.md#no-election-scoped-onlinevotinghub-ballot-totals", "uuid": "bacadf81-7987-42d0-a9be-84cd55b066f7", "file": "realtime.md", "line": 102, "end_line": 114, "title": "No election-scoped OnlineVotingHub (ballot totals)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "maintainer review of unused scaffold vs v3 `AllVotersHub` / `VoterPersonalHub`; issue #233", "verification": null, "revisit_when": "product wants per-election voter groups or ballot-submit live counts", "see": [], "superseded_by": null, "body": {"text": "There is still no `/hubs/online-voting` hub and no `online-election-{guid}` group that pushes vote totals. Ballot submit confirmation remains the HTTP response.\n\n**Rejected alternative:** scaffolded `OnlineVotingHub` with `online-election-{electionGuid}` and client-callable `BallotSubmitted` (payload including `totalVotes`). Rejected — mismatched v3 voter model, would push vote totals rather than thin “refetch” signals.", "reason": null, "rejected": ["scaffolded `OnlineVotingHub` with `online-election-{electionGuid}` and client-callable `BallotSubmitted` (payload including `totalVotes`). Rejected — mismatched v3 voter model, would push vote totals rather than thin “refetch” signals."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-08", "commit": "d1a962b6"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-07", "commit": "fe59c69f"}]}, "findings": []}, {"id": "realtime.md#online-voter-hubs-allvoters-voterpersonal-issue-233", "uuid": "52a0297e-105e-41e9-b080-82644f2e6c24", "file": "realtime.md", "line": 115, "end_line": 148, "title": "Online voter hubs (AllVoters + VoterPersonal) — issue #233", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #233; v3 `AllVotersHub` / `VoterPersonalHub`; preferred thin-signal shape above", "verification": null, "revisit_when": "global `AllVoters` becomes too chatty, or kiosk multi-login needs different UX", "see": [], "superseded_by": null, "body": {"text": "Online voters use two authenticated hubs (policy `OnlineVoter` — JWT claims `voterType=online` + `voterId`). FE connects with `withCredentials` only; the httpOnly `voter_token` cookie is accepted on `/hubs/all-voters` and `/hubs/voter-personal` by the same JWT `OnMessageReceived` path as HTTP. There is no client `accessTokenFactory` for voters.\n\n| Hub | Path | Group | Join | Events |\n| --- | ---- | ----- | ---- | ------ |\n| AllVotersHub | `/hubs/all-voters` | `AllVoters` (global) | `Join` / `Leave`; `JoinElection` / `LeaveElection` (ballot-page presence, in-memory count only) | `updateVoters` — thin `OnlineElectionUpdateDto` (same fields as FrontDesk `updateOnlineElection`) |\n| VoterPersonalHub | `/hubs/voter-personal` | `Voter{voterId}` | `Join` / `Leave` (group from JWT only) | `updateVoter` — thin `VoterPersonalUpdateDto` (`updateRegistration` / `login`) |\n\n**Producers** (via `ISignalRNotificationService` only — hubs are join/leave):\n\n- Online window/process change (`ElectionService` → `SendOnlineElectionUpdateAsync`) → FrontDesk **and** AllVoters. `ResetElectionAsync` also notifies when `UseOnlineVoting` flips (a null window plus that flag is already open).\n- Front desk check-in / unregister / envelope (`FrontDeskService`) → personal `updateVoter` with `updateRegistration` to email, phone, and kiosk groups when present.\n- Successful online voter auth (`OnlineVotingService`) → personal `updateVoter` with `login: true` (other browsers for that id).\n\n**Client behavior:** thin signal → re-call `GET availableElections` / vote status. Do not treat hub payloads as authoritative election detail or tallies. Login-elsewhere shows a dismissible notice.\n\n**Why global AllVoters (not per-election):** one join after auth covers list refresh for any election whose online window changes; eligibility filtering stays on `GET availableElections`. Per-election groups would miss elections the voter has not joined yet.\n\n`JoinElection(electionGuid)` is **not** a per-election broadcast group. It only records the connection on `IOnlineVoterPresenceService` so Monitor Progress can show an anonymous ballot-page session count. See `context/online-ballots.md`.\n\n**Rejected alternative:** per-election voter groups only. Rejected for MVP — discovery of newly opened elections for an already-connected voter would require a second discovery channel.\n\n**Rejected alternative:** use `VoterPersonalHub` for election presence. Rejected — group is `Voter{voterId}` (identifying) and the voter JWT has no election claim.\n\n**Security:** personal join never accepts a client-supplied voter id (server uses JWT `voterId`). Personal updates target only groups for that person's contact identifiers; voter A does not receive voter B events.", "reason": null, "rejected": ["per-election voter groups only. Rejected for MVP — discovery of newly opened elections for an already-connected voter would require a second discovery channel.", "use `VoterPersonalHub` for election presence. Rejected — group is `Voter{voterId}` (identifying) and the voter JWT has no election claim."], "consequence": null, "considered": null, "why_open": null}, "refs": ["online-ballots.md"], "git": {"created": {"author": "Glen Little", "date": "2026-08-08", "commit": "d1a962b6"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-08", "commit": "d1a962b6"}]}, "findings": []}, {"id": "realtime.md#votercodehub-live-login-code-delivery-status-issue-229", "uuid": "1811432d-67fb-4017-a1a7-a631e4fde669", "file": "realtime.md", "line": 149, "end_line": 180, "title": "VoterCodeHub — live login-code delivery status (issue #229)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #229; product decision 2026-09-20 (live status for SMS/voice and email; do not skip); v3 `VoterCodeHub` (`setStatus` / `final`); owner comment that the channel is downstream of SMS-pumping gates", "verification": null, "revisit_when": "multi-instance hosts need a shared channel store, WhatsApp gains async delivery callbacks, or join must be strictly single-use with no reconnect", "see": [], "superseded_by": null, "body": {"text": "v4 request/verify stays HTTP. After a send is **actually attempted**, `requestCode` also returns `channelToken`. The browser that requested the code joins anonymous `/hubs/voter-code` and receives `codeDeliveryStatus` (sending / sent / delivered / failed / final) without polling.\n\n- **Token:** 32 cryptographically random bytes, hex-encoded (64 chars). Only the SHA-256 hash is stored. Lifetime **10 minutes** (shorter than the 15-minute OTP).\n- **Join:** one live connection per token. A second concurrent joiner is rejected. After disconnect/leave, the same token may rejoin until TTL so SignalR reconnect still works. This is stricter than v3’s client `Math.random().slice(-5)` key and still usable after a drop.\n- **When issued:** only after pumping / eligibility gates pass and a send is attempted (email, SMS, voice, WhatsApp). Rejected `requestCode` (invalid phone, blocked SmsStatus, not registered, no open elections, kiosk no-send) returns no token.\n- **Replay:** statuses are buffered on the channel and replayed to the joiner. `requestCode` often finishes send (especially email) before the browser can connect; without replay the UI would miss sent/failed/final.\n- **Wire:** `VoterCodeDeliveryStatusDto` only (`status`, `messageKey`, `okay`, allow-listed `providerStatus`). Never the OTP, voter id, phone, or email. Dev OTP echo stays on the HTTP response in Development/Testing only.\n- **Producers:** `OnlineVotingService` send-path outcomes; Twilio `POST /api/Public/smsStatus` when the SID was bound to the channel (SMS/voice). Email and WhatsApp have no async provider callback — send success/fail is `sent`/`failed` plus `final`. When Twilio accepts SMS/voice and writes an `SmsLog` SID, `sent` waits for delivered/failed/completed before `final`. When Twilio is not configured (dev skip, no SID), send success is treated as terminal `final`.\n- **Hub:** join/leave only; server push via `ISignalRNotificationService.SendVoterCodeDeliveryStatusAsync`. Group `VoterCode{channelId}` (server GUID, not the raw token).\n- **Store:** process-wide in-memory (`VoterCodeDeliveryChannelService`). Same-host only, like online-voter presence.\n\n**Rejected alternative:** v3-style client-generated ~5-digit key. lic-results-display", "uuid": "239fbceb-3bea-4797-abae-cb4bb5eb84cc", "file": "realtime.md", "line": 181, "end_line": 195, "title": "No anonymous public results display", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "product decision (maintainer)", "verification": null, "revisit_when": "a deliberate, authenticated presentation product requirement appears", "see": [], "superseded_by": null, "body": {"text": "Anonymous clients must not learn election results (or other election detail) just by knowing a GUID. `PublicHub` is only for the guest-teller join surface: the static `Public` group receives list open/close notifications used by teller join.\n\n**Rejected alternative:** per-election `public-display-{guid}` groups + `GET /api/Public/{guid}/publicDisplay` + full-screen public results page. Removed — no business need for random users to view election data; authenticated results presentation (e.g. in-app results/presentation views) covers operator needs.\n\nElection detail over HTTP follows the same rule: `GET /api/Elections/{guid}/status` (and other election-scoped routes) require `ElectionAccess` (full or guest teller joined to that election). Anonymous public endpoints stay limited to guest-join discovery (`/api/Public/elections`, hub `Public` group) and non-sensitive health/home.", "reason": null, "rejected": ["per-election `public-display-{guid}` groups + `GET /api/Public/{guid}/publicDisplay` + full-screen public results page. Removed — no business need for random users to view election data; authenticated results presentation (e.g. in-app results/presentation views) covers operator needs."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-07", "commit": "0fe294bd"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-07", "commit": "0fe294bd"}]}, "findings": []}, {"id": "realtime.md#frontdeskhub-event-catalog", "uuid": "7cb3b69a-1416-4a32-8b96-2496bada5bb7", "file": "realtime.md", "line": 196, "end_line": 227, "title": "FrontDeskHub event catalog", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #232 fix; `SignalRNotificationService` FrontDesk methods; `peopleStore` / `FrontDeskPage` listeners", "verification": null, "revisit_when": "changing person payload shape, or adding more FrontDesk producers", "see": [], "superseded_by": null, "body": {"text": "Server pushes only via `IHubContext<FrontDeskHub>` in `SignalRNotificationService` (and future service producers). The hub exposes **join/leave only** — no client-callable broadcast methods (same pattern as MainHub after #227).\n\nGroup: `FrontDesk{electionGuid}`.\n\n| Event | Payload | Producer | Primary listeners |\n| ----- | ------- | -------- | ----------------- |\n| `PersonAdded` | `PersonUpdateDto` (`action: \"added\"`) | `SendPersonUpdateAsync` ← PeopleService create | `peopleStore` (list + ballot cache); Front Desk refreshes eligible list |\n| `PersonUpdated` | `PersonUpdateDto` (`action: \"updated\"`) | `SendPersonUpdateAsync` ← PeopleService update | same |\n| `PersonDeleted` | `PersonUpdateDto` (`action: \"deleted\"`) | `SendPersonUpdateAsync` ← PeopleService delete | same |\n| `PersonCheckedIn` | `FrontDeskVoterDto` | `NotifyPersonCheckedInAsync` ← check-in / unregister / envelope | Front Desk page (row patch) |\n| `PersonFlagsUpdated` | `FrontDeskVoterDto` | `SendPersonFlagsUpdatedAsync` | Front Desk page |\n| `VoterCountUpdated` | `FrontDeskStatsDto` | `NotifyVoterCountUpdatedAsync` ← after check-in / unregister | Front Desk page (`frontDeskStats`) |\n| `PersonVoteCountUpdated` | `PersonVoteCountUpdateDto` | `SendPersonVoteCountUpdateAsync` | `peopleStore` ballot cache |\n| `updateBallots` | `BallotUpdateDto` | `SendBallotUpdateAsync` | `ballotStore` |\n| `reloadPage` | (none) | `RequestFrontDeskReloadAsync` ← CSV / CDN ballot import success; people import success; delete-all-people | Front Desk page, `peopleStore`, `ballotStore` (soft re-fetch, not `location.reload`) |\n| `updateOnlineElection` | `OnlineElectionUpdateDto` | `SendOnlineElectionUpdateAsync` ← `ElectionService.UpdateElectionAsync` / `ResetElectionAsync` when online window, process, or `UseOnlineVoting` changes | `electionStore` (patch online fields); Monitoring dashboard re-fetches monitor info |\n\n**Person list contract:** v4 uses fine-grained `PersonAdded` / `PersonUpdated` / `PersonDeleted`, not v3’s single `updatePeople` stream. Handlers refetch the affected person (or drop the row on delete) rather than applying a partial patch from the thin DTO.\n\n**Rejected alternative:** re-emit v3 `updatePeople` from the notification service to match an old `peopleStore` listener. Rejected — other Front Desk events already use PascalCase names; handlers for add/update/delete already existed; dual event names would keep the contract ambiguous.\n\n**Rejected alternative:** leave unused hub instance methods (`UpdatePeople`, `ReloadPage`, …) as the “documented” push path. Rejected — they were client-invokable, never called by services, and misled readers (same lesson as MainHub #227).", "reason": null, "rejected": ["re-emit v3 `updatePeople` from the notification service to match an old `peopleStore` listener. Rejected — other Front Desk events already use PascalCase names; handlers for add/update/delete already existed; dual event names would keep the contract ambiguous.", "leave unused hub instance methods (`UpdatePeople`, `ReloadPage`, …) as the “documented” push path. Rejected — they were client-invokable, never called by services, and misled readers (same lesson as MainHub #227)."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-08", "commit": "f8169ab7"}, "last_touched": {"author": "Oliver Zehe
