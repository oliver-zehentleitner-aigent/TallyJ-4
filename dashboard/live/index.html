ror.confirmLeaveFinalized`) as the unlock UX. Rejected — that is an error toast, not a confirm, and StageControl never sent the flag so a click away stayed locked (#309).\n\n**Rejected alternative:** reuse the unused `elections.confirmRevert` string, or auto-send `ConfirmLeavingFinalized` without a dialog. Rejected — leaving Finalized reopens people/ballot writes (#308); the dialog copy must say that, and the API flag must stay a deliberate confirm.\n- Accept-all online ballots is refused while Finalized (`monitoring.acceptAll.finalized`).\n- People, ballot, vote, Front Desk roll, people-import execute / delete-all, ballot/CDN import mutations, and online voter submit (create or update a pending online ballot) are refused while Finalized. Tellers see `elections.finalizedWriteBlocked`; voters see `voting.submit.finalized`. Reads stay open. Unlocking those writes is the confirmed leave-Finalized stage change (#309).\n\n**Rejected alternative (not implemented):** a dedicated lock bit plus a “Move all tellers” command. Stage change + SignalR `statusChanged` is the coordination path.\n\n**Rejected alternative:** invent a second lock type or middleware. The existing `ElectionStage.Finalized` check (same as Accept-all) is the lock; `ElectionFinalizedWriteGuard` is only a shared helper.\n\n**What stays writable on purpose:** election settings, locations, teller names, computers, analysis/results, test-election reset, and people-import file upload/mapping (those do not change the roll until execute). Person-detail reads never mint a kiosk code (including after Finalized). Generate/renew is a write and is blocked after Finalized. Online-window open/close still gates submit when the election is not Finalized.\n\n**Rejected alternative:** leave online voter submit writable while Finalized because the online window (not stage) already gates it. Rejected — Finalized is the lock for people/ballot mutations, including creating or updating a pending online ballot.\n\n**Rejected alternative:** auto-close the online window as part of advancing to Finalized. Rejected — the teller must close the window first; Finalize only refuses while it is still open.", "reason": null, "rejected": ["treat the API 409 (`elections.stageChangeError.confirmLeaveFinalized`) as the unlock UX. Rejected — that is an error toast, not a confirm, and StageControl never sent the flag so a click away stayed locked (#309).", "reuse the unused `elections.confirmRevert` string, or auto-send `ConfirmLeavingFinalized` without a dialog. Rejected — leaving Finalized reopens people/ballot writes (#308); the dialog copy must say that, and the API flag must stay a deliberate confirm.\n- Accept-all online ballots is refused while Finalized (`monitoring.acceptAll.finalized`).\n- People, ballot, vote, Front Desk roll, people-import execute / delete-all, ballot/CDN import mutations, and online voter submit (create or update a pending online ballot) are refused while Finalized. Tellers see `elections.finalizedWriteBlocked`; voters see `voting.submit.finalized`. Reads stay open. Unlocking those writes is the confirmed leave-Finalized stage change (#309).", "invent a second lock type or middleware. The existing `ElectionStage.Finalized` check (same as Accept-all) is the lock; `ElectionFinalizedWriteGuard` is only a shared helper.", "leave online voter submit writable while Finalized because the online window (not stage) already gates it. Rejected — Finalized is the lock for people/ballot mutations, including creating or updating a pending online ballot.", "auto-close the online window as part of advancing to Finalized. Rejected — the teller must close the window first; Finalize only refuses while it is still open."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-07", "commit": "dfc7fb91"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-07", "commit": "dfc7fb91"}]}, "findings": []}, {"id": "election-state.md#move-all-tellers-to-this-state-is-the-stage-broadcast", "uuid": "3535467f-d73b-40c1-84e5-21e2dd34028f", "file": "election-state.md", "line": 45, "end_line": 67, "title": "“Move all tellers to this state” is the stage broadcast", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "inferred (issue #172 names; no separate move-tellers API); FullTeller opt-in confirmed by issue #310", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Changing stage is the move. `ChangeElectionStageAsync` persists the stage and broadcasts `statusChanged` on MainHub. Remote `electionStore` clients update `currentStage`.\n\n- **GuestTellers** auto-redirect to that stage’s primary work page (`useGuestTellerStageRedirect`).\n- **FullTellers** stay on their current page and get a toast. The toast includes a **Go there** action that opens the same work page guests land on. They are not auto-navigated: a FullTeller may be mid-ballot or mid-edit.\n\nWork pages (`getStageWorkPagePath`): GatheringBallots → Front Desk; ProcessingBallots → Enter Ballots; SettingUp / Finalized → election landing.\n\nv3 `statusChanged` updated status in place (`site.broadcast`); there is no documented v3 auto-move for known tellers. Issue #310 left the product choice open; v4 keeps stay-put + opt-in.\n\n**Rejected alternative:** auto-navigate FullTellers the same as guests. Rejected — FullTellers often have unsaved ballot/person edits; yanking the route would lose work. Guests have a narrower page set and are meant to follow the stage.\n\n**Rejected alternative:** toast-only with no action (pre-#310). Rejected — FullTellers had no way to follow the stage from the notice itself.\n\nThere is no separate “Move all tellers to this state” button or endpoint.", "reason": null, "rejected": ["auto-navigate FullTellers the same as guests. Rejected — FullTellers often have unsaved ballot/person edits; yanking the route would lose work. Guests have a narrower page set and are meant to follow the stage.", "toast-only with no action (pre-#310). Rejected — FullTellers had no way to follow the stage from the notice itself."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-07", "commit": "dfc7fb91"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-07", "commit": "dfc7fb91"}]}, "findings": []}, {"id": "election-state.md#guestteller-page-on-stage-change", "uuid": "dda5a858-1d0a-4ac3-b5ea-662cf95e3644", "file": "election-state.md", "line": 68, "end_line": 94, "title": "GuestTeller page on stage change", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #242", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "When election stage changes, GuestTellers are redirected to the stage’s primary work page (same idea as “move all tellers to this state” for navigation):\n\n| Stage | GuestTeller destination |\n|-------|-------------------------|\n| GatheringBallots | Front Desk |\n| ProcessingBallots | Enter Ballots (`/ballots`) |\n| SettingUp / Finalized | election landing (and results links when Finalized) |\n\n**Rejected alternative:** keep ProcessingBallots GuestTellers on election landing only, with ballot entry only via per-ballot deep links (phase-2 restriction). That left guests stuck on Front Desk after a stage advance (or with no stage work page), while Gathering already auto-moved them to Front Desk.\n\n**Reason:** symmetric stage landing for guests; Enter Ballots is the Processing counterpart to Front Desk. Tally/monitor/results stay FullTeller-only (`adminOnly`). Per-ballot `/ballots/:id/entry` routes remain allowed.\n\nImplementation:\n- Rules: `guestTellerAccess.ts`\n- Live redirect: `useGuestTellerStageRedirect` in `MainLayout` (not only the lazy sidebar menu)\n- Secondary: sidebar watch + router `beforeEach`\n- Stage source: MainHub `statusChanged` → `electionStore.currentStage`\n- Main hub membership must stay for the whole election session (`electionStore`); ballots/people pages only join/leave FrontDesk (see `context/realtime.md`)", "reason": "symmetric stage landing for guests; Enter Ballots is the Processing counterpart to Front Desk. Tally/monitor/results stay FullTeller-only (`adminOnly`). Per-ballot `/ballots/:id/entry` routes remain allowed.", "rejected": ["keep ProcessingBallots GuestTellers on election landing only, with ballot entry only via per-ballot deep links (phase-2 restriction). That left guests stuck on Front Desk after a stage advance (or with no stage work page), while Gathering already auto-moved them to Front Desk."], "consequence": null, "considered": null, "why_open": null}, "refs": ["realtime.md"], "git": {"created": {"author": "Glen Little", "date": "2026-08-08", "commit": "ea91188d"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-08", "commit": "ea91188d"}]}, "findings": []}, {"id": "election-state.md#teller-1-2-names-vs-the-election-teller-list", "uuid": "a0267983-42e3-4d0f-8eaa-4c9461565f66", "file": "election-state.md", "line": 95, "end_line": 106, "title": "Teller 1/2 names vs the election teller list", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #287", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Teller 1 and Teller 2 on the ballot listing and an open ballot are **browser-session** selections (shipped in #290). The **election teller list** is separate: typing a name adds it to `Teller` for that election; both dropdowns show that list alphabetically; SignalR `tellersChanged` (MainHub) updates other teller computers; clearing a dropdown does not remove the name. Only the admin Tellers page deletes a name.\n\n**Rejected alternative:** treat clear as delete. Rejected — operators reuse the same names across computers and ballots; clear only means “this workstation is not attributing that person right now.”", "reason": null, "rejected": ["treat clear as delete. Rejected — operators reuse the same names across computers and ballots; clear only means “this workstation is not attributing that person right now.”"], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-31", "commit": "f70ed91f"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-31", "commit": "f70ed91f"}]}, "findings": []}, {"id": "election-state.md#session-teller-1-2-on-an-open-ballot", "uuid": "57f811e5-7cc8-438e-a6cc-ac108e47379e", "file": "election-state.md", "line": 107, "end_line": 124, "title": "Session Teller 1/2 on an open ballot", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #287", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Teller 1 and Teller 2 shown while a ballot is open are the same browser-session inputs as on the ballot listing (localStorage via `useActiveTellers`). Changing them on the ballot updates those session globals; they are not editors of that ballot’s stored `teller1`/`teller2` fields.\n\n**Rejected alternative:** treat the ballot metadata names as per-ballot fields to save on that record. The listing already uses session-global tellers (who is at this keyboard now). Opening a ballot already stamps the current session tellers onto the record; the names on screen need to stay that same session setting so the teller can change them without closing the ballot.\n\nLocation stays read-only on the open ballot in this slice. Adding a name to the election-wide teller list, SignalR to other computers, and admin delete on the Tellers page are a later #287 slice.\n\nImplementation:\n- `useActiveTellers` — shared reactive session state over `activeTellerStorage`\n- `ActiveTellerSelector` on the listing and as the Teller 1/2 cells in `BallotEntryPanel`", "reason": null, "rejected": ["treat the ballot metadata names as per-ballot fields to save on that record. The listing already uses session-global tellers (who is at this keyboard now). Opening a ballot already stamps the current session tellers onto the record; the names on screen need to stay that same session setting so the teller can change them without closing the ballot."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-31", "commit": "efe51fd6"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-31", "commit": "efe51fd6"}]}, "findings": []}, {"id": "election-state.md#concurrent-tellers-automated-coverage-is-sqlite-not-a-browser-driver", "uuid": "c05fa083-2ae0-4c1c-889c-18b9644d53bc", "file": "election-state.md", "line": 125, "end_line": 146, "title": "Concurrent tellers: automated coverage is SQLite, not a browser driver", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #191; same SQLite two-context approach as #336 / Accept-all CAS (evidence: issue #191 leftover; tests named under #191)", "verification": null, "revisit_when": "a Playwright (or other browser) path is adopted as standard, or paper numbering grows a unique/CAS constraint", "see": [], "superseded_by": null, "body": {"text": "Two tellers on two computers is the normal election, not an edge case. Multi-teller SignalR visibility is already shipped. #191 leftover is proving that concurrent **writes** stay consistent: paper ballot rows, Accept-all, and Front Desk.\n\n**Chosen:** SQLite file + two `MainDbContext` instances (`Issue191ConcurrentTellerTests`). In-memory EF cannot prove row locks or `ExecuteUpdate` claims. HTTP coverage on the shared `CustomWebApplicationFactory` is an extra slice (`Issue191ConcurrentTellerHttpTests`) when two authenticated clients are enough. Playwright is not in this repo’s standard path (`E2E_TESTING_GUIDE.md` is smoke/manual).\n\nPaper numbering is `Max(BallotNumAtComputer)+1` per `(location, computer code)`. Product-normal concurrent entry is **two computer codes** (A and B), so the sequences do not share a max. There is no unique index on `(LocationGuid, ComputerCode, BallotNumAtComputer)` and no CAS on teller create — this slice does not invent one. Same-computer concurrent create is not the product-normal path and is not asserted here.\n\nAccept-all vs Front Desk **same person** is still one counted vote (desk method **or** accepted online). Ordered interleavings and stale-context CAS stay in `Issue336AcceptAllFrontDeskRaceTests`. Two overlapping Accept-alls stay in `OnlineVotingServiceAcceptAllConcurrencyTests`. #191 adds a true `Task.WhenAll` of Accept-all + check-in, plus paper entry overlapping Accept-all on a **different** pending voter, plus Unregister + re-check-in overlapping paper entry on another computer (the supported method-change path).\n\n**Rejected alternative:** Playwright two-browser E2E as the first #191 slice. Rejected — frontend tests stay Vitest + jsdom; the leftover is an automated concurrent write proof, not a UI rewrite.\n\n**Rejected alternative:** treat two browsers on the same computer code as the numbering invariant. Rejected — each teller workstation has its own code; colliding Max+1 on one code would be a different product change.\n\n**Reason:** lock the already-shipped multi-teller write contract locally, without Azure SQL and without inventing a new lock.", "reason": "lock the already-shipped multi-teller write contract locally, without Azure SQL and without inventing a new lock.", "rejected": ["Playwright two-browser E2E as the first #191 slice. Rejected — frontend tests stay Vitest + jsdom; the leftover is an automated concurrent write proof, not a UI rewrite.", "treat two browsers on the same computer code as the numbering invariant. Rejected — each teller workstation has its own code; colliding Max+1 on one code would be a different product change."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-19", "commit": "d8f2f514"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-19", "commit": "d8f2f514"}]}, "findings": []}, {"id": "front-desk.md#ballot-not-received-is-a-hide-received-filter", "uuid": "a196ba42-f6b2-44b6-a274-9012b7c9eca5", "file": "front-desk.md", "line": 3, "end_line": 17, "title": "Ballot Not Received is a hide-received filter", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "TallyJ-3.0 `Site/Views/Before/FrontDesk.cshtml` + `.cshtml.less` (`.NoBallot .Voter:not(.VM-)`) (evidence: v3 Front Desk `#ifNoBallot`)", "verification": null, "revisit_when": "election setup exposes checklist flags as first-class mailed-ballot tracking", "see": [], "superseded_by": null, "body": {"text": "v3’s **Ballot Not Received** checkbox hid everyone whose voting method was set (ballot received / recorded). Combined with a checklist/flag, that showed who was flagged (for example mailed a ballot) but still had no method.\n\nv4 already had All / Not registered / Registered radios and method/flag filters. Those cover the same workflow when the default is Not registered, but they did not name the v3 control or apply it on the All list.\n\nThe checkbox is an extra filter on the current list: hide rows with a voting method. Flag filters still apply. Clearing filters turns it off.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-10", "commit": "ba33a193"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-10", "commit": "ba33a193"}]}, "findings": []}, {"id": "front-desk.md#front-desk-method-codes-and-mixed-method-switch", "uuid": "c40905c4-dda1-44f4-9fcd-9a61dc9967fd", "file": "front-desk.md", "line": 18, "end_line": 42, "title": "Front Desk method codes and mixed-method switch", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #194; Person.VotingMethod varchar(1); reports/analyzer already used P/M/D/O/K/I", "verification": null, "revisit_when": "election setup exposes VotingMethods as first-class checkboxes instead of a string", "see": [], "superseded_by": null, "body": {"text": "`Person.VotingMethod` is a single letter: **P** in person, **M** mailed, **D** dropped off, **C** called in, **O** online, **K** kiosk, **I** imported, **1/2/3** custom. Election setup may store the same letters concatenated (`PMD`) or comma-separated aliases (`IP,OL`). Front Desk buttons come from that string except **O** — Online is voter-initiated, so tellers cannot check anyone in as Online (that would count a Front Desk registration with no ballot). Empty setup defaults to P/M/D. The English word “In Person” is not code `I` — `I` is Imported.\n\nOnline ballots stay voter-initiated. Tellers do not create ballots at the Online location. Checking in with a method other than Online while the person has a **Draft** or **Submitted** online row discards that pending row so Accept-all cannot create a second ballot. **Processed** (and **Processing**) online already means they have an accepted/claimed online ballot — Front Desk refuses another method. Draft is not Accept-all pending and does not lock cannot-vote.\n\n**Rejected alternative:** let tellers record `O` at Front Desk when election setup lists Online. Rejected — that marks the person as voted with no Ballot, breaks Front Desk vs ballots reconciliation, and contradicts voter-initiated online.\n\n**Rejected alternative:** keep Front Desk writing `I` for in person. Rejected — reports and analysis already count `I` as Imported and `P` as In Person.\n\n**Rejected alternative:** leave a Submitted row in place after an in-person/mail/kiosk check-in. Rejected — Analyze stays blocked while any live Submitted exists, and Accept-all could mint a second ballot.\n\n**Reason:** mixed-method elections need the same letters everywhere, and a switch of method must not count two ballots.\n\n#186 names this as “online then votes in person.” Draft or Submitted is withdrawn and the Front Desk method is recorded. Processing refuses (`frontDesk.errors.alreadyProcessingOnline`). Processed refuses (`frontDesk.errors.alreadyAcceptedOnline`). Covered in `Issue186OnlineThenInPersonTests`.\n\n**Rejected alternative:** treat the Not registered radio as enough and skip the named checkbox. Rejected — #171 names the control, and operators combine it with flags on the full list.", "reason": "mixed-method elections need the same letters everywhere, and a switch of method must not count two ballots.", "rejected": ["let tellers record `O` at Front Desk when election setup lists Online. Rejected — that marks the person as voted with no Ballot, breaks Front Desk vs ballots reconciliation, and contradicts voter-initiated online.", "keep Front Desk writing `I` for in person. Rejected — reports and analysis already count `I` as Imported and `P` as In Person.", "leave a Submitted row in place after an in-person/mail/kiosk check-in. Rejected — Analyze stays blocked while any live Submitted exists, and Accept-all could mint a second ballot.", "treat the Not registered radio as enough and skip the named checkbox. Rejected — #171 names the control, and operators combine it with flags on the full list."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-12", "commit": "5861bafe"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-12", "commit": "5861bafe"}]}, "findings": []}, {"id": "front-desk.md#roll-call-and-envelope-pages-are-not-v4-product-pages", "uuid": "4d5f8864-b352-4f13-a724-b87d102b19d6", "file": "front-desk.md", "line": 43, "end_line": 57, "title": "Roll Call and envelope pages are not v4 product pages", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "TallyJ-3.0 `Site/Views/menu.xml` (Roll Call / Sort Envelopes require `BallotProcess=Roll`); v4 has no `BallotProcess` setting (evidence: v3 menu vs v4 routes; `docs/Hubs-v3-vs-v4.md`)", "verification": null, "revisit_when": "a projector roll-call display or envelope-sort workflow is requested", "see": [], "superseded_by": null, "body": {"text": "v3 Roll Call and Sort Envelopes existed only for the Roll ballot process. Count Envelopes was `Ballots/Reconcile`. v4 has no Roll process, no Front Desk roll-call or envelope-count routes, and **RollCallHub is deferred**.\n\n`GET .../frontdesk/rollCall` is a leftover that returns eligible voters plus check-in stats. Envelope numbers live on Front Desk (`ENABLE_ENVELOPE_NUMBERS` is still off). Envelope *counting* is the Analyze count-reconciliation report, not a Gathering page.\n\n**Rejected alternative:** rebuild the v3 projector and envelope pages for #171. Rejected — they depended on a process v4 does not have; the remaining API is covered by tests, not a new UI.", "reason": null, "rejected": ["rebuild the v3 projector and envelope pages for #171. Rejected — they depended on a process v4 does not have; the remaining API is covered by tests, not a new UI."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-10", "commit": "ba33a193"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-10", "commit": "ba33a193"}]}, "findings": []}, {"id": "front-desk.md#front-desk-checked-in-count-matches-analysis-voted", "uuid": "e6c4dc57-d36e-4a6b-86b2-0b633b78ce62", "file": "front-desk.md", "line": 58, "end_line": 75, "title": "Front Desk checked-in count matches analysis voted", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #185; [reports.md](reports.md) (evidence: issue #185 count-match leftover)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Header stats and `IsCheckedIn` used `RegistrationTime` only. Accept-all does not set that field, so processed online voters were missing from Front Desk while analysis and reconciliation counted them.\n\n**Chosen:** checked-in = `HasVotedForCounts` (recorded method or Processed online). Same rule as analysis `NumVoters` and VotersByArea `Voted`.\n\n**Rejected alternative:** leave Front Desk on `RegistrationTime` and only document the difference. Rejected — #185 asked the three surfaces to match.\n\nUnregister (and other desk-registration undo) stays on `RegistrationTime`. Accept-all does not create a Front Desk registration, so the overlay must not offer Unregister for Processed-only rows.\n\n**Rejected alternative:** let Unregister clear Processed online. Rejected — `UnregisterVoterAsync` still requires `RegistrationTime`; online acceptance is not a desk check-in.", "reason": null, "rejected": ["leave Front Desk on `RegistrationTime` and only document the difference. Rejected — #185 asked the three surfaces to match.", "let Unregister clear Processed online. Rejected — `UnregisterVoterAsync` still requires `RegistrationTime`; online acceptance is not a desk check-in."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "2eb17a99"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "2eb17a99"}]}, "findings": []}, {"id": "front-desk.md#repeatable-desk-method-while-registration-is-open", "uuid": "65bb3048-44a6-4fee-b206-59e1d5ce68b2", "file": "front-desk.md", "line": 76, "end_line": 96, "title": "Repeatable desk method while registration is open", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #336 after #186 / #334 / #335 (evidence: maintainer, issue #336, 2026-09-13)", "verification": null, "revisit_when": "tellers need in-place method buttons without Unregister", "see": [], "superseded_by": null, "body": {"text": "A pending online row (Draft / Submitted) can be superseded by a desk method. Check-in still withdraws that row (same #186 path). After that, the teller may change the desk method until registration is done.\n\n**Chosen:** keep Unregister + re-check-in. The overlay already offers Unregister when `RegistrationTime` is set, hides method buttons while checked in, and shows them again after Unregister. A second check-in records the new method. No in-place “change method” API.\n\nThe withdrawn online row is deleted. Unregister clears only the desk fields; it does not recreate the row. Accept-all therefore has nothing to process for that person, including after a later Unregister or a second method. There is no separate process-one endpoint — Accept-all is the only accept path.\n\nProcessing / Processed stay refused. Unregister is still not offered without `RegistrationTime`.\n\n**Rejected alternative:** add in-place method-change buttons on the checked-in overlay. Rejected — Unregister + re-check-in already updates the choice and is offered while registration is open.\n\n**Rejected alternative:** invent a new “registration closed” flag or lock Front Desk when leaving Gathering. Rejected — see below.", "reason": null, "rejected": ["add in-place method-change buttons on the checked-in overlay. Rejected — Unregister + re-check-in already updates the choice and is offered while registration is open.", "invent a new “registration closed” flag or lock Front Desk when leaving Gathering. Rejected — see below."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "837fdcc4"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "837fdcc4"}]}, "findings": []}, {"id": "front-desk.md#registration-done-is-the-finalized-write-lock", "uuid": "8835686e-dce7-46a5-835d-a93237dd21b7", "file": "front-desk.md", "line": 97, "end_line": 112, "title": "Registration-done is the Finalized write lock", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "[election-state.md](election-state.md); `FrontDeskService` check-in / Unregister / flags / envelope (evidence: existing `ElectionFinalizedWriteGuard`; maintainer, issue #336)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "There is no separate “end registration” switch. Head tellers already lock people and ballot writes by advancing to **Finalized** (`ElectionFinalizedWriteGuard`). Check-in and Unregister already throw `elections.finalizedWriteBlocked`. The overlay uses that same stage: method, Unregister, and flag writes are not actionable while `electionStage === Finalized`. The notice reuses `elections.finalizedWriteBlocked` (same phrase as the API).\n\nLeaving Finalized (confirmed FullTeller stage change) is what reopens those writes. Gathering / Processing / SettingUp do not lock Front Desk.\n\n**Rejected alternative:** a second lock that closes Front Desk when the election leaves GatheringBallots. Rejected — #336 asked to reuse an existing gate; Finalized already is that lock.\n\n**Reason:** one write lock for people/ballot mutations, including changing how someone registered.", "reason": "one write lock for people/ballot mutations, including changing how someone registered.", "rejected": ["a second lock that closes Front Desk when the election leaves GatheringBallots. Rejected — #336 asked to reuse an existing gate; Finalized already is that lock."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "837fdcc4"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "837fdcc4"}]}, "findings": []}, {"id": "front-desk.md#accept-all-vs-front-desk-same-moment-race", "uuid": "aa9a6bfb-bde4-438e-b09b-4ba786f8962a", "file": "front-desk.md", "line": 113, "end_line": 135, "title": "Accept-all vs Front Desk same-moment race", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #336 leftover after #337 (evidence: issue #336 second slice; SQLite `Issue336AcceptAllFrontDeskRaceTests`)", "verification": null, "revisit_when": "Accept-all or check-in grows a third writer of `OnlineVotingInfo.Status`", "see": [], "superseded_by": null, "body": {"text": "Committed order already had one counted vote: check-in first withdraws Draft/Submitted and Accept-all skips; Accept-all first to **Processing** / **Processed** and Front Desk refuses (`alreadyProcessingOnline` / `alreadyAcceptedOnline`); pass 2 drops the row if a desk method is already recorded; withdraw + Unregister leaves Accept-all nothing.\n\nThe leftover hole was a Front Desk `DbContext` that had already tracked **Submitted**. EF identity resolution keeps that Status after another context claims **Processing** or writes **Processed**. Check-in then deleted the claimed/processed row and wrote a desk method — In Person plus an Online ballot.\n\n**Chosen:** no new product lock. Check-in re-reads Status from the database (not the tracker) and withdraws only with `DELETE … WHERE Status IN (Draft, Submitted)`. 0 rows and the row is now Processing/Processed still throws the existing keys, so a desk method is not recorded on top of a newly Processed online ballot. Accept-all is unchanged.\n\n**Rejected alternative:** a new election-scoped lock that serializes Accept-all with Front Desk. Rejected — #336 said not to invent a product lock; Status compare-and-swap on the existing withdraw/claim is enough.\n\n**Rejected alternative:** tests-only and leave the stale-context write. Rejected — SQLite proved check-in would record a second counted method after Accept-all had already claimed or processed.\n\n**Reason:** one counted vote per person. The desk method wins only while the online row is still Draft or Submitted.\n\nTrue same-moment `Task.WhenAll` of Accept-all + check-in (plus paper entry overlapping Accept-all / Unregister) is `Issue191ConcurrentTellerTests`. That file does not replace the ordered interleavings above.", "reason": "one counted vote per person. The desk method wins only while the online row is still Draft or Submitted.", "rejected": ["a new election-scoped lock that serializes Accept-all with Front Desk. Rejected — #336 said not to invent a product lock; Status compare-and-swap on the existing withdraw/claim is enough.", "tests-only and leave the stale-context write. Rejected — SQLite proved check-in would record a second counted method after Accept-all had already claimed or processed."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "d44e73df"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "d44e73df"}]}, "findings": []}, {"id": "front-desk.md#front-desk-sms-column-is-the-phone-p-row-hint", "uuid": "b92ef9bf-bb5b-4e71-9fe6-c66cf41801a7", "file": "front-desk.md", "line": 136, "end_line": 148, "title": "Front Desk SMS column is the phone P-row hint", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #254 leftover; [sms-eligibility.md](sms-eligibility.md) tenth slice", "verification": null, "revisit_when": "Front Desk should open person detail for Set OK / Block", "see": [{"locator": "sms-eligibility.md#front-desk--people-list-sms-hint-tenth-slice", "uuid": "747af2a6-4ff3-4aa9-954f-b30eb4fb1771", "date": "2026-10-05", "file": "sms-eligibility.md", "anchor": "front-desk--people-list-sms-hint-tenth-slice", "remote": null}], "superseded_by": null, "body": {"text": "Eligible-voter rows include a compact `PhoneOnlineVoter` hint (never-seen / imported / OK / block reason) for people who have a phone. Lookup is P-row scoped; a non-P occupant’s status is not shown. The raw phone is not added to the Front Desk DTO. Set OK / Block stays on person detail — row-click is still check-in.\n\n**Rejected alternative:** inline SMS edits on Front Desk. Person detail already has that action; Front Desk is check-in.", "reason": null, "rejected": ["inline SMS edits on Front Desk. Person detail already has that action; Front Desk is check-in."], "consequence": null, "considered": null, "why_open": null}, "refs": ["sms-eligibility.md"], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "1d552ee5"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "1d552ee5"}]}, "findings": []}, {"id": "i18n-rich-entries.md#leaves-keep-text-and-provenance-together", "uuid": "c8e71dd9-b423-4625-9c3a-487bcf302d5a", "file": "i18n-rich-entries.md", "line": 3, "end_line": 21, "title": "Leaves keep text and provenance together", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #359", "verification": null, "revisit_when": "a translator UI or an external translation memory is added", "see": [], "superseded_by": null, "body": {"text": "Editable locale JSON stores each message as `{ t, s, w }` so a later AI pass can refresh machine drafts without overwriting a human edit, and so a translation can be seen as stale when English changes. vue-i18n still receives plain strings.\n\n**Decision:** source files under `frontend/src/locales/{lang}/*.json`, and string leaves in root `frontend/src/locales/common.json`, use this shape. `t` is the text. `s` is `source` for English and for those root shared strings. Other locales use `ai`, `human`, or `approved`. `w` is ISO-8601 UTC for when that text was last set. `frontend/src/locales/index.ts` unwraps to `t` before `createI18n` / `setLocaleMessage`. `frontend/merge-locales.js` writes `bundled/{lang}.json` as text only. `JsonLocalizationProvider` reads `t` from the same source files the API already points at; it does not read the frontend bundle.\n\n**Rejected alternative:** ship `s` and `w` in `bundled/*.json`. The bundle stays a string catalog, and a missed unwrap cannot return a metadata object from `$t()`.\n\n**Rejected alternative:** sidecar status files. Text and provenance stay on the same key.\n\n**Rejected alternative:** status labels such as `\"AI Draft\"` in the JSON. Codes stay stable for tools. This change does not add UI labels.", "reason": null, "rejected": ["ship `s` and `w` in `bundled/*.json`. The bundle stays a string catalog, and a missed unwrap cannot return a metadata object from `$t()`.", "sidecar status files. Text and provenance stay on the same key.", "status labels such as `\"AI Draft\"` in the JSON. Codes stay stable for tools. This change does not add UI labels."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-23", "commit": "7e5866ca"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-23", "commit": "7e5866ca"}]}, "findings": []}, {"id": "i18n-rich-entries.md#ai-may-refresh-only-ai-drafts", "uuid": "cf424972-df92-4563-9e31-e5877733ae2a", "file": "i18n-rich-entries.md", "line": 22, "end_line": 35, "title": "AI may refresh only `ai` drafts", "type": ["constraint"], "status": "active", "evidence": "confirmed", "source": "issue #359", "verification": null, "revisit_when": "a translator UI or an external translation memory is added", "see": [], "superseded_by": null, "body": {"text": "When English text changes, bump that key's `w`. An AI sync may rewrite a non-English `t` only when `s` is `ai` and that locale's `w` is older than the English `w`. It must not overwrite `human` or `approved`. Those stay as written and are flagged stale for a person. No sync tool or translator UI is part of this change.\n\nThe format migration did not change wording. English and root shared strings were marked `source`. Existing translations were marked `ai` with one shared UTC timestamp, until a person marks them otherwise.\n\nThe portable steps for another repo with this layout are in `docs/i18n-rich-entries-upgrade.md`.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-23", "commit": "7e5866ca"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Oliver Zehentleitner AIgent", "date": "2026-10-05", "commit": "ba0cbdb8"}]}, "findings": []}, {"id": "i18n.md#document-dir-is-set-with-lang", "uuid": "b9a79126-8a25-4cea-8dd9-07db906c0564", "file": "i18n.md", "line": 5, "end_line": 21, "title": "Document `dir` is set with `lang`", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #299 (Bahazid Aref v4 Beta review); `frontend/src/locales/localeDirection.ts`", "verification": null, "revisit_when": "Element Plus ships a first-class app-wide RTL theme we adopt, or a third RTL locale is added", "see": [], "superseded_by": null, "body": {"text": "`:lang(ar)` / `:lang(fa)` already set `direction: rtl` in CSS. That is not enough for UA chrome, screen readers, or Element Plus physical margins (collapse arrows still used `margin-left: auto`). `setLocale` now writes both `lang` and `dir` on `<html>`.\n\nPublic/voter pages wrap in `ElConfigProvider :direction` so Element Plus on those routes follows the same writing direction. The full `element-plus/theme-chalk/rtl.css` sheet is not imported — that would restyle teller/dashboard surfaces that #299 did not ask to reopen.\n\n**Rejected alternative:** hard-code LTR on the voting FAQ or flag row. The review asked for a mirrored layout, not a one-off exception.\n\n**Rejected alternative:** import Element Plus RTL CSS globally. Out of scope for this public/voter layout pass and would shift teller tables and dialogs without a dedicated check.", "reason": null, "rejected": ["hard-code LTR on the voting FAQ or flag row. The review asked for a mirrored layout, not a one-off exception.", "import Element Plus RTL CSS globally. Out of scope for this public/voter layout pass and would shift teller tables and dialogs without a dedicated check."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-04", "commit": "c7678859"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-04", "commit": "c7678859"}]}, "findings": []}, {"id": "i18n.md#version-label-one-string-no-beta-weight-span", "uuid": "00815d97-922d-4b4d-884c-35d9964bac53", "file": "i18n.md", "line": 22, "end_line": 38, "title": "Version label: one string, no Beta weight span", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #299; maintainer follow-up — do not give “Beta” a different font weight", "verification": null, "revisit_when": "Arabic (or other locales) should also switch from Latin `Beta`", "see": [], "superseded_by": null, "body": {"text": "`common.versionDisplay` is rendered as a single `$t(...)` string. There is no `.version-beta` span and no Latin-stack/semibold override for the word Beta.\n\nPersian is `نسخه 4 بتا` (Bahazid’s wording, no guillemets). Other locales, including Arabic, still use Latin `Beta`. A full Persian rewrite stays parked.\n\n> Superseded 2026-09: isolating Latin `Beta` into `.version-beta` to force a consistent weight. Glen does not want Beta at a different weight.\n\n**Rejected alternative:** change Arabic in the same pass. Glen asked for Persian specifically.", "reason": null, "rejected": ["change Arabic in the same pass. Glen asked for Persian specifically."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-04", "commit": "c7678859"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-04", "commit": "c7678859"}]}, "findings": []}, {"id": "i18n.md#public-dark-header-text-is-a-narrow-token-fix", "uuid": "733b2887-169a-4373-a54d-82c0fb001c8e", "file": "i18n.md", "line": 39, "end_line": 48, "title": "Public dark header text is a narrow token fix", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #299 dark-mode note; `#285` owns the designer pass", "verification": null, "revisit_when": "#285 retunes public/voter dark surfaces", "see": [], "superseded_by": null, "body": {"text": "`--color-public-header-text` stayed `--color-primary-700` in dark (navy on navy) and is used on the landing benefits heading. Dark now uses `--color-primary-200`, same as `--color-public-text`. Other public/voter contrast (flag chip, test-only banner hardcoded oranges, Element Plus body copy) stays under #285.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-04", "commit": "c7678859"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-04", "commit": "c7678859"}]}, "findings": []}, {"id": "kiosk.md#login-window-is-15-minutes-and-teller-renewed", "uuid": "9ba42aac-9edf-4aef-b9cb-360db06828ce", "file": "kiosk.md", "line": 9, "end_line": 26, "title": "Login window is 15 minutes and teller-renewed", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "v3 Setup: “Make or renew a Kiosk Code” / “Code will expire after 15 minutes.”; issue #182", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "`POST /api/People/{guid}/generateKioskCode` mints a code if the person has none, or keeps the same `Person.KioskCode` and refreshes `OnlineVoter.VerifyCodeDate`. Direct kiosk login (`voterId === verifyCode`, including `K_` prefix) succeeds only while that stamp is less than 15 minutes old. Opening person details does not mint a code and does not start the clock.\n\nv3’s login helper used a 10-minute constant while the UI said 15. v4 follows the UI and #182 (15 minutes).\n\n**Rejected alternative:** mint on `GetPersonDetails` (the previous v4 behavior). Viewing a record would start a 15-minute window the teller did not intend to share.\n\n**Rejected alternative:** treat a matching `Person.KioskCode` as a permanent login. Anyone who copied the letters could vote later from another machine.\n\n**Rejected alternative:** generate a new letter-code on every renew. v3 reused the same code and only refreshed the window so the teller can read the same letters to the voter.", "reason": null, "rejected": ["mint on `GetPersonDetails` (the previous v4 behavior). Viewing a record would start a 15-minute window the teller did not intend to share.", "treat a matching `Person.KioskCode` as a permanent login. Anyone who copied the letters could vote later from another machine.", "generate a new letter-code on every renew. v3 reused the same code and only refreshed the window so the teller can read the same letters to the voter."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-12", "commit": "bfec9f4e"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-12", "commit": "bfec9f4e"}]}, "findings": []}, {"id": "kiosk.md#shared-kiosk-browser-must-not-keep-the-previous-voter", "uuid": "df6e2735-50de-4e4b-9e98-c3d01d93140c", "file": "kiosk.md", "line": 27, "end_line": 46, "title": "Shared kiosk browser must not keep the previous voter", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #182; v3 cookie was non-persistent", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Kiosk login uses the same httpOnly `voter_token` cookie as other online voters. After a non-draft kiosk submit the login window is closed (`VerifyCode` / `VerifyCodeDate` cleared) so the same code cannot open a **new** session. `Person.KioskCode` stays so the current JWT can still find the row (status / a same-request write). The ballot page then logs out and the confirmation page is a handoff (`?kiosk=1`) with no “back to my elections.”\n\n**Rejected alternative:** set `Person.KioskCode` to empty on submit (v3 used that plus `VotingMethod`). v4 looks up the person by kiosk code for submit/status; clearing it would break an in-flight JWT. Ending the login window plus logout is what isolates the next voter.\n\n**Rejected alternative:** set `VotingMethod = K` on kiosk submit (v3). v4 `HasAcceptedBallot` treats any `VotingMethod` as accepted, which would lock eligibility before Accept-all.\n\nGenerate/renew is refused after Finalized, after a Front Desk `VotingMethod`, after a consumed empty code, or after a Processed online ballot.\n\nKiosk `OnlineVoter` reads and stamps require `VoterIdType == C` (same as phone lookups require `P`). A matching `VoterId` on an email or phone row is not a kiosk session and must not be retagged.\n\nv4 submit does not empty `Person.KioskCode`; empty is the v3 used-code sentinel only.", "reason": null, "rejected": ["set `Person.KioskCode` to empty on submit (v3 used that plus `VotingMethod`). v4 looks up the person by kiosk code for submit/status; clearing it would break an in-flight JWT. Ending the login window plus logout is what isolates the next voter.", "set `VotingMethod = K` on kiosk submit (v3). v4 `HasAcceptedBallot` treats any `VotingMethod` as accepted, which would lock eligibility before Accept-all."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-12", "commit": "bfec9f4e"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-12", "commit": "bfec9f4e"}]}, "findings": []}, {"id": "kiosk.md#login-window-is-election-scoped", "uuid": "93885246-fefa-402e-8a45-1076f0c01c9b", "file": "kiosk.md", "line": 47, "end_line": 62, "title": "Login window is election-scoped", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "`IX_PersonKioskCode` is `(ElectionGuid, KioskCode)`; `OnlineVoter.VoterId` is globally unique", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "`Person.KioskCode` letters may repeat across elections. The 15-minute window lives on an `OnlineVoter` row keyed `{normalizedLetters}.{electionGuid:N}` (type C) — the same string `KioskCodeLifetime.ToVoterId` returns, e.g. `SMART.` plus 32 hex digits. Mint/renew/submit in election A must not stamp or clear election B. A kiosk submit must use a scoped id whose parsed election matches `dto.ElectionGuid`; otherwise it is refused and no pending ballot is created. Auth of the typed letters binds the single open window; if two open elections both have a live window for those letters, login is refused with `voting.auth.verify.voterNotFound` rather than picking `FirstOrDefault`.\n\nFront Desk personal notify targets `ToVoterId(election, letters)` so `VoterPersonalHub` (`Voter{jwtVoterId}`) reaches the kiosk session. The teller-facing letters alone are not the online voter id.\n\n**Rejected alternative:** keep one global `OnlineVoter` per letter-code. Two open elections with `SMART` would share and close each other’s window.\n\n**Rejected alternative:** enforce global uniqueness of live letters at mint time. That would change the teller-facing code when another election already used it, and the person index is already per-election.", "reason": null, "rejected": ["keep one global `OnlineVoter` per letter-code. Two open elections with `SMART` would share and close each other’s window.", "enforce global uniqueness of live letters at mint time. That would change the teller-facing code when another election already used it, and the person index is already per-election."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-12", "commit": "bfec9f4e"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-12", "commit": "bfec9f4e"}]}, "findings": []}, {"id": "kiosk.md#setup-toggle-writes-k-on-votingmethods", "uuid": "e7d442de-8a37-41a2-b04a-fd737da67499", "file": "kiosk.md", "line": 63, "end_line": 72, "title": "Setup toggle writes `K` on `VotingMethods`", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "v3 `VotingMethodsContains(Kiosk)`; v4 already gated person-form kiosk UI on that string", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "The Setup switch adds or removes `K` (or the `KI` alias) without replacing the other tokens. Turning kiosk on also sets `UseOnlineVoting`, because kiosk auth uses the same open-window rule as email/phone.", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-12", "commit": "bfec9f4e"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-12", "commit": "bfec9f4e"}]}, "findings": []}, {"id": "kiosk.md#related", "uuid": null, "file": "kiosk.md", "line": 73, "end_line": 77, "title": "Related", "type": [], "status": "", "evidence": "", "source": null, "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "- Auth (voter cookie)\n- Online ballots\n- People records", "reason": null, "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-12", "commit": "bfec9f4e"}, "last_touched": {"author": "Glen Little", "date": "2026-09-12", "commit": "bfec9f4"}, "status_history": []}, "findings": [{"severity": "warning", "code": "W102", "line": 73, "message": "'Related': level-2 heading without any schema fields — fine for a prose section, an error if this was meant to be an entry"}]}, {"id": "online-ballots.md#draft-autosave-vs-submitted", "uuid": "e531f6ee-65eb-4d30-b7b7-8fbd3df01ac1", "file": "online-ballots.md", "line": 13, "end_line": 32, "title": "Draft autosave vs Submitted", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "maintainer, #303 UAT; voter ballot page", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "While the voter fills names, the ballot page silently autosaves to `OnlineVotingInfo` as status **Draft** (payload in `ListPool`). Reload restores those votes. Draft is not Accept-all pending and does not inflate monitor Submitted counts. Clearing the last name overwrites that saved payload (empty Draft, or payload-only if already Submitted) so leave/return does not restore names the voter just removed. Empty `Votes` is allowed on submit validation for that overwrite. A first visit with no names still does not create a Draft. Monitor `TotalOnlineBallots` is Submitted + Processing + Processed — Draft is not in that total or in pending.\n\nThe explicit **Submit Ballot** action writes the same payload as **Submitted**. Accept-all still takes only `Submitted` + `Processing`.\n\nOnce a row is **Submitted**, later autosaves (reload restore, notify toggle, or a debounced save after Submit) update the payload only. They do not demote Status back to Draft. Allowed writes are Draft→Draft, Draft→Submitted, Submitted→Submitted. The client sends `isDraft: false` after Submit so it agrees with the server; the server also refuses demotion if a stale Draft flag arrives.\n\n**Rejected alternative:** autosave as `Submitted`. Incomplete ballots would appear in pending counts and could be Accept-all’d while the voter was still editing.\n\n**Rejected alternative:** follow `IsDraft` even after Submit. That dropped a finished ballot out of Accept-all pending / monitor Submitted counts on silent autosave.\n\n**Reason:** survive reload without treating an in-progress ballot as ready for tellers, and keep a submitted ballot pending until Accept-all.", "reason": "survive reload without treating an in-progress ballot as ready for tellers, and keep a submitted ballot pending until Accept-all.", "rejected": ["autosave as `Submitted`. Incomplete ballots would appear in pending counts and could be Accept-all’d while the voter was still editing.", "follow `IsDraft` even after Submit. That dropped a finished ballot out of Accept-all pending / monitor Submitted counts on silent autosave."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-11", "commit": "5fc19025"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-11", "commit": "5fc19025"}]}, "findings": []}, {"id": "online-ballots.md#accept-all-of-pending-online-ballots", "uuid": "c3306353-19d3-43ed-9aa1-2c7b358a5936", "file": "online-ballots.md", "line": 33, "end_line": 79, "title": "Accept-all of pending online ballots", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #188, maintainer; v3 `ElectionHelper.ProcessOnlineBallots`", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "A voter submit stores a pending payload on `OnlineVotingInfo` (status `Submitted`). It does not create a regular `Ballot`. Submit (create or update a pending online ballot) is refused while the election is Finalized (`voting.submit.finalized`), even if the online window is still open. Window-based open/close still applies when the election is not Finalized.\n\nAdvancing **to** Finalized is refused while that same window is currently open (`elections.stageChangeError.onlineVotingStillOpen`). Close the window first; Finalize does not close it. `UseOnlineVoting` plus a null open/close is treated as open (same as submit / available-elections).\n\nA logged-in teller may Accept-all current pending online ballots while the online voting window is still open, and may do so more than once. Each run only accepts rows that are `Submitted` or already `Processing` at that moment.\n\nAn empty Submitted overwrite (voter cleared every name after Submit) stays `Submitted` — never demoted to Draft. It still counts as pending on the monitor. Accept-all does not claim that payload and does not set `Processed`: there are no votes to turn into an OL ballot, and finalizing would lock the voter out with nothing counted. That row is pending-but-skipped until names are written again. A leftover `Processing` claim with an empty payload is restored to `Submitted` instead of wiped.\n\nAccept-all creates a regular ballot at the Online location (computer code `OL`) as if a teller had typed from paper, then wipes the online payload (`ListPool`, `PoolLocked`, `BallotGuid`) and sets status `Processed`. After that, the voter cannot change the vote. Acceptance is not reversible: we do not keep a link from the online row to the regular ballot.\n\nv3 required the window to be closed before processing. That was rejected here so tellers can accept current pending ballots up to the last moment without shutting voters out.\n\nA second overlapping Accept-all for the same election on one host is refused (process-wide election-scoped lock, HTTP 409). That lock is only a fast same-host gate. Two app servers can share one database, so uniqueness is in the row status, not in process memory.\n\nAccept-all is two passes:\n\n1. Load the expected `Submitted` (and already-`Processing`) row ids, then persist `Processing` with `UPDATE … SET Status = Processing WHERE Status = Submitted`. Another server can see that claim. `Processing` is a real stored status (varchar(10); the word fits). Empty Submitted rows (no votes, no legacy `BallotGuid`) are left out of this claim set.\n2. For each expected id, open a transaction and process **only if the row is still `Processing`** (`UPDATE … SET Status = Processed WHERE Status = Processing`). 0 rows means the other server already took it. Ballot create and payload wipe share that transaction; a rollback restores `Processing` so a later run can retry. If the taken row has no votes and no legacy `BallotGuid`, Status is restored to `Submitted` (not Draft, not Processed).\n\nSubmit updates with `WHERE Status = Submitted AND BallotGuid IS NULL`, and rejects when `BallotGuid` is set or status is `Processing`/`Processed`, so it cannot revive a claimed row or mint a second ballot from a legacy submitted row.\n\nIn v3, a second call that started while the first was still creating ballots produced duplicates. The in-process lock serializes Accept-all on one host; the two-pass DB claim is what makes duplicates impossible across instances and vs Submit.\n\nRows that already have a `BallotGuid` from the older submit-creates-ballot path are marked `Processed` and unlinked without creating a second ballot. The voter cannot resubmit those rows (`BallotGuid` is not nulled).\n\n**Rejected alternative:** keep creating the regular ballot on voter submit, and treat Accept-all as only a status flip. That would not match “create a new regular ballot and wipe the online content,” and a concurrent accept that also created ballots is the failure mode from #188.\n\n**Rejected alternative:** treat the in-process lock plus a Status re-read as enough to prevent duplicates. Two Azure instances can both read `Submitted` under READ COMMITTED, and a Submit that loaded `Submitted` can overwrite `Processed` if it UPDATEs by primary key only.\n\n**Rejected alternative:** jump `Submitted` → `Processed` in one transaction with no stored interim. That CAS is atomic, but while one server is still creating ballots the row still looks `Submitted` to everyone else until commit. A persisted `Processing` claim is visible to the other server for the whole run.\n\n**Rejected alternative:** require the online window to be closed before Accept-all (v3). Tellers need to accept what is in hand without closing voting.\n\n**Rejected alternative:** Accept-all an empty Submitted overwrite as `Processed` with no OL ballot (the path `Votes: []` opened). That locks the voter out (`CannotChangeOnlineVote`) with nothing counted if a teller Accept-alls while names are cleared mid-edit.\n\n**Rejected alternative:** demote empty Submitted to Draft so Accept-all ignores it. Draft vs Submitted is never-demote; an emptied resubmit stays Submitted and pending-but-skipped.\n\n**Reason:** pending votes stay changeable until a teller accepts them; accepted votes become ordinary ballots with no remaining online payload.", "reason": "pending votes stay changeable until a teller accepts them; accepted votes become ordinary ballots with no remaining online payload.", "rejected": ["keep creating the regular ballot on voter submit, and treat Accept-all as only a status flip. That would not match “create a new regular ballot and wipe the online content,” and a concurrent accept that also created ballots is the failure mode from #188.", "treat the in-process lock plus a Status re-read as enough to prevent duplicates. Two Azure instances can both read `Submitted` under READ COMMITTED, and a Submit that loaded `Submitted` can overwrite `Processed` if it UPDATEs by primary key only.", "jump `Submitted` → `Processed` in one transaction with no stored interim. That CAS is atomic, but while one server is still creating ballots the row still looks `Submitted` to everyone else until commit. A persisted `Processing` claim is visible to the other server for the whole run.", "require the online window to be closed before Accept-all (v3). Tellers need to accept what is in hand without closing voting.", "Accept-all an empty Submitted overwrite as `Processed` with no OL ballot (the path `Votes: []` opened). That locks the voter out (`CannotChangeOnlineVote`) with nothing counted if a teller Accept-alls while names are cleared mid-edit.", "demote empty Submitted to Draft so Accept-all ignores it. Draft vs Submitted is never-demote; an emptied resubmit stays Submitted and pending-but-skipped."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-02", "commit": "04a6c711"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-02", "commit": "04a6c711"}]}, "findings": []}, {"id": "online-ballots.md#automated-coverage-for-submit-accept-all-counts", "uuid": "70da22e7-4629-4117-9bb6-1fb851d56d6f", "file": "online-ballots.md", "line": 80, "end_line": 98, "title": "Automated coverage for submit → Accept-all → counts", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #169 remaining; HTTP integration in `OnlineVotingBallotFlowTests`", "verification": null, "revisit_when": null, "see": [{"locator": "election-state.md#concurrent-tellers-automated-coverage-is-sqlite-not-a-browser-driver", "uuid": "c05fa083-2ae0-4c1c-889c-18b9644d53bc", "date": "2026-10-05", "file": "election-state.md", "anchor": "concurrent-tellers-automated-coverage-is-sqlite-not-a-browser-driver", "remote": null}], "superseded_by": null, "body": {"text": "Issue #169 is the test script for this process, not a second product build. Coverage is the HTTP integration path (voter submit → teller Accept-all → monitor/summary counts, ListPool wipe, OL regular ballot, tally) plus the existing Accept-all service tests and monitor Vitest counts. That HTTP test uses the shared SQLite `CustomWebApplicationFactory`, which is relational, so it exercises the `ExecuteUpdate` claim that in-memory unit tests skip.\n\n**Rejected alternative:** Playwright browser E2E. Frontend tests stay Vitest + jsdom; the monitor already locks counts-only (no named pending/accepted list) and a reload after Accept-all.\n\n**Rejected alternative:** run these automated tests against Azure SQL. Backend.Tests stay on the local SQLite factory. Live cloud-agent app runs use local Docker SQL + migrations + SeedOnStartup, not production Azure SQL.\n\n**Reason:** lock the already-shipped Accept-all contract (including anonymity: counts only) without a browser driver and without a production database.\n\nTwo tellers at once (paper create + Accept-all + Front Desk) is issue #191, not a second Accept-all product. Coverage is SQLite multi-context in `Issue191ConcurrentTellerTests` (and a small HTTP two-client slice). Ordered Accept-all vs check-in stays #336; two Accept-alls stay `OnlineVotingServiceAcceptAllConcurrencyTests`. See [election-state.md](election-state.md).", "reason": "lock the already-shipped Accept-all contract (including anonymity: counts only) without a browser driver and without a production database.", "rejected": ["Playwright browser E2E. Frontend tests stay Vitest + jsdom; the monitor already locks counts-only (no named pending/accepted list) and a reload after Accept-all.", "run these automated tests against Azure SQL. Backend.Tests stay on the local SQLite factory. Live cloud-agent app runs use local Docker SQL + migrations + SeedOnStartup, not production Azure SQL."], "consequence": null, "considered": null, "why_open": null}, "refs": ["election-state.md"], "git": {"created": {"author": "Glen Little", "date": "2026-09-07", "commit": "4c3fe36b"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-07", "commit": "4c3fe36b"}]}, "findings": []}, {"id": "online-ballots.md#pending-vs-accepted-on-the-monitor-counts-only", "uuid": "7cefe595-8f02-4f93-8a87-1975f6201818", "file": "online-ballots.md", "line": 99, "end_line": 130, "title": "Pending vs accepted on the monitor (counts only)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #188 remaining slice; maintainer, PR #296", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "> Superseded 2026-09: a named pending/accepted row list (person + WhenStatus) was rejected — see below.\n\nThe monitor tells pending from accepted using `OnlineVotingInfo.Status` counts only:\n\n- **Pending** = `Submitted` + `Processing` for people who have **no** Front Desk method other than Online (same set Accept-all will take).\n- **Pending, voted another way** = leftover `Submitted`/`Processing` after a paper/mail/kiosk/imported check-in. Count only. Accept-all will not create a ballot.\n- **Submitted** = still changeable.\n- **Processing** = claimed by Accept-all; submit is already blocked.\n- **Accepted** = `Processed`.\n\nThe same monitor page also shows **ballots by method** (In Person, Mailed, Dropped Off, Kiosk, Online) as people counts. Online includes Processed rows that have no other Front Desk method — v4 Accept-all does not set `VotingMethod`.\n\nNo person name, email, phone, kiosk, voter id, row id, or WhenStatus is returned or rendered for these rows. Front Desk / people roll may still show who voted; that is a different surface and is not paired with the OL ballots Accept-all creates.\n\n**Rejected alternative:** list person names (or hide names in the UI while the API still sends them). Pairing a named pending/accepted list with the regular OL ballots created by Accept-all identifies how that person voted. Worst when n=1.\n\n**Rejected alternative:** suppress names only when the pending or accepted count is under 10. Watching names (or named rows) move during Accept-all still matches a voter to the new OL ballot.\n\n**Rejected alternative:** keep anonymous per-row Status/WhenStatus lists. A timestamped or shrinking row list can be watched the same way during Accept-all.\n\n**Rejected alternative:** treat the accepted side as a join to the regular `Ballot`. Acceptance is not reversible and must not reconnect the online row to the counted ballot.\n\n**Reason:** tellers need pending vs accepted (and Submitted vs Processing) across multiple Accept-all runs while the window stays open, without a secret-ballot leak.", "reason": "tellers need pending vs accepted (and Submitted vs Processing) across multiple Accept-all runs while the window stays open, without a secret-ballot leak.", "rejected": ["list person names (or hide names in the UI while the API still sends them). Pairing a named pending/accepted list with the regular OL ballots created by Accept-all identifies how that person voted. Worst when n=1.", "suppress names only when the pending or accepted count is under 10. Watching names (or named rows) move during Accept-all still matches a voter to the new OL ballot.", "keep anonymous per-row Status/WhenStatus lists. A timestamped or shrinking row list can be watched the same way during Accept-all.", "treat the accepted side as a join to the regular `Ballot`. Acceptance is not reversible and must not reconnect the online row to the counted ballot."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-02", "commit": "e3525a6c"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-02", "commit": "e3525a6c"}]}, "findings": []}, {"id": "online-ballots.md#mixed-methods-do-not-accept-a-second-ballot", "uuid": "c08032e9-fd86-441f-ba6b-1e17b4111196", "file": "online-ballots.md", "line": 131, "end_line": 148, "title": "Mixed methods: do not accept a second ballot", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #194; Accept-all still creates an OL ballot unless skipped; Front Desk check-in used to ignore online status", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "If a voter submits online and then votes another way, the Front Desk method wins for that person: the pending Draft/Submitted row is withdrawn on check-in. Accept-all also skips (and removes) leftover Submitted/Processing rows when the person already has P/M/D/C/I/K/1/2/3. Online submit is refused after those methods. Processed online still locks cannot-vote and refuses Front Desk check-in.\n\nKiosk on Front Desk is a recorded method (`K`), counted separately from Online. Kiosk *login* (kiosk code → online ballot) is still the online path until a teller records `K`.\n\n**Rejected alternative:** treat `Person.HasOnlineBallot` or a Draft row as already voted. Rejected — Draft is restore-only; pending Submitted is still changeable; the accepted signal is Processed or a Front Desk method.\n\n**Rejected alternative:** set `VotingMethod=O` on Accept-all. Rejected — existing recon/people docs treat Processed without a method as the online record; changing Accept-all would relitigate #188.\n\n**Reason:** real elections mix methods; the counted ballot must be one path per person.", "reason": "real elections mix methods; the counted ballot must be one path per person.", "rejected": ["treat `Person.HasOnlineBallot` or a Draft row as already voted. Rejected — Draft is restore-only; pending Submitted is still changeable; the accepted signal is Processed or a Front Desk method.", "set `VotingMethod=O` on Accept-all. Rejected — existing recon/people docs treat Processed without a method as the online record; changing Accept-all would relitigate #188."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-12", "commit": "5861bafe"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-12", "commit": "5861bafe"}]}, "findings": []}, {"id": "online-ballots.md#monitor-5-minute-close-countdown", "uuid": "29034508-1d83-4704-bc64-7f7e20d71096", "file": "online-ballots.md", "line": 149, "end_line": 166, "title": "Monitor: 5-minute close countdown", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #184 remaining slice; v3 `Monitor.cshtml` / `closeOnline`", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "The Monitor Progress Online Voting panel leads with **Open** / **Closing soon** / **Closed**, a relative close line, and a `m:ss` clock in the last five minutes. Full tellers can **Schedule close in 5 minutes** (firm — `OnlineCloseIsEstimate = false`), **Close now** (one second ago, estimate unchanged), or **Open for 5 minutes** when already closed (estimate unchanged). Those buttons call the existing online-window API; they do not invent a second close path.\n\nv3 used “Expected to close” when the close was an estimate and “Will close” when firm. The last-five-minute highlight is `minutes <= 5` (same as v3 `onlineSoon`).\n\n**Rejected alternative:** put the 5-minute / close-now buttons only on the header Online Voting drawer. Rejected — v3 tellers used them on Monitor Progress; the header already has the date pickers.\n\n**Rejected alternative:** implement named “active voters building a ballot” in the same slice. Rejected — Draft is restore-only and is not Accept-all pending; a named list next to pending/accepted OL counts would reopen the secret-ballot pairing #188 closed. Anonymous ballot-page sessions are the later #184 item (see below).\n\n**Reason:** tellers need a visible, testable 5-minute close on the monitor without pairing voters to ballots.", "reason": "tellers need a visible, testable 5-minute close on the monitor without pairing voters to ballots.", "rejected": ["put the 5-minute / close-now buttons only on the header Online Voting drawer. Rejected — v3 tellers used them on Monitor Progress; the header already has the date pickers.", "implement named “active voters building a ballot” in the same slice. Rejected — Draft is restore-only and is not Accept-all pending; a named list next to pending/accepted OL counts would reopen the secret-ballot pairing #188 closed. Anonymous ballot-page sessions are the later #184 item (see below)."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-06", "commit": "82d599b9"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-06", "commit": "82d599b9"}]}, "findings": []}, {"id": "online-ballots.md#monitor-connected-online-voters-sessions-not-names", "uuid": "9896b319-c335-419a-ac05-5057ca6de81e", "file": "online-ballots.md", "line": 167, "end_line": 194, "title": "Monitor: connected online voters (sessions, not names)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #184 remaining slice; Draft autosave exists for restore only; v3 `AllVotersHub` docs in `docs/Hubs-in-v3.md` have no connection-count API and no named composing list", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "v3 Monitor (this repo’s hub docs) pushed online window changes via FrontDeskHub. It did not document a named “who is building a ballot” list, and v3 `AllVotersHub` was a global notify group with no membership-count API.\n\nv4 Draft is silent autosave only (not Accept-all pending). The monitor still does not list who is composing. “Building a ballot” is not shown as names.\n\nThe monitor count strip includes **Ballot-page sessions**: an anonymous count of AllVotersHub connections that called `JoinElection` for this election (the voter ballot page). One person with two tabs counts as two. The API and UI return that integer only — no person name, email, phone, kiosk, voter id, row id, or WhenStatus. `IOnlineVoterPresenceService` stores connection id → election GUID only.\n\nThe count is same-host in-memory. Two app servers do not share it. Auto-refresh (30s) is how tellers see a new number.\n\n`VoterPersonalHub` cannot do this safely: its group is `Voter{voterId}` (identifying) and the voter JWT has no election claim.\n\n**Rejected alternative:** a named list of voters on the ballot page. Pairing that list with pending/accepted OL / Accept-all identifies how that person voted.\n\n**Rejected alternative:** put the site-wide `AllVoters` connection count on a per-election monitor. A voter on another election’s list would inflate this election. Misleading.\n\n**Rejected alternative:** use Draft (or a composing heartbeat) as a named “building a ballot” list. Draft exists for reload restore; putting those names next to pending/accepted OL counts would reopen the secret-ballot pairing #188 closed. Not needed for “is anyone currently on this election’s ballot page?”\n\n**Rejected alternative:** count unique voter ids (hashed) instead of sessions. Rejected for this slice — the product ask is sessions, and storing voter ids next to an election (even hashed) is extra identity surface for no teller gain.\n\n**Reason:** tellers need a live anonymous signal that this election’s voting UI is in use, without a secret-ballot leak and without calling it “building a ballot.”", "reason": "tellers need a live anonymous signal that this election’s voting UI is in use, without a secret-ballot leak and without calling it
