  --fg: #dcdce3; --fg2: #a2a2ad; --fg3: #6f6f7a;
  --accent: #835bec; --accent2: #a98cf5;
  --ok: #4fbf7a; --warn: #e0a83a; --bad: #e0574f; --info: #4aa3df; --muted: #8b8b98;
  --confirmed: #4fbf7a; --inferred: #e0a83a; --unknown: #e0574f;
  --active: #835bec; --superseded: #6f6f7a; --open: #4aa3df; --needs-review: #e0a83a; --pending-confirmation: #d66fd6;
  --radius: 8px; --font: -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #fafafa; --bg2: #ffffff; --bg3: #f0f0f3; --line: #e2e2e8;
  --fg: #1f1f26; --fg2: #55555f; --fg3: #8a8a96; --superseded: #9a9aa6;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 var(--font); background: var(--bg); color: var(--fg); }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.app { display: grid; height: 100vh; grid-template-columns: 280px 1fr 340px; grid-template-rows: 48px 36px 1fr 24px;
  grid-template-areas: "top top top" "strip strip strip" "side main details" "status status status"; }
.strip { grid-area: strip; display: flex; align-items: center; gap: 6px; padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--line); overflow-x: auto; white-space: nowrap; font-size: 12px; }
.strip .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: none; }
.strip .lbl { color: var(--fg2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
.strip a.stat { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); background: var(--bg); }
.strip a.stat b { color: var(--fg); font-weight: 650; }
.strip a.stat:hover { text-decoration: none; border-color: var(--fg3); }
.strip a.stat.zero { color: var(--fg2); } .strip a.stat.zero b { color: var(--fg2); font-weight: 500; }
.strip a.stat.q-open b { color: var(--open); } .strip a.stat.q-needs-review b { color: var(--needs-review); } .strip a.stat.q-pending-confirmation b { color: var(--pending-confirmation); } .strip a.stat.q-unknown b { color: var(--unknown); }
.strip a.stat.lint-bad b { color: var(--bad); } .strip a.stat.lint-warn b { color: var(--warn); } .strip a.stat.lint-ok b { color: var(--ok); }
.strip a.stat.hot { border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
/* The top bar stays dark in both themes, like the site's header: the wordmark is made for a dark ground. */
.topbar { grid-area: top; display: flex; align-items: center; gap: 16px; padding: 0 14px; background: #141418; border-bottom: 1px solid #2a2a31; color: #e6e6ec; color-scheme: dark; }
.topbar .project { color: #b4b4be; } .topbar .project b { color: #ffffff; }
.topbar .pill { background: #23232a; color: #c4c4cc; border-color: #3a3a43; font-size: 12px; line-height: 20px; }
.topbar .pill a, .topbar a.gh { color: #c9b8ff; }
.topbar #search, .topbar .project-select { background: #1e1e24; color: #e6e6ec; border-color: #3a3a43; }
.topbar #search::placeholder { color: #7a7a86; }
.topbar .icon-btn { color: #c4c4cc; border-color: #3a3a43; } .topbar .icon-btn:hover { color: #fff; border-color: #6f6f7a; }
.topbar .live { color: #6f6f7a; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--fg); letter-spacing: .2px; }
.brand:hover { text-decoration: none; }
.brand img { display: block; }
.brand .wordmark { height: 29px; width: auto; }
.gh { color: var(--fg2); }
.host-mark { width: 1em; height: 1em; vertical-align: -0.15em; margin-right: 0.3em; fill: currentColor; flex: none; }
.queue-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 8px 0 8px; }
.queue-tiles a.tile { color: var(--fg); }
.queue-tiles a.tile:hover { border-color: var(--accent); text-decoration: none; }
.project-select { max-width: 60vw; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 14px; }
.project-select:focus { border-color: var(--accent); outline: none; }
.project { color: var(--fg2); font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
.project b { color: var(--fg); font-weight: 600; }
.project .pill { margin-left: 8px; }
.topbar-right { display: flex; align-items: center; gap: 10px; position: relative; }
#search { width: 300px; padding: 6px 10px; font-size: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); outline: none; }
#search:focus { border-color: var(--accent); }
.search-results { position: absolute; top: 40px; right: 70px; width: 480px; max-height: 60vh; overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 20; }
.search-results a { display: block; padding: 8px 12px; color: var(--fg); border-bottom: 1px solid var(--line); }
.search-results a:hover, .search-results a.sel { background: var(--bg3); text-decoration: none; }
.search-results .sr-file { color: var(--fg3); font-size: 12px; }
.search-results .sr-snip { color: var(--fg2); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.search-results mark { background: transparent; color: var(--accent2); font-weight: 600; }
.live { color: var(--fg3); font-size: 12px; }
.live.on { color: var(--ok); animation: pulse 2.4s ease-in-out infinite; }
.live.off { color: var(--bad); }
.live.export { color: var(--info); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.icon-btn { background: transparent; border: 1px solid var(--line); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; color: var(--fg2); }
.icon-btn:hover { color: var(--fg); border-color: var(--fg3); }
.link-btn { background: none; border: 0; color: var(--accent2); cursor: pointer; padding: 0; font-size: 12px; }

.sidebar { grid-area: side; overflow: auto; background: var(--bg2); border-right: 1px solid var(--line); padding: 10px 0; }
.nav a { display: flex; justify-content: space-between; padding: 6px 16px; color: var(--fg2); }
.nav a:hover { color: var(--fg); text-decoration: none; background: var(--bg3); }
.nav a.active { color: var(--fg); background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 6px; border-top: 1px solid var(--line); margin-top: 8px; }
.filters select { flex: 1 1 100%; background: var(--bg); color: var(--fg2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
.filters select.set { color: var(--fg); border-color: var(--accent); }
.tree-head { padding: 12px 16px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); }
.count { color: var(--fg3); font-size: 11px; font-weight: 400; }
.tree details { margin: 0; }
.tree summary { list-style: none; cursor: pointer; padding: 5px 16px; color: var(--fg); display: flex; align-items: center; gap: 6px; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary .tw { color: var(--fg3); font-size: 10px; width: 10px; transition: transform .15s; display: inline-block; }
.tree details[open] summary .tw { transform: rotate(90deg); }
.tree summary:hover { background: var(--bg3); }
.tree summary.active { background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.tree summary .count { margin-left: auto; }
.tree .leaf { display: flex; align-items: center; gap: 8px; padding: 3px 16px 3px 32px; color: var(--fg2); font-size: 13px; }
.tree .leaf:hover { background: var(--bg3); color: var(--fg); text-decoration: none; }
.tree .leaf.active { color: var(--fg); background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.tree .leaf.dim { opacity: .35; }
.tree .leaf span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; background: var(--muted); }
.dot.confirmed { background: var(--confirmed); } .dot.inferred { background: var(--inferred); } .dot.unknown { background: var(--unknown); }
.dot.superseded { opacity: .4; }

.main { grid-area: main; overflow: auto; padding: 24px 32px 60px; }
.details { grid-area: details; overflow: auto; display: flex; flex-direction: column; background: var(--bg2); border-left: 1px solid var(--line); padding: 16px; font-size: 13px; }
.statusbar { grid-area: status; display: flex; gap: 18px; align-items: center; padding: 0 14px; font-size: 11px; color: var(--fg3); background: var(--bg2); border-top: 1px solid var(--line); }
.statusbar a { color: var(--fg2); } .statusbar a:hover { color: var(--fg); }
.statusbar .outdated a { color: var(--accent2); background: linear-gradient(90deg, var(--accent2) 0%, #fff 45%, var(--accent2) 55%, var(--accent2) 100%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 2.8s linear infinite; cursor: help; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -40% 0; } }
@media (prefers-reduced-motion: reduce) { .statusbar .outdated a { animation: none; -webkit-text-fill-color: currentColor; background: none; color: var(--accent2); text-decoration: underline dotted; } }

h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 17px; margin: 24px 0 10px; font-weight: 600; }
h3 { font-size: 13px; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); font-weight: 600; }
.sub { color: var(--fg2); margin: 0 0 18px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; line-height: 18px; background: var(--bg3); color: var(--fg2); border: 1px solid var(--line); white-space: nowrap; }
.pill.type { border-color: transparent; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent2); }
.pill.status-active { color: var(--active); border-color: var(--active); }
.pill.fork { border-style: dashed; }
.pill.fork a { color: inherit; }
.pill.status-superseded { color: var(--superseded); text-decoration: line-through; }
.pill.status-open { color: var(--open); border-color: var(--open); }
.pill.status-needs-review { color: var(--needs-review); border-color: var(--needs-review); }
.pill.status-pending-confirmation { color: var(--pending-confirmation); border-color: var(--pending-confirmation); }
.pill.ev-confirmed { color: var(--confirmed); border-color: var(--confirmed); }
.pill.ev-inferred { color: var(--inferred); border-color: var(--inferred); }
.pill.ev-unknown { color: var(--unknown); border-color: var(--unknown); }
.pill.sev-error { color: var(--bad); border-color: var(--bad); }
.pill.sev-warning { color: var(--warn); border-color: var(--warn); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 8px; }
.tile { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .n { font-size: 26px; font-weight: 650; line-height: 1.1; }
.tile .l { color: var(--fg2); font-size: 12px; }
.tile.warn .n { color: var(--warn); } .tile.bad .n { color: var(--bad); } .tile.ok .n { color: var(--ok); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.bars { display: grid; grid-template-columns: minmax(0, max-content) 1fr max-content; gap: 6px 10px; align-items: center; }
.bars .k { color: var(--fg2); font-size: 12px; overflow-wrap: anywhere; }
.bars .v { font-size: 12px; color: var(--fg2); text-align: right; min-width: 24px; }
.bar { height: 10px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar i.confirmed, .bar i.ok { background: var(--confirmed); } .bar i.inferred { background: var(--inferred); } .bar i.unknown { background: var(--unknown); }
.bar i.active { background: var(--active); } .bar i.superseded { background: var(--superseded); } .bar i.open { background: var(--open); } .bar i.needs-review { background: var(--needs-review); } .bar i.pending-confirmation { background: var(--pending-confirmation); }
.stack { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--bg3); }
.stack i { display: block; height: 100%; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv .k { color: var(--fg3); }
.kv .v { color: var(--fg); word-break: break-word; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--fg3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:hover td { background: var(--bg3); }
table.t tr.clickable { cursor: pointer; }

.topic-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.topic-card { display: block; color: var(--fg); background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.topic-card:hover { border-color: var(--accent); text-decoration: none; }
.topic-card .tt { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
.topic-card .td { color: var(--fg2); font-size: 12.5px; min-height: 36px; }
.topic-card .stack { margin-top: 10px; }
.topic-card .refs { color: var(--fg3); font-size: 11px; margin-top: 6px; }

.entry-list .row { display: block; color: var(--fg); padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg2); margin-bottom: 8px; }
.entry-list .row:hover { border-color: var(--accent); text-decoration: none; }
.entry-list .row .rt { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.entry-list .row .rs { color: var(--fg2); font-size: 12.5px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry-list .row .rm { color: var(--fg3); font-size: 11px; margin-top: 6px; }
.entry-list .row.dim { opacity: .4; }
/* search: the dropdown's footer link and the results page */
.search-results a.sr-all { color: var(--accent2); font-size: 12px; font-weight: 600; border-bottom: 0; }
.search-results .sr-missing { padding: 6px 12px; color: var(--fg3); font-size: 12px; border-bottom: 1px solid var(--line); }
.search-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.search-head h1 .q { color: var(--accent2); }
.search-page { max-width: 980px; }
.search-page .sgroup { margin: 0 0 22px; }
.search-page .sg-head { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; }
.search-page .sg-head .count { color: var(--fg3); font-size: 12px; }
.search-page .sgroup > .ms { margin: -4px 0 8px; font-size: 12px; }
.search-page mark { background: transparent; color: var(--accent2); font-weight: 600; }
.search-page .row .rs { -webkit-line-clamp: 3; }
.search-page .sgroup.missing .sr-missing { color: var(--fg2); font-size: 12.5px; padding: 3px 0; }

.reader { max-width: 820px; }
.reader .crumbs { color: var(--fg3); font-size: 12px; margin-bottom: 8px; }
.reader .crumbs a { color: var(--fg2); }
.reader h1 { font-size: 24px; line-height: 1.25; }
.reader .fields { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 22px; }
.reader .body p { margin: 0 0 12px; line-height: 1.65; font-size: 15px; }
.reader .body ul, .reader .body ol { margin: 0 0 12px 22px; line-height: 1.6; font-size: 15px; }
.reader .body pre { background: var(--bg3); padding: 12px; border-radius: 6px; overflow: auto; }
.reader .body pre code { background: transparent; padding: 0; }
.reader .body .label { display: block; margin: 16px 0 8px; padding: 10px 14px; border-left: 3px solid var(--line); background: var(--bg2); border-radius: 0 6px 6px 0; }
.reader .body .label > b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); margin-bottom: 4px; }
.reader .body .label.reason { border-left-color: var(--accent); }
.reader .body .label.rejected { border-left-color: var(--bad); }
.reader .body .label.consequence { border-left-color: var(--info); }
.reader .body .label.considered { border-left-color: var(--warn); }
.reader .body .label.why-open { border-left-color: var(--open); }
.reader .body .label p { margin: 0 0 6px; font-size: 14.5px; }
.reader .body .label p:last-child { margin: 0; }
.reader .pager { display: flex; justify-content: space-between; margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
.reader.superseded h1 { color: var(--fg2); }

.details h3:first-child { margin-top: 0; }
.details .fill { flex: 1; min-height: 0; }
.details .mini { position: relative; min-height: 220px; height: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
.details .mini canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; }
.details .mini.tall { height: 320px; flex: none; }
.details .mini .mini-hint { position: absolute; bottom: 6px; right: 8px; font-size: 10px; color: var(--fg3); pointer-events: none; }
.details .mini .mini-title { position: absolute; top: 6px; left: 8px; font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; pointer-events: none; }
.details .legend-list { display: grid; gap: 6px; font-size: 12px; color: var(--fg2); }
.details .legend-list .dot { margin-right: 6px; vertical-align: middle; }
table.t.findings td { font-size: 12.5px; } table.t.findings .mono { white-space: nowrap; }
.details .empty { color: var(--fg3); }
.details .hist { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); margin-left: 6px; }
.details .hist li { padding: 2px 0 8px 12px; position: relative; color: var(--fg2); font-size: 12.5px; }
.details .hist li::before { content: ""; position: absolute; left: -6px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.details .hist li.superseded::before { background: var(--superseded); }
.details .hist li.open::before { background: var(--open); }
.details .hist li .d { color: var(--fg3); font-size: 11px; }
.details .backlink { display: block; padding: 5px 8px; border-radius: 6px; color: var(--fg); background: var(--bg3); margin-bottom: 4px; font-size: 12.5px; }
.details .backlink:hover { text-decoration: none; background: var(--line); }
.details .finding { font-size: 12px; margin-bottom: 6px; color: var(--fg2); }

.graph-wrap { position: relative; height: calc(100vh - 48px - 24px - 48px); margin: -24px -32px -60px; }
.graph-wrap canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.graph-wrap canvas.grabbing { cursor: grabbing; }
.graph-ui { position: absolute; top: 14px; left: 18px; display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--fg2); background: color-mix(in srgb, var(--bg2) 85%, transparent); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); }
.graph-ui label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
.graph-legend { position: absolute; bottom: 14px; left: 18px; font-size: 11px; color: var(--fg2); display: flex; flex-direction: column; align-items: flex-start; gap: 3px; max-height: calc(100% - 90px); overflow: auto; background: color-mix(in srgb, var(--bg2) 85%, transparent); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); }
.graph-legend > span { white-space: nowrap; }
.graph-legend .dot { width: 9px; height: 9px; margin-right: 4px; vertical-align: middle; }
.graph-hint { position: absolute; bottom: 14px; right: 18px; font-size: 11px; color: var(--fg3); text-align: right; max-width: 40%; }

.timeline svg { width: 100%; height: 260px; display: block; }
.timeline .axis text { fill: var(--fg3); font-size: 10px; }
.timeline .axis line { stroke: var(--line); }
.timeline rect.b { cursor: pointer; }
.timeline rect.b:hover { opacity: .8; }
.timeline .sup { fill: var(--superseded); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 12px; color: var(--fg2); margin: 8px 0 16px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.queue h2 { display: flex; align-items: center; gap: 10px; }
.queue h2 .count { font-size: 13px; }
.queue .why { color: var(--fg2); font-size: 12.5px; margin: -6px 0 10px; }
.note { color: var(--fg3); font-size: 12px; }
.center { text-align: center; color: var(--fg3); padding: 60px 0; }
kbd { font-family: var(--mono); font-size: 11px; background: var(--bg3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.nav-toggle { display: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; color: var(--fg2); cursor: pointer; white-space: nowrap; margin-left: 4px; }

/* ---- phones and small tablets: one column, the sidebar becomes a nav row with a Topics drawer ---- */

  .project-select { min-width: 0; }

  .sidebar { padding: 0; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; position: sticky; top: 0; z-index: 5; }
  .nav { display: flex; align-items: center; overflow-x: auto; gap: 2px; padding: 6px 8px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { padding: 6px 10px; white-space: nowrap; border-radius: 999px; gap: 6px; }
  .nav a.active { box-shadow: none; background: var(--bg3); color: var(--fg); }
  .nav-toggle { display: inline-flex; flex: none; margin-left: auto; }

  .main { padding: 16px 14px 32px; }

}

.badges-pop > b { display: block; color: var(--fg); margin-bottom: 6px; }
.badges-pop .badge-item { padding: 8px 0; border-top: 1px solid var(--line); }
.badges-pop .badge-item img { height: 20px; display: block; margin-bottom: 6px; }
.badges-pop .badge-field { display: grid; grid-template-columns: 36px 1fr auto; gap: 6px; align-items: center; margin-top: 3px; }
.badges-pop .badge-field input { font: 10px var(--mono, monospace); background: var(--bg); color: var(--fg2); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; min-width: 0; }
.loaded-failed { margin-top: 10px; border-top: 2px solid var(--warn); padding-top: 4px; }
.loaded-row.failed .err { color: var(--fg); }
.loaded-row.failed a { word-break: break-all; }
#loaded > a .warn { color: var(--warn); }

/* without JavaScript: a notice, in an export the project's topics and entries as links to its host, and what Keep the Why is */
.nojs { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; line-height: 1.5; }
.nojs a { color: var(--accent2); }
.nojs-brand { display: inline-block; margin-bottom: 8px; }
.nojs-brand img { display: block; height: 29px; width: auto; }
.nojs-need { color: var(--fg2); border-left: 3px solid var(--accent); padding-left: 12px; }
.nojs h1 { font-size: 22px; margin: 24px 0 4px; overflow-wrap: anywhere; }
.nojs h2 { font-size: 17px; margin: 24px 0 6px; }
.nojs ul { padding-left: 20px; margin: 4px 0; }
.nojs li { margin: 3px 0; }
.nojs .nojs-meta { color: var(--fg3); font-size: 13px; }
.nojs-about { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--fg2); }

  <section class="nojs-about">
    <h2>About Keep the Why</h2>
    <p>Keep the Why records the reasoning code cannot explain — decisions, the alternatives that lost, workarounds, constraints — as plain Markdown in the repository, next to the code and versioned with it. A coding agent writes it as the reasons come up and any agent or person reads it back, so a settled question is not reopened and an abandoned change is not tried again.</p>
    <p><a href="https://keepthewhy.com">keepthewhy.com</a> · <a href="https://keepthewhy.com/installation/">Install</a> · <a href="https://keepthewhy.com/dashboard/">The dashboard</a> · <a href="https://github.com/oliver-zehentleitner/keep-the-why">GitHub</a></p>

ifferent shapes; callers and generated clients must match the endpoint’s actual wrapper. Assuming every endpoint uses the same envelope causes empty UI data and mapping bugs.\n\n**Rejected alternative:** force every controller onto a single envelope without a coordinated migration. Desirable long-term, but not current truth — code and clients must handle both until unified.", "reason": "pagination and simple success payloads evolved with different shapes; callers and generated clients must match the endpoint’s actual wrapper. Assuming every endpoint uses the same envelope causes empty UI data and mapping bugs.", "rejected": ["force every controller onto a single envelope without a coordinated migration. Desirable long-term, but not current truth — code and clients must handle both until unified."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}]}, "findings": []}, {"id": "api-contracts.md#openapi-typescript-client-regeneration", "uuid": "a3edfe7d-c661-441f-8a47-b18e853bd245", "file": "api-contracts.md", "line": 21, "end_line": 35, "title": "OpenAPI TypeScript client regeneration", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "project agent notes (`AGENTS.md`); `frontend/openApi/config.backend.ts`", "verification": null, "revisit_when": "OpenAPI generation toolchain or client path changes", "see": [], "superseded_by": null, "body": {"text": "Backend DTO/controller/route changes require regenerating the frontend client (`frontend/src/api/gen/`). Dev flow: backend Development startup writes `frontend/openApi/tallyj.json`; then `npm run gen` from `frontend/`. Never hand-edit generated files.\n\n**Reason:** the generated SDK is the contract surface for stores/services. Hand edits are overwritten and drift from Swagger.\n\n**Rejected alternative:** hand-written fetch wrappers for each new endpoint. Rejected for this project’s scale — regeneration keeps types aligned with the running API.", "reason": "the generated SDK is the contract surface for stores/services. Hand edits are overwritten and drift from Swagger.", "rejected": ["hand-written fetch wrappers for each new endpoint. Rejected for this project’s scale — regeneration keeps types aligned with the running API."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}]}, "findings": []}, {"id": "api-contracts.md#generated-client-error-shape-hey-api", "uuid": "d9ea0e2b-6504-4b4b-89bb-8c43defc4111", "file": "api-contracts.md", "line": 36, "end_line": 49, "title": "Generated client error shape (hey-api)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "`frontend/src/api/gen/configService/client/client.gen.ts` (`throw jsonError`); incident on Calculate Tally showing raw `elections.stageChangeError.*|count=N`", "verification": null, "revisit_when": "client library or global error interceptor normalizes thrown errors to another shape", "see": [], "superseded_by": null, "body": {"text": "With `throwOnError: true`, failed API calls throw the **parsed JSON body** (e.g. `{ message, error, title, ... }`), not an axios-style `{ response: { data } }` wrapper.\n\nUI that must translate server phrase keys (including `elections.stageChangeError.*` with `|count=N` params) should read the message via `extractApiErrorMessage` from `frontend/src/utils/errorHandler.ts`, then pass it through `translateElectionStageChangeError`. Reading only `error.response.data.message` skips the real payload and often falls through to showing the raw key.\n\n**Rejected alternative:** assume axios error nesting in new pages. Rejected — the generated client is fetch-based; StageControl already uses `extractApiErrorMessage` for the same stage-change keys.", "reason": null, "rejected": ["assume axios error nesting in new pages. Rejected — the generated client is fetch-based; StageControl already uses `extractApiErrorMessage` for the same stage-change keys."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-05", "commit": "8df990db"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-05", "commit": "8df990db"}]}, "findings": []}, {"id": "architecture.md#single-backend-host-after-domain-consolidation", "uuid": "c64c71f5-797d-4204-87d0-d459938dc06b", "file": "architecture.md", "line": 3, "end_line": 17, "title": "Single backend host after domain consolidation", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "project agent notes (`AGENTS.md`); domain consolidation, May 2025", "verification": null, "revisit_when": "a second C# application project is introduced, or domain is split out again", "see": [], "superseded_by": null, "body": {"text": "The previous `Backend.Domain` and `Backend.Application` projects were fully merged into the `backend/` host project. There is effectively one C# application project plus `Backend.Tests/` and the Vue SPA under `frontend/`.\n\n**Reason:** agents and contributors kept assuming a multi-project layered layout that no longer exists. Feature work (controllers, services, DTOs, entities, validators, Mapster profiles, SignalR hubs, EF) almost always belongs in `backend/`. DI registration for new services goes in `backend/Program.ServiceRegistration.cs` (`ProgramServiceRegistration.RegisterApplicationServices`, `RegisterAuthServices`, `RegisterBackgroundServices`).\n\n**Rejected alternative:** keep or reintroduce separate Domain/Application class libraries. Rejected for this codebase’s current size and ownership model — the split had become dead weight and produced duplicate or stale guidance.", "reason": "agents and contributors kept assuming a multi-project layered layout that no longer exists. Feature work (controllers, services, DTOs, entities, validators, Mapster profiles, SignalR hubs, EF) almost always belongs in `backend/`. DI registration for new services goes in `backend/Program.ServiceRegistration.cs` (`ProgramServiceRegistration.RegisterApplicationServices`, `RegisterAuthServices`, `RegisterBackgroundServices`).", "rejected": ["keep or reintroduce separate Domain/Application class libraries. Rejected for this codebase’s current size and ownership model — the split had become dead weight and produced duplicate or stale guidance."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}]}, "findings": []}, {"id": "architecture.md#social-preview-urls-are-static-and-pinned-to-production", "uuid": "3cdc2a17-78bd-4178-888f-4fc00ba3c15a", "file": "architecture.md", "line": 18, "end_line": 43, "title": "Social preview URLs are static and pinned to production", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "production host in `ClientEnvResolver` tests (`https://v4.tallyj.com`); UAT host `https://uat.v4.tallyj.com`; `MapFallbackToFile` serves `index.html` for unknown routes", "verification": null, "revisit_when": "v4 production moves off `v4.tallyj.com`, or UAT and production stop sharing one frontend build", "see": [], "superseded_by": null, "body": {"text": "Link previews (LinkedIn, Facebook, Slack, X) read `frontend/index.html`. They do not run the SPA. `/` is that file via static files; deep links are the same file via `MapFallbackToFile`, so the head does not vary by route. `og:url` and `og:image` are absolute `https://v4.tallyj.com` URLs in source. The Azure frontend pipeline rewrites that origin to the UAT host only in the UAT zip.\n\nThe rewrite (`frontend/scripts/set-og-origin.mjs`) changes `og:url`, `og:image`, `twitter:url`, and `twitter:image` only when `new URL(content).origin` is exactly `https://v4.tallyj.com`. A second run whose tags are already the target origin leaves the file unchanged.\n\n**Reason:** one Vite build is copied to UAT and production, and a relative image URL is not reliable for those crawlers. Pinning production means an unmodified `frontend/dist` is correct for production. UAT still previews, because the pipeline that actually deploys there substitutes the origin before packaging. Comparing parsed origins keeps a comment, a non-URL meta value, and a lookalike host (one that only begins with the production origin) out of the substitution. A substring check of the raw origin is the CodeQL incomplete-URL-sanitization finding.\n\n**Rejected alternative:** set the tags from Vue after load. Crawlers would publish an empty card.\n\n**Rejected alternative:** bake the UAT origin into source. Production shares would point crawlers at UAT.\n\n**Rejected alternative:** replace every occurrence of the production origin string. That rewrites comments and lookalike hosts, and the presence check is a URL substring test.\n\n### Practical layout (where to look)\n\n- **Data / persistence:** `backend/Context/MainDbContext.cs`, `Entities/`, `Enumerations/`, `Identity/`, `Interfaces/`\n- **Auth:** `DTOs/Auth/`, `Services/Auth/`, related controllers and validators\n- **Domain features:** `Controllers/`, `DTOs/`, `Services/`, `Validators/`, `Mappings/`, `Hubs/`", "reason": "one Vite build is copied to UAT and production, and a relative image URL is not reliable for those crawlers. Pinning production means an unmodified `frontend/dist` is correct for production. UAT still previews, because the pipeline that actually deploys there substitutes the origin before packaging. Comparing parsed origins keeps a comment, a non-URL meta value, and a lookalike host (one that only begins with the production origin) out of the substitution. A substring check of the raw origin is the CodeQL incomplete-URL-sanitization finding.", "rejected": ["set the tags from Vue after load. Crawlers would publish an empty card.", "bake the UAT origin into source. Production shares would point crawlers at UAT.", "replace every occurrence of the production origin string. That rewrites comments and lookalike hosts, and the presence check is a URL substring test."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-10-02", "commit": "bea5654e"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-10-02", "commit": "bea5654e"}]}, "findings": []}, {"id": "auth.md#jwt-user-id-claim-lookup-on-net-10", "uuid": "59d4555d-e5b4-4c12-a6e2-246895efaf15", "file": "auth.md", "line": 3, "end_line": 21, "title": "JWT user id claim lookup on .NET 10", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "project agent notes (`AGENTS.md`)", "verification": null, "revisit_when": "identity/JWT middleware or claim mapping changes, or .NET major upgrade changes claim defaults again", "see": [], "superseded_by": null, "body": {"text": "User IDs are stored in JWT `sub` claims. Code that reads the current user ID must check both:\n\n```csharp\nUser.FindFirst(ClaimTypes.NameIdentifier)?.Value ?? User.FindFirst(\"sub\")?.Value\n```\n\n**Reason:** on .NET 10, claim type mapping for the subject claim is not always the same as older stacks; reading only `ClaimTypes.NameIdentifier` or only `\"sub\"` fails depending on token and middleware configuration.\n\n**Rejected alternative:** assume a single claim type everywhere. That breaks in one of the two common configurations and produces hard-to-spot auth bugs (null user id, wrong scoping).", "reason": "on .NET 10, claim type mapping for the subject claim is not always the same as older stacks; reading only `ClaimTypes.NameIdentifier` or only `\"sub\"` fails depending on token and middleware configuration.", "rejected": ["assume a single claim type everywhere. That breaks in one of the two common configurations and produces hard-to-spot auth bugs (null user id, wrong scoping)."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-07", "commit": "f1b10763"}]}, "findings": []}, {"id": "auth.md#online-voter-session-is-a-distinct-httponly-cookie", "uuid": "b3f354b1-54e8-45dc-b562-7dc5cbc56269", "file": "auth.md", "line": 22, "end_line": 50, "title": "Online-voter session is a distinct httpOnly cookie", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #250; CodeQL `js/clear-text-storage-of-sensitive-data` on `voter_token` / `voter_id` in localStorage; teller cookie pattern in `SecureCookieMiddleware`", "verification": null, "revisit_when": "voter JWT lifetime or cookie attributes change, or teller/voter sessions must be mutually exclusive", "see": [], "superseded_by": null, "body": {"text": "Online voters use the same JWT claims as before (`voterType=online`, `voterId`, `voterIdType`). Only transport changed.\n\n- **Cookie `voter_token`:** httpOnly, **always** Secure + SameSite=Strict + host-only (no Domain), Path=/ — the session JWT (24h). Never written to `localStorage` / `sessionStorage` and not returned in auth JSON.\n- **Cookie `voter_session=1`:** same attributes except **not** httpOnly — a boolean flag so the SPA can detect a session and call `GET /api/online-voting/me` to restore `voterId`.\n- **Cookie name is not `auth_token`.** Teller and voter JWTs can coexist in one browser. `OnMessageReceived` prefers `voter_token` on `/api/online-voting/*`, `/hubs/all-voters`, and `/hubs/voter-personal`; everywhere else it prefers `auth_token`. Bearer and hub `access_token` query still win when present (tests / tools).\n- **Logout:** `POST /api/online-voting/logout` clears only voter cookies, using the same Secure/Strict/host-only attributes so the browser expires them. Teller logout still clears only teller cookies.\n- **Dev / prod:** local Vite is HTTPS (`:8095`) and proxies `/api` and `/hubs` to HTTP `:5016`. The backend therefore sees `Request.IsHttps == false`. Voter cookies ignore that and stay Secure. UAT/prod are HTTPS.\n\n**Rejected alternative:** copy the teller HTTP-dev exception (`Secure`/`SameSite`/`Domain` from `Request.IsHttps`). Rejected — Vite already presents HTTPS to the browser; issuing `Secure=false` voter cookies behind the proxy is not what operators want. Teller cookies keep that exception in this slice.\n\n**Multi-tab:** cookies are shared across tabs on the same origin. Logging out in one tab clears cookies for all tabs; other tabs discover this on the next `/me` or `availableElections` call (401 → treat as logged out).\n\n**Multi-device:** each device has its own cookie. A new login still notifies other sessions via VoterPersonal `updateVoter` (`login: true`). Logout on device A does not revoke device B’s JWT; B’s cookie lasts until expiry or its own logout.\n\n**Rejected alternative:** reuse `auth_token` for voters. A teller who then votes (or the reverse) would overwrite the other session.\n\n**Rejected alternative:** keep the JWT in the auth response body and only stop persisting it. XSS can still read the response; teller auth already omits tokens from the body.\n\n**Rejected alternative:** encrypt the JWT in `localStorage`. Not a fix under XSS (issue #250 / #249).", "reason": null, "rejected": ["copy the teller HTTP-dev exception (`Secure`/`SameSite`/`Domain` from `Request.IsHttps`). Rejected — Vite already presents HTTPS to the browser; issuing `Secure=false` voter cookies behind the proxy is not what operators want. Teller cookies keep that exception in this slice.", "reuse `auth_token` for voters. A teller who then votes (or the reverse) would overwrite the other session.", "keep the JWT in the auth response body and only stop persisting it. XSS can still read the response; teller auth already omits tokens from the body.", "encrypt the JWT in `localStorage`. Not a fix under XSS (issue #250 / #249)."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-08-30", "commit": "ae0b1e8d"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-08-30", "commit": "ae0b1e8d"}]}, "findings": []}, {"id": "auth.md#idp-first-teller-signup-issue-347", "uuid": "2ed5c466-f555-4b97-8c5d-754a9fecd205", "file": "auth.md", "line": 51, "end_line": 71, "title": "IdP-first teller signup (issue #347)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #347; product decision 2026-09-16 (maintainer)", "verification": null, "revisit_when": "another teller IdP is added, or open register is reconsidered", "see": [], "superseded_by": null, "body": {"text": "New teller/admin accounts are created through Google (teller external auth: `google/login`, `google/one-tap`). Open anonymous `POST /api/auth/registerAccount` is disabled and returns the i18n key `auth.errors.openRegisterDisabled`. Existing local email/password **login** is unchanged.\n\nThe SPA `/register` page without an invite query explains Google-first signup and sends the user to Google or `/login`. Login copy steers new tellers to Google.\n\n**Rejected alternative:** keep v3-style open email/password register and add captcha. Live v3 already sees spam Admin Registered accounts; captcha is not the strategy.\n\n> Superseded 2026-09: “build invite-only email signup later.” That leftover is now the SuperAdmin one-time invite path below.\n\n**Rejected alternative:** remove `POST /api/auth/registerAccount` entirely. Leftover clients still get a clear i18n error instead of a silent 404. The endpoint is still rate-limited.\n\nTesting/Development accept the same `dev-google:{email}` credential as voter Google tests so teller create/login can be mocked without calling Google.", "reason": null, "rejected": ["keep v3-style open email/password register and add captcha. Live v3 already sees spam Admin Registered accounts; captcha is not the strategy.", "remove `POST /api/auth/registerAccount` entirely. Leftover clients still get a clear i18n error instead of a silent 404. The endpoint is still rate-limited."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-17", "commit": "ea96cc41"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-17", "commit": "ea96cc41"}]}, "findings": []}, {"id": "auth.md#superadmin-one-time-invite-for-local-email-password-signup-issue-347-leftover", "uuid": "3f670597-82d5-4528-8136-e462929335e8", "file": "auth.md", "line": 72, "end_line": 94, "title": "SuperAdmin one-time invite for local email/password signup (issue #347 leftover)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #347 leftover after #348; product rule for communities that cannot use Google", "verification": null, "revisit_when": "invites should be bound to a pre-filled email, Head Teller should issue them, or captcha is added on this path only", "see": [], "superseded_by": null, "body": {"text": "Communities that cannot use Google get a **one-time invite link**, not open register. SuperAdmin (`POST /api/superadmin/account-invites`) issues the link. The raw token is returned once and stored only as SHA-256. Anonymous `GET /api/auth/account-invite` peeks it; `POST /api/auth/registerWithInvite` consumes it and calls existing `LocalAuthService.RegisterAsync` (same Identity `AppUser` store, same verification email). After use or expiry (7 days) the invite is dead. Open `registerAccount` stays disabled.\n\n`/register?invite=` shows the email/password form only when peek says the token is still usable. SuperAdmin Users has “Issue email/password invite.”\n\n**Rejected alternative:** let Head Teller issue invites. `HeadTellerAccess` is election-route-scoped (user + election GUID). Creating a site-wide login account is not an election privilege, so SuperAdmin is the issuer.\n\n**Rejected alternative:** a second user table or a parallel register service. Invite redeem must go through `RegisterAsync` so password rules, unique email, and verification stay one path.\n\n**Rejected alternative:** bind the invite to a SuperAdmin-chosen email in this slice. The product asked for a one-time link that creates one account; the invitee picks the address. Binding can be added later if leaked-link squat becomes a problem.\n\n**Rejected alternative:** captcha on this path. Optional later hardening only; not the strategy and not in this slice.\n\n**Rejected alternative:** skip email verification on invite create so login works immediately. Invite only authorizes *creating* the row; proving inbox ownership stays the existing local-account pattern. Tests confirm the email, then password login succeeds.", "reason": null, "rejected": ["let Head Teller issue invites. `HeadTellerAccess` is election-route-scoped (user + election GUID). Creating a site-wide login account is not an election privilege, so SuperAdmin is the issuer.", "a second user table or a parallel register service. Invite redeem must go through `RegisterAsync` so password rules, unique email, and verification stay one path.", "bind the invite to a SuperAdmin-chosen email in this slice. The product asked for a one-time link that creates one account; the invitee picks the address. Binding can be added later if leaked-link squat becomes a problem.", "captcha on this path. Optional later hardening only; not the strategy and not in this slice.", "skip email verification on invite create so login works immediately. Invite only authorizes *creating* the row; proving inbox ownership stays the existing local-account pattern. Tests confirm the email, then password login succeeds."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-17", "commit": "4a57207e"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-17", "commit": "4a57207e"}]}, "findings": []}, {"id": "auth.md#proxy-aware-auth-rate-limits-issue-192-leftover", "uuid": "6c66be65-d553-4625-a555-08c1f10a66bf", "file": "auth.md", "line": 95, "end_line": 136, "title": "Proxy-aware auth rate limits (issue #192 leftover)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #192 remaining work; PR #328 review — leftmost XFF is client-spoofable; Azure Front Door docs (append socket IP)", "verification": null, "revisit_when": "ingress changes (no longer App Service / Front Door), venue halls regularly exceed the 60/min IP ceiling, or rate limits move off the in-memory middleware", "see": [], "superseded_by": null, "body": {"text": "> Superseded 2026-09: keying on the **leftmost** X-Forwarded-For / Forwarded IP. Azure Front Door and App Service **append** the connecting socket IP. Leftmost is whatever the client sent (`fake` or `fake, real`), so a new leftmost address opened a new 5/min bucket and bypassed the limit.\n\n> Superseded 2026-09: keying on `RemoteIpAddress` after `UseForwardedHeaders` applies XFF with ForwardLimit 2. Tried after the rightmost-public design and reverted — trust-all + a hop limit can still rewrite RemoteIp from a client-controlled chain.\n\nAuth rate-limit keys use the IP the **trusted ingress** saw, not a client-supplied leftmost address.\n\n- **No proxy hop** (public `RemoteIpAddress`): key is that address. XFF / Forwarded are ignored so a direct client cannot pick a bucket.\n- **Infrastructure peer** (`RemoteIpAddress` is null, loopback, or private — TestServer, App Service ARR, Docker): parse XFF (else RFC 7239 `Forwarded`) and take the **rightmost public** IP. That is the socket address the platform appended. Private / loopback / link-local / CGNAT (100.64/10) suffix hops are skipped. Two connecting clients behind one proxy therefore get two buckets; changing only the leftmost XFF stays in the same bucket.\n\n`UseForwardedHeaders` is proto-only (`X-Forwarded-Proto`) with KnownProxies / KnownIPNetworks / KnownNetworks cleared so Azure TLS termination still sets `Request.IsHttps`. It does **not** apply `X-Forwarded-For`: trust-all + ForwardLimit would rewrite `RemoteIpAddress` from the client-controlled chain and make spoofing easier. Rate-limit keying reads the headers itself under the infrastructure-peer check above.\n\nThe same in-memory middleware still owns the limits. Teller `/api/auth/login` (and the disabled register endpoint / 2FA / password / teller OAuth) stay **tight per trusted-ingress IP** (5/min login). Anonymous voter `requestCode` / `verifyCode` do **not** use that 5/min IP bucket: elections often share one venue WiFi / community NAT, so a public `RemoteIp` is the whole hall. Those routes use a **5/min per VoterId** bucket (JSON body peek capped at 16 KiB even when ContentLength is missing / chunked; a fitting body is replaced with a MemoryStream at position 0 so model binding still works) plus a **60/min per trusted-ingress IP** venue ceiling. Oversized / peek-overflow bodies are **413** (`error.payloadTooLarge`) and do not continue to model binding — they must not be demoted to `missing:{ip}`, or a padded body with a real voterId would opt out of the cross-IP identifier ceiling. `missing:{ip}` is only for a genuinely empty, malformed, or absent `voterId`. Voter OAuth (`/api/online-voting/*Auth`) has no VoterId in the body — venue IP ceiling only. Teller OAuth stays on the tight IP table.\n\n429 bodies return the i18n key `error.tooManyRequests` (same pattern as voter verify keys). That string lives only in `frontend/src/locales/en/errors.json`; other locales are not given English placeholders (missing keys fall back to English). The SPA resolves those keys instead of a single generic verify message. `VerifyAttempts` on `OnlineVoter` still locks five failed codes for that row; the middleware 429 is a cheap pre-service cap. The fifth mismatch returns `tooManyAttempts` on that call so the row lock is reachable under the 5/min per-VoterId middleware ceiling (a sixth HTTP call would otherwise be 429 first).\n\n**Rejected alternative:** leftmost XFF as “original client.” Front Door’s own docs say an existing XFF is appended; the left side is attacker-controlled.\n\n**Rejected alternative:** `UseForwardedHeaders` for XFF with KnownProxies cleared and ForwardLimit 2. That trust-all walk can set `RemoteIpAddress` to a spoofed entry, after which a “use RemoteIp” key is also spoofable.\n\n**Rejected alternative:** keep keying on `RemoteIpAddress` only. On Azure UAT that address is the platform hop, so one client locks everyone out or the limit never isolates a single attacker.\n\n> Superseded 2026-09: treat used and never-issued as one `noCodeFound` key. A consumed OTP still leaves `VerifyCodeDate` set after `VerifyCode` is cleared, so tellers can tell “already used” from “never issued.” See the verify-error keys section below.\n\n**Rejected alternative:** split venue clients by trusting leftmost XFF. That reopens the spoof bypass. Two clients Azure actually distinguishes (two public RemoteIps, or two rightmost-public hops behind an infrastructure peer) stay two IP buckets; people behind one real public NAT share the venue ceiling and are separated by VoterId.\n\n**Rejected alternative:** keep 5/min per IP on `requestCode` / `verifyCode`. A hall on one public address locks after a few voters — the opposite of the Front Door “one proxy hop” problem.\n\n**Rejected alternative:** treat a too-large peek as a missing voterId (`missing:{ip}`). The request would still bind and send SMS/email for the real voterId, so padding past 16 KiB evaded the global per-identifier cap (N IPs × 5/min).\n\n**Rejected alternative:** endpoint filter or service-level identifier limit as the primary mechanism. An endpoint filter sees the bound DTO but would split IP vs identifier across two pipeline stages. Service-level already has `VerifyAttempts`; it runs after routing/DB work and still needs an IP ceiling in middleware. Reading a capped body prefix in the existing middleware keeps both buckets in one place.\n\n**Rejected alternative:** rebuild on ASP.NET `RateLimiter` or add a new auth flow. #192 said do not rebuild auth; this slice only fixes keying, coverage, and i18n bodies.", "reason": null, "rejected": ["leftmost XFF as “original client.” Front Door’s own docs say an existing XFF is appended; the left side is attacker-controlled.", "`UseForwardedHeaders` for XFF with KnownProxies cleared and ForwardLimit 2. That trust-all walk can set `RemoteIpAddress` to a spoofed entry, after which a “use RemoteIp” key is also spoofable.", "keep keying on `RemoteIpAddress` only. On Azure UAT that address is the platform hop, so one client locks everyone out or the limit never isolates a single attacker.", "split venue clients by trusting leftmost XFF. That reopens the spoof bypass. Two clients Azure actually distinguishes (two public RemoteIps, or two rightmost-public hops behind an infrastructure peer) stay two IP buckets; people behind one real public NAT share the venue ceiling and are separated by VoterId.", "keep 5/min per IP on `requestCode` / `verifyCode`. A hall on one public address locks after a few voters — the opposite of the Front Door “one proxy hop” problem.", "treat a too-large peek as a missing voterId (`missing:{ip}`). The request would still bind and send SMS/email for the real voterId, so padding past 16 KiB evaded the global per-identifier cap (N IPs × 5/min).", "endpoint filter or service-level identifier limit as the primary mechanism. An endpoint filter sees the bound DTO but would split IP vs identifier across two pipeline stages. Service-level already has `VerifyAttempts`; it runs after routing/DB work and still needs an IP ceiling in middleware. Reading a capped body prefix in the existing middleware keeps both buckets in one place.", "rebuild on ASP.NET `RateLimiter` or add a new auth flow. #192 said do not rebuild auth; this slice only fixes keying, coverage, and i18n bodies."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "cc810f33"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "cc810f33"}]}, "findings": []}, {"id": "auth.md#distinct-voter-verify-error-keys-issue-192-leftover", "uuid": "0cf32f17-32a1-45fc-a73e-2adc5a2d3a8b", "file": "auth.md", "line": 137, "end_line": 162, "title": "Distinct voter verify error keys (issue #192 leftover)", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #192 remaining checklist; existing `{ error }` 400 bodies and `messageKey` i18n keys; `OnlineVoter.VerifyCodeDate` is not cleared on success", "verification": null, "revisit_when": "used OTPs must be remembered across a later `requestCode`, or mismatch remaining-attempts should move off the 400 body", "see": [], "superseded_by": null, "body": {"text": "`POST /api/online-voting/verifyCode` keeps the existing `{ error }` body. The keys are stable phrase keys, not English and not a second error protocol.\n\n- `voting.auth.verify.codeExpired` — live row, code older than 15 minutes\n- `voting.auth.verify.alreadyUsed` — `VerifyCode` empty and `VerifyCodeDate` set (consumed OTP; date is the issue time of the code that was used)\n- `voting.auth.verify.noCodeFound` — `VerifyCode` empty and `VerifyCodeDate` null (never issued)\n- `voting.auth.verify.tooManyAttempts` — five failed mismatches on that row (`VerifyAttempts`)\n- `voting.auth.verify.invalidCode` — mismatch with attempts left; 400 also includes `attempts` (remaining). The service still encodes `invalidCode:N` internally; the controller splits that into the stable key plus `attempts` so the SPA can interpolate `{attempts}`\n- `error.tooManyRequests` — middleware 429, not a verify-row lock\n\nThe voter login page runs those keys through `resolveUserFacingApiError` (and understands a leftover `invalidCode:N` string). It does not collapse them into `voting.auth.verify.failed`.\n\n**Rejected alternative:** keep used and never-issued as one `noCodeFound`. The issue asked for an “already used” key. Distinguishing them does not need a new column: success clears `VerifyCode` and leaves `VerifyCodeDate`.\n\n**Rejected alternative:** keep `voting.auth.verify.invalidCode:4` as the public `error` string. That is not a stable i18n key; `te()` misses it and the UI shows the raw suffix. Remaining count stays a sibling field.\n\n**Rejected alternative:** store a used-code hash so a later `requestCode` can still say “already used” for the old code. After a new code is issued the old one is simply a mismatch; only a replay with no new request is `alreadyUsed`.", "reason": null, "rejected": ["keep used and never-issued as one `noCodeFound`. The issue asked for an “already used” key. Distinguishing them does not need a new column: success clears `VerifyCode` and leaves `VerifyCodeDate`.", "keep `voting.auth.verify.invalidCode:4` as the public `error` string. That is not a stable i18n key; `te()` misses it and the UI shows the raw suffix. Remaining count stays a sibling field.", "store a used-code hash so a later `requestCode` can still say “already used” for the old code. After a new code is issued the old one is simply a mismatch; only a replay with no new request is `alreadyUsed`."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-21", "commit": "97fc9117"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-21", "commit": "97fc9117"}]}, "findings": []}, {"id": "auth.md#pre-auth-voter-code-delivery-channel-issue-229", "uuid": "25430887-ee58-442f-bf90-34105b5781d9", "file": "auth.md", "line": 163, "end_line": 186, "title": "Pre-auth voter-code delivery channel (issue #229)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #229 security notes; v3 VoterCodeHub used a short client key; 2026-09-20 product decision to ship live status", "verification": null, "revisit_when": "channel tokens must survive a multi-instance farm, or join should be one-shot with no reconnect", "see": [], "superseded_by": null, "body": {"text": "Live delivery status for SMS/voice/email login uses an **anonymous** SignalR hub (`/hubs/voter-code`). Isolation is the unguessability of a **server-issued** token, not JWT (the voter is not authenticated yet).\n\n- Token is 256 bits of CSPRNG, returned once on `requestCode`, stored only as SHA-256, TTL 10 minutes.\n- One live joiner; reconnect after disconnect is allowed until TTL.\n- Hub payloads are status + i18n key only. The one-time code is never sent on the hub (dev echo remains HTTP-only in Development/Testing).\n- No extra PII: the verify step already shows the contact the voter typed; status strings do not repeat phone/email.\n- Rate limits and SMS-pumping gates are unchanged and run **before** a channel exists.\n\n**Rejected alternative:** reuse AllVoters / VoterPersonal (need an online-voter JWT). Rejected — this is the login request, before verify.\n\n**Rejected alternative:** client-generated channel key (v3). Rejected as too weak.\n\n**Why 10 minutes, not 15:** the OTP window is 15 minutes; the status channel only needs to cover send + Twilio callbacks + a reconnect. A leaked token should die before the code does.\n\nSee `context/realtime.md` for hub groups, replay-on-join, and provider wiring.", "reason": null, "rejected": ["reuse AllVoters / VoterPersonal (need an online-voter JWT). Rejected — this is the login request, before verify.", "client-generated channel key (v3). Rejected as too weak."], "consequence": null, "considered": null, "why_open": null}, "refs": ["realtime.md"], "git": {"created": {"author": "Glen Little", "date": "2026-09-20", "commit": "3656ee76"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-20", "commit": "3656ee76"}]}, "findings": []}, {"id": "ballot-validation.md#count-reconciliation-report-issue-190", "uuid": "20743a60-9337-4e2e-93d7-d08ab12f5134", "file": "ballot-validation.md", "line": 20, "end_line": 54, "title": "Count reconciliation report (issue #190)", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "issue #190 remaining items + current v4 data model; v3 Reconcile page is not in this repo", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "Tellers need **which rows** do not reconcile before Analyze and Finalize — not only the existing finalization summary blockers (missing analysis, outstanding/review ballots, unresolved ties). Those gates stay. This report is a live count check, not a second readiness system: `ElectionCountReconciliation` is called from the same Analyze/Finalize path (`TallyService.Calculate*` and `ElectionStageFinalizationReadiness`).\n\n### What v4 can identify as rows\n\n- **Pending online:** each `OnlineVotingInfo` in `Submitted` or `Processing` whose person has **no** Front Desk method other than Online, named from `Person`. Processed rows are not pending (acceptance is not reversible; do not re-link accepted ballots). A leftover Submitted row after the person already checked in another way is not a live online vote (Accept-all will not create a ballot) and does not block Analyze.\n- **Duplicate envelope number:** two or more people share `EnvNum`.\n- **Duplicate voting path:** a paper/imported Front Desk method (`P`/`M`/`D`/`C`/`I`/`1`/`2`/`3`) plus a **Processed** online row for the same person (two counted paths). Pending leftover after a method switch is not this kind.\n\n### Front Desk vs ballot count\n\nPaper and accepted-online ballots have no `PersonGuid`. v4 cannot name which paper voter lacks a ballot. When residual counts differ, the report emits one `FrontDeskVsBallots` row with the two totals.\n\nFront Desk side (accounted): people with a voting method, or a **Processed** online row. v4 submit/accept does not set `VotingMethod`, so Processed is the person-level record that an accepted online vote exists. Live pending online people (no other method) are excluded from that count (they have no `Ballot` yet) and appear as their own rows. People who already recorded another method stay in the Front Desk total even if a leftover pending online row still exists.\n\nBallot side: every entered ballot, **including spoiled** (`StatusCode != Ok`). Analysis already uses `BallotsReceived + SpoiledBallots` vs envelope totals for `UseOnReports`. Excluding spoiled from this check would invent a false Front Desk mismatch.\n\n### What does not apply as a count-reconciliation row\n\n- **`BallotStatus.Dup`:** duplicate names on one ballot. That is ballot quality; those ballots are spoiled (`Status != Ok`) and already visible on the ballot list. Not a voter-vs-ballot identity match.\n- **Spoiled ballots as their own mismatch type:** spoiled exclusion is a **rule** (include them in the entered-ballot total), not a list of “wrong” ballots. A spoiled ballot that matches a Front Desk registration is reconciled.\n- **Reconnecting accepted online ballots to `OnlineVotingInfo`:** `BallotGuid` is wiped on Accept-all. The report must not invent that link.\n\n**Rejected alternative:** a parallel “readiness v2” API unused by Analyze/Finalize. Rejected — tellers would see a report that does not actually gate those actions.\n\n**Rejected alternative:** treat pending online as Processed for the Front Desk count. Rejected — pending rows are not ballots until Accept-all.\n\n**Reason:** issue #190 asked for a teller-visible row-level report that blocks Analyze/Finalize when counts do not reconcile, using the existing readiness path.", "reason": "issue #190 asked for a teller-visible row-level report that blocks Analyze/Finalize when counts do not reconcile, using the existing readiness path.", "rejected": ["a parallel “readiness v2” API unused by Analyze/Finalize. Rejected — tellers would see a report that does not actually gate those actions.", "treat pending online as Processed for the Front Desk count. Rejected — pending rows are not ballots until Accept-all."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-04", "commit": "b30b54b7"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-04", "commit": "b30b54b7"}]}, "findings": []}, {"id": "election-analysis.md#v3-comparison-is-a-harness-not-an-engine-rewrite", "uuid": "de0b2500-5a5c-46fa-be7d-0cf7eba6b4a8", "file": "election-analysis.md", "line": 21, "end_line": 41, "title": "v3 comparison is a harness, not an engine rewrite", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #168 (evidence: issue #168 remaining checklist; no v3 packages in this repo)", "verification": null, "revisit_when": "2–3 known-good v3 packages (simple + ties + extras) are added under `Backend.Tests/Fixtures/V3AnalysisComparison/known-good-v3/`", "see": [], "superseded_by": null, "body": {"text": "Remaining #168 work is import → Analyze → diff of `ResultSummary`, `ResultTies`, and person counts. The analyzer, tie-break, and extras handling already exist (#198 is the product follow-up). Report HTML/PDF vs v3 is #185.\n\n**Chosen:** a reusable test harness that imports a TallyJ v3 XML package, snapshots expected analysis from `expected.json` or from analysis rows already in the package, re-runs the v4 analyzer, and diffs C/F summaries, ties, and name-keyed counts. Synthetic `simple` / `ties` / `extras` packages ship only to prove that pipeline. They are not production elections.\n\n**Rejected alternative:** invent “known-good v3” totals and assert they match. Rejected — there are no golden files or real packages in the tree; fabricated numbers would claim parity that was never checked.\n\n**Rejected alternative:** rewrite or “port” the analyzer as the #168 deliverable. Rejected — the issue is comparison against known-good v3 results.\n\n**Rejected alternative:** point automated tests at Azure SQL. Rejected — Backend.Tests stay on local InMemory/SQLite; live comparison in the app can use local Docker SQL + SeedOnStartup.\n\n**Rejected alternative:** require a separate `expected.json` for every real package. Rejected — a v3 export after Analyze already carries `resultSummary` / `result` / `resultTie`; import remaps GUIDs, so the harness snapshots those rows (by name) before re-analysis.", "reason": null, "rejected": ["invent “known-good v3” totals and assert they match. Rejected — there are no golden files or real packages in the tree; fabricated numbers would claim parity that was never checked.", "rewrite or “port” the analyzer as the #168 deliverable. Rejected — the issue is comparison against known-good v3 results.", "point automated tests at Azure SQL. Rejected — Backend.Tests stay on local InMemory/SQLite; live comparison in the app can use local Docker SQL + SeedOnStartup.", "require a separate `expected.json` for every real package. Rejected — a v3 export after Analyze already carries `resultSummary` / `result` / `resultTie`; import remaps GUIDs, so the harness snapshots those rows (by name) before re-analysis."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-12", "commit": "c3b4c5de"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-12", "commit": "c3b4c5de"}]}, "findings": []}, {"id": "election-analysis.md#tie-break-counts-save-0-and-unset", "uuid": "41bc2d5c-90a3-4e98-8b4d-27615fc7fec2", "file": "election-analysis.md", "line": 42, "end_line": 67, "title": "Tie-break counts: save, 0, and unset", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "issue #198; TallyJ-3.0 `Analyze.cshtml.js` `saveTieCounts` and `ElectionAnalyzerCore.AnalyzeTieGroup` (evidence: v3 `SaveTieCounts` + `ElectionAnalyzerCore`; issue #198 remaining items)", "verification": null, "revisit_when": "known-good v3 packages with extras/tie-break land for #168", "see": [], "superseded_by": null, "body": {"text": "v3 always re-ran analysis after saving tie-break counts (the Analyze button is “Save Counts & Re-run Analysis”). It sent every input, including 0 (blank was coerced to 0). All-0 was accepted and stayed unresolved because every member still had the same count. After a required-tie analysis, v3 filled missing `TieBreakCount` with 0, so default and explicit 0 were the same.\n\n**Chosen:**\n- `SaveTieCountsAsync` re-analyzes whenever any count is persisted, including a single member of a group and all-0. Partial counts already change rank (`ThenByDescending` on `TieBreakCount ?? 0`).\n- All-0 is valid input. Ranking treats every 0 as equal, so the tie stays unresolved and `UseOnReports` stays false.\n- Persist null for “not entered” and 0 for an explicit runoff result. Required ties no longer coerce null to 0. Sort and still-tied checks still treat null as 0.\n- The tie-management page sends explicit 0 when a field is cleared (otherwise a previous count would stay on the server) and refreshes stored results after save.\n- Reports show `/ {count}` only when a count was entered (including 0). Unset omits the suffix. Main `HasTies` is `TieBreakRequired` on the elected/extra rows, not a slash in the display string.\n\n**Rejected alternative:** re-analyze only when every group member `HasValue`. Rejected — that is not v3 behavior, and it would skip re-rank after a partial save once required ties stop filling 0.\n\n**Rejected alternative:** reject all-0 as invalid. Rejected — v3 accepted those values; they simply do not resolve the tie.\n\n**Rejected alternative:** keep filling required ties with 0 (`??= 0`). Rejected — that is what made default and explicit 0 indistinguishable, which #198 asked to separate.\n\n**Rejected alternative:** concatenate `TieBreakCount` whenever the tie is required. Rejected — that printed `\" / \"` (C#) or `\" / null\"` (Vue) for unset, and made `HasTies` false until a count was typed.", "reason": null, "rejected": ["re-analyze only when every group member `HasValue`. Rejected — that is not v3 behavior, and it would skip re-rank after a partial save once required ties stop filling 0.", "reject all-0 as invalid. Rejected — v3 accepted those values; they simply do not resolve the tie.", "keep filling required ties with 0 (`??= 0`). Rejected — that is what made default and explicit 0 indistinguishable, which #198 asked to separate.", "concatenate `TieBreakCount` whenever the tie is required. Rejected — that printed `\" / \"` (C#) or `\" / null\"` (Vue) for unset, and made `HasTies` false until a count was typed."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-12", "commit": "195ecd43"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-12", "commit": "195ecd43"}]}, "findings": []}, {"id": "election-analysis.md#analyze-manual-voter-counts-persist-m-without-re-running-analyze", "uuid": "113c7b29-ae99-4ded-ae04-3b13dccc5f97", "file": "election-analysis.md", "line": 68, "end_line": 91, "title": "Analyze manual voter counts persist M without re-running Analyze", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "TallyJ-3.0 Analyze count table (Calculated / Override / Final); v4 count-reconciliation gate (evidence: v3 `AfterController.SaveManual` / `ResultsModel.SaveManualResults`; issue #186)", "verification": null, "revisit_when": "Analyze is allowed to run without a reconciled Front Desk vs ballot report", "see": [], "superseded_by": null, "body": {"text": "v3’s Analyze page had Eligible Voters and method counts (In Person, Dropped Off, Mailed In, Called In, custom) with an Override column. Save Values wrote `ResultType = M`. Online and Imported stayed calculated-only. Analyzer `CombineCalcAndManualSummaries` already applies `manual ?? calculated` into Final.\n\nv3 re-ran analysis immediately after SaveManual. v4 Save Values only persists M (`GET/POST .../manual-counts`). The next Calculate applies the overrides and rewrites stored F via `CombineCalcAndManualSummaries`. That keeps Analyze behind the count-reconciliation / pending-online gates (#190).\n\nThe panel API’s Final column is always `manual ?? calculated`. It does not read stored F. After Save Values, Override and Final must agree even when an old F row is still on disk.\n\nThis table is v3 count-override parity (method counts and optional Eligible Voters). It is not a special-person workflow.\n\n**Rejected alternative:** re-analyze on save, matching v3. Rejected — v4 Analyze is blocked while Front Desk and ballots do not reconcile; a silent re-run would skip that gate.\n\n**Rejected alternative:** show stored F as the panel Final. Rejected — Save Values would leave Final stale until Calculate.\n\n**Rejected alternative:** invent override columns for Online or Imported. Rejected — v3 left those calculated-only.\n\n**Rejected alternative:** treat this table as #198 tie/extra counts. Rejected — `SaveTieCounts` is a different Analyze control.", "reason": null, "rejected": ["re-analyze on save, matching v3. Rejected — v4 Analyze is blocked while Front Desk and ballots do not reconcile; a silent re-run would skip that gate.", "show stored F as the panel Final. Rejected — Save Values would leave Final stale until Calculate.", "invent override columns for Online or Imported. Rejected — v3 left those calculated-only.", "treat this table as #198 tie/extra counts. Rejected — `SaveTieCounts` is a different Analyze control."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Glen Little", "date": "2026-09-13", "commit": "b3133108"}, "last_touched": {"author": "Oliver Zehentleitner AIgent", "date": "2026-10-06", "commit": "0b9a762"}, "status_history": [{"status": "active", "author": "Glen Little", "date": "2026-09-13", "commit": "b3133108"}]}, "findings": []}, {"id": "election-state.md#lock-after-analysis-is-the-finalized-stage", "uuid": "878a188a-c68b-4274-8488-e337ee479362", "file": "election-state.md", "line": 15, "end_line": 44, "title": "Lock after analysis is the Finalized stage", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "inferred (issue #172 names; implementation in `ElectionService.ChangeElectionStageAsync`); people/ballot write gate and online-submit refusal confirmed by issue #308", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "There is no separate `Locked` flag. After analysis is complete and counts reconcile, advancing to **Finalized** is the lock:\n\n- Finalization is rejected until `ElectionStageFinalizationReadiness` is ready (analysis present and reportable, no blocking ballots, no unresolved ties, counts reconcile, and the online voting window is not currently open).\n- When online voting is enabled and the window is currently open (same rule as voter submit / available-elections: `UseOnlineVoting` plus open/close vs now; a null open or close does not close the window), stage change **to** Finalized is refused (`elections.stageChangeError.onlineVotingStillOpen`). Tellers must close the window first. Finalize does not auto-close it. Elections with online voting off, a future-only window, or an already-closed window can still Finalize.\n- Leaving Finalized requires `ConfirmLeavingFinalized`. StageControl asks a FullTeller to confirm (`useConfirmDialog`) and only then calls `setStage` with the flag. Cancel leaves the election Finalized (no API call). Guests never see the stage switcher (`AppSidebar` `v-if=\"!isGuest\"`); the stage API still requires `FullTellerAccess`.\n\n**Rejected alternative:** treat the API 409 (`elections.stageChangeEr
